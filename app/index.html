<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- **قرصةُ الطفل حرة** (بلاغُ الميدان الثاني في اقرأ، ١١ أغسطس ٢٠٢٦ — `read@7f18bf0`
       نقضَ `read@9220ab1`): قفلُ المقياس الشامل ورثناه علاجاً لعيبٍ حقيقيّ (iPadOS يسترجع
       المثبَّتَ من الخلفية مكبَّراً أحياناً)، **فنقضه الميدانُ**: الطفل كان يكبّر الصفحةَ
       بالقرصة ليرى التشكيل — «أمرٌ مريح وتلقائي» — والقفلُ حرمه إياه. تحويطٌ أوسعُ من عيبه،
       والعلاجُ يعود إلى موضع العيب وحدَه.
       فيبقى منه: العودةُ من الخلفية تشدّ المقياسَ ١ لحظةً ثم تردّ الحريةَ (`resetZoom` في
       `main.js`)، و`touch-action: manipulation` يُسقط تكبيرَ النقر المزدوج ومهلتَه ولا يمسّ
       القرصةَ المتعمَّدة.
       **ولوحُ الكتابة محروسٌ من جهته لا بالقفل العام**: `.pen-surface` عليه
       `touch-action: none` وهو أخصُّ فيغلب — فإصبعُ الطفل يكتب ولا يمرّر ولا يقرص فوق اللوح.
       وصفحاتُ التعريف كانت خارج القفل وتبقى قابلةً للتكبير (تلك للكبار). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="اُكْتُبْ — يعلّم طفلك كتابة العربية بيده: بدايةَ الحرف واتجاهَه وترتيبَه">
  <meta name="theme-color" content="#DAD8FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#DAD8FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="اكتب">
  <title>اُكْتُبْ — تعلّم الكتابة العربية</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <p class="boot">يُحمَّل التطبيق…</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="boot">هذا التطبيق يحتاج تفعيل جافاسكربت في المتصفّح.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
