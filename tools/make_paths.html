      // همزةُ أ وإ من القانونيّ (أُلّفت بإيماءتها — حكم ٥ توطئةً لهمزات ق٣)
      for (const placed of unit.ref.marks) markStrokes.push({ ...placed, why: unit.text });
    } else if (unit.extras.length) {
      throw new Error(`«${text}»/«${unit.text}»: زوائدُ في الخيال (${unit.extras.length}) لا يعرفها قانونيُّه`);
    }
    if (!JOINS_AFTER[unit.text.at(-1)] || unit.wordEnd) close();

    // حركاتُ الوحدة ضرباتٌ بإيماءات علاماتها القانونية — بترتيبها في الرسم
    if (unit.marks.length) {
      for (const { mark, blobs } of unitMarks(unit, chars)) {
        const canonMark = canonMarks[mark];
        if (!canonMark) throw new Error(`«${text}»: لا إيماءةَ قانونيةً للعلامة «${mark}»`);
        const tm = fitTransform(canonMark.box, groupBox(blobs), text, mark);
        for (const stroke of canonMark.strokes) {
          markStrokes.push({
            points: stroke.points.map(tm.map),
            folds: carryFolds(stroke.folds, stroke.points.map(tm.map), 0, scale, dropped, `${text}/${mark}`),
            why: mark,
          });
        }
      }
    }
    // **وحبرُ الحرف حدُّ مساره في الكلمة**: نظيرُ «المسارُ داخلَ خيال حرفه» مرفوعاً إلى
    // الكلمة — فمسارٌ يتعدّى جسدَه إلى جسد جاره يمشي حبراً يمشيه غيرُه، فينطبق شقّان
    // من المسار بلا إعلان طيّة ويصير للموضع الواحد طولان. ويُقاس ولا يُفترَض.
    const own = depthIn(studioWord, [...unit.ref.strokes, ...unit.ref.marks].flatMap((st) => st.points),
      unit.bodyMask);
    meta.units.push({
      text: unit.text, form: unit.form, scale: round1(tr.s * 100) / 100, stray: own.out,
    });
  }
  close();

  // القطعُ ثم ضرباتُ العلامات ثم النقاط — والطيّاتُ تُحمَل عبر إعادة التوزيع أطوالاً،
  // والشوارد تُرَدّ إلى الحبر قبل التوزيع (فلا يبقى بعده طرفٌ على حافّة تقريب)
  const strokes = [
    ...runs.map((r, i) => resampleStroke({ ...r, points: snapIntoInk(r.points, studioWord.mask) }, dropped, `${text}#${i + 1}`, scale, ink)),
    ...markStrokes.map((m) => resampleStroke({ ...m, points: snapIntoInk(m.points, studioWord.mask) }, dropped, `${text}/${m.why}`, scale, ink)),
  ];
  // **وصندوقُ المادّة يسافر معها**: مربّعٌ للكلمة وسطرٌ عريضٌ للجملة — يقرؤه اللوحُ
  // فيرسم بمقاسه، ويقرؤه الحارسُ فيقيس عليه. (ويسقط إن كان مربّعاً، فلا رقمَ زائد.)
  const box = studioWord.cal.box;
  const ref = { strokes, dots, line: round1(studioWord.line), tolerance: scale };
  if (box && box[0] !== GRID) ref.box = [box[0], box[1]];

  // **المسارُ داخل خيال الكلمة** — الغَوصُ يُقاس نقطةً نقطة كما في الحرف، **وشكواه
  // تسمّي قطعتَها** (سنّةُ الجلسة ٧: العطبُ يسمّي موضعَه، فلا يُبحَث في كلمةٍ كلِّها)
  const labels = [...runs.map((r, i) => `قطعة ${i + 1} (${(r.at || []).join('')})`), ...markStrokes.map((m) => `علامة «${m.why}»`)];
  const depth = depthIn(studioWord, strokes.flatMap((s) => s.points), studioWord.mask);
  if (depth.out) {
    const guilty = strokes.map((s, i) => {
      const one = depthIn(studioWord, s.points, studioWord.mask);
      return one.out ? `${labels[i]}: ${one.out} من ${s.points.length}` : null;
    }).filter(Boolean);
    throw new Error(`«${text}»: ${depth.out} نقطةً خارج خيال الكلمة — ${guilty.join(' · ')}`
      + ` (${depth.stray.slice(0, 3).map((p) => p.join('،')).join(' · ')})`);
  }

  // **ولا يخرج من هنا ما لا يقبله محرّكُه**: صحيحُه يُقبَل ومعكوسُ أوّلِه يُرَدّ
  const walk = strokes.map((s) => s.points);
  const taps = dots.flatMap((d) => Array.from({ length: d.count }, () => [d.at]));
  const good = judge(ref, [...walk, ...taps], { tolerance: scale });
  if (!good.accepted) {
    const detail = good.faults.slice(0, 4)
      .map((f) => `${f.code}@${f.part}(${f.at.map(Math.round).join('،')})`).join(' · ');
    const err = new Error(`«${text}»: المحرّكُ يردّ كتابتَها الصحيحة — ${detail}`
      + ` — تغطية ${good.metrics.coverage.toFixed(2)} · أجزاء ${ref.strokes.length}+${dots.length}`
      + ` · طيّات [${strokes.map((s) => (s.folds || []).length).join('،')}]`);
    err.ref = ref;
    throw err;
  }
  const bad = judge(ref, [[...walk[0]].reverse(), ...walk.slice(1), ...taps], { tolerance: scale });
  if (bad.accepted) throw new Error(`«${text}»: المحرّكُ يقبل أولَها معكوساً`);

  log?.({
    text, strokes: strokes.length, dots: dots.length, joins: meta.joins,
    skew: meta.skew, depth: round1(depth.least), scale, dropped,
    stray: meta.units.filter((u) => u.stray).map((u) => `${u.text}:${u.stray}`),
  });
  return { ref, meta, dropped };
}

/**
 * **قانونيُّ العلامة**: خيالُ العلامة وحدَها يملأ صندوقَه (تُصيَّر على حاملٍ صفريّ
 * «ـ» ليعرف المُشكِّلُ أنها علامةُ حرف، ثم يُقاس جرمُها ويُكبَّر وحدَه)، وتُنحَّف
 * ويُقرأ هيكلُها بياناً، **وتُمشى بإيماءتها المؤلَّفة** — عينُ منظومة حكم ٥ (شولةُ
 * الكاف): البدايةُ والاتجاهُ مادّةٌ مدرَّسة في العلامة كما في الجسم، توطئةً لهمزات
 * ق٣. ثم تُنزَّل على نظائرها في الكلمات بجرمها هناك.
 */
async function markCanonical(mark, entry) {
  // **حبرُ العلامة فرقُ نزعٍ لا تصفيةَ موضع** (أمسكه أوّلُ بناء): الضمّةُ والتنوينُ
  // خرجا **شريطَ الحامل نفسَه** (عقدتان أفقيتان متطابقتان لعلامتين مختلفتين) لأنّ
  // التصفيةَ بالمركز تُبقي الشريطَ الممدود. فالحاملُ يُرسَم مرّتين — به وبلا العلامة —
  // والفرقُ حبرُها وحدَه، وهو مبدأُ عزو حركات الكلمة بعينه.
  const carrier = 'ـ';
  setSheet(GRID);                       // وقانونيُّ العلامة كذلك: صندوقُه مربّع
  const inkOf = async (size, x, y) => maskMinus(
    imageMask(await svgPaint(carrier + mark, size, x, y)),
    imageMask(await svgPaint(carrier, size, x, y)));

  const probe = await inkOf(100, GRID / 2, GRID / 2);
  const box = maskBox(probe);
  if (!box) throw new Error(`علامة «${mark}»: لا جرمَ لها على الحامل`);
  const w = box.w;
  const h = box.h;
  const span = GRID - 2 * MARGIN;
  const scale = span / Math.max(w, h);
  const size = 100 * scale;
  const markMask = await inkOf(size, GRID / 2 + (GRID / 2 - box.cx) * scale,
    GRID / 2 + (GRID / 2 - box.cy) * scale);
  const parts = maskBodies(markMask).filter((b) => b.area >= DUST);
  if (!parts.length) throw new Error(`علامة «${mark}»: ضاع جرمُها في التكبير`);
  for (let i = 0; i < markMask.length; i++) markMask[i] = 0;
  for (const part of parts) for (const c of part.cells) markMask[c] = 1;
  const image = await svgPaint(carrier + mark, size, GRID / 2 + (GRID / 2 - box.cx) * scale,
    GRID / 2 + (GRID / 2 - box.cy) * scale);
  const work = { bodyMask: markMask, graph: skeletonGraph(thin(markMask)), dt: distance(markMask) };
  if (!entry?.strokes?.length) {
    return { mark, work, box: maskBox(markMask), aspect: w / h, strokes: null, image };
  }
  const strokes = [];
  for (const ids of entry.strokes) {
    // كما في `compose` سواءً: الطيّةُ المعلَنة من مفرق الهيكل (سنّةُ الشدّة الوسطى)
    // تُحمَل عبر الصقل أطوالاً ثم تُقرأ أرقاماً في المسار الموزَّع.
    const walked = walkGesture(work, ids);
    let points = smooth(walked.points, 2, work);
    points = extendEnd(points, markMask, true);
    let folds = walked.folds.map((f) => ({
      from: f.from ? f.from + 1 : 0, apex: f.apex + 1, to: f.to + 1,
    }));
    points = extendEnd(points, markMask, false);
    points = smooth(points, 2, work);
    const before = prepare(points);
    const spans = folds.map((f) => [before.cum[f.from], before.cum[f.apex], before.cum[f.to]]);
    points = resample(points);
    const at = (len) => Math.min(points.length - 1,
      Math.max(0, Math.round((len / (before.len || 1)) * (points.length - 1))));
    folds = spans.map(([a, b, c]) => ({ from: at(a), apex: at(b), to: at(c) }))
      .filter((f) => f.from < f.apex && f.apex < f.to);
    strokes.push(folds.length ? { points, start: points[0], folds } : { points, start: points[0] });
  }
  const ink = depthIn(work, strokes.flatMap((s) => s.points), markMask);
  if (ink.out) throw new Error(`علامة «${mark}»: ${ink.out} نقطةً خارج جرمها`);
  return {
    mark, work, image,
    box: maskBox(markMask),
    aspect: w / h,
    strokes,
    /** شارةُ العرض لبطاقة التعريف: العلامةُ في صندوقها المعياريّ — من المسار نفسِه */
    glyph: { strokes: strokes.map((s) => ({ points: s.points, start: s.start })), dots: [] },
  };
}

/**
 * **قانونيّاتُ التنزيل**: لكلِّ وحدةٍ (حرفاً أو متغيّراً أو لام-ألف) بشكل موقعها —
 * مسارُها المركَّب، وجسدُها (حدودُ قناعه)، وعددُ أجزاء جسدها (فما بعدها ضرباتُ
 * علاماتٍ مؤلَّفة تُفرَد في الكلمة إفرادَها).
 */
function canonOf(works, done, forms) {
  const out = {};
  for (const form of FORMS) {
    const entry = forms[form];
    const gesture = entry.sameAs ? forms[entry.sameAs] : entry;
    out[form] = {
      ref: done[form],
      body: maskBox(works[form].bodyMask),
      bodyStrokes: gesture.strokes.length,
    };
  }
  return out;
}

/**
 * **بناءُ مسارات الكلمات كلِّها من المنهج** — قائمةُ العمل تُقرأ من `curriculum.js`
 * (وصلاتُ مرحلة الوصل ثم كلماتُ الجداول كلُّها) **ولا كلمةَ تُكتب هنا**. وأسطرُ
 * المسافة (كلمتان تتجاوران بمسافةٍ من المُشكِّل — مادّةُ «المسافة بين الكلمات»)
 * تُشتقّ بقاعدةٍ معلنة: أولا كلمتَي كلِّ عقدة نسخٍ غير عقد العلامات.
 *
 * **والجملُ من سلّم اقرأ تُؤلَّف كما تُؤلَّف الكلمة** (الجلسة ٩، `METHOD.md §٤`
 * المرحلة ١٤): نصٌّ واحدٌ يُصيَّره المُشكِّل، فيخرج منه **اتجاهُ السطر والمسافةُ بين
 * الكلمات** حقيقةً مقيسةً لا تركيباً — وهي مادّةُ المحطة بعينها. ولا فرقَ في
 * التأليف بين جملةٍ وسطرِ مسافة: كلاهما كلماتٌ على سطرٍ واحد.
 */
async function buildWords(spec, canon) {
  const cur = await import('/js/curriculum.js');
  JOINS_AFTER = {};
  for (const [ch, info] of Object.entries(cur.LETTERS)) JOINS_AFTER[ch] = !!info.joins;
  for (const [ch, info] of Object.entries(cur.VARIANTS)) JOINS_AFTER[ch] = !!info.joins;

  // **ومحطاتُ النوع الواحد كلُّها لا أُولاها** (جلسةُ التوسعة): صارت للنسخ محطاتٌ
  // (الوصلُ · البساتينُ · الجذور) وللجمل محطتان (القصيرةُ · السلّم) — و`find` كانت
  // تأخذ الأولى وحدَها **فتخرج الوحدةُ ناقصةً صامتة**: مادّةٌ في المنهج بلا مسار.
  const kind = (k) => cur.STAGES.filter((s) => s.kind === k).flatMap((s) => s.nodes || []);
  const joinNodes = kind('join');
  const joins = joinNodes.flatMap((n) => n.joins || []);
  const words = Object.keys(cur.WORDS);
  const pairs = joinNodes
    .filter((n) => (n.words || []).length >= 2 && !String(n.part).startsWith('sign-'))
    .map((n) => `${n.words[0]} ${n.words[1]}`);
  // وجملُ سلّم اقرأ — تُقرأ من عقدها كما تُقرأ الكلماتُ من جدولها
  const sentences = kind('sentence').flatMap((n) => n.sentences || []);

  // العلاماتُ المطلوبة قانونيّاتُها: كلُّ حركةٍ وردت في المادّة — فعلامةٌ بلا إيماءةٍ
  // مؤلَّفةٍ تُسقط البناءَ باسمها، ولا تدخل كلمةٌ حركتُها نقرةٌ عمياء.
  const needed = [...new Set([...joins, ...words, ...sentences]
    .flatMap((t) => [...t].filter((c) => HARAKA.test(c))))];
  const canonMarks = {};
  for (const mark of needed) {
    if (!spec.marks?.[mark]?.strokes?.length) {
      throw new Error(`العلامة «${mark}» تلزم الكلماتِ ولا إيماءةَ لها في \`marks\``);
    }
    canonMarks[mark] = await markCanonical(mark, spec.marks[mark]);
  }

  const out = {};
  const report = [];
  const failedPairs = [];
  const failed = [];
  const failRefs = {};
  // **وشكوى الكلمة لا توقف جردَ أخواتها**: البناءُ يجمع الشكاوى كلَّها ثم يسقط بها
  // مجتمعةً — فيُرى العطبُ صنفاً لا واحدةً بعد واحدة (وقد كشف ذلك أنّ ما يبدو ثلاثةَ
  // أعطاب في ثلاث تشغيلاتٍ عطبٌ واحدٌ في المحرّك).
  for (const text of [...joins, ...words]) {
    try {
      const st = await wordStudio(text);
      out[text] = composeWord(st, canon, canonMarks, (line) => report.push(line)).ref;
    } catch (e) {
      failed.push(`«${text}»: ${e.message}`);
      if (e.ref) failRefs[text] = e.ref;
    }
  }
  // أسطرُ المسافة والجملُ تُقاس ككل شيء — وما ضاق عن مقياس المحرّك سقط **بإعلانٍ لا
  // صمتاً**، وتمضي محطتُه بما بقي من مادّتها (وعقدةٌ خلت تُجيب الطفلَ ولا تصمت).
  const failedSentences = [];
  for (const [list, bag] of [[pairs, failedPairs], [sentences, failedSentences]]) {
    for (const text of list) {
      try {
        const st = await wordStudio(text);
        out[text] = composeWord(st, canon, canonMarks, (line) => report.push(line)).ref;
      } catch (e) {
        bag.push(`${text}: ${e.message}`);
      }
    }
  }
  const glyphs = {};
  for (const [mark, cm] of Object.entries(canonMarks)) glyphs[mark] = cm.glyph;
  return {
    words: out, report, glyphs, failedPairs, failedSentences, failed, failRefs,
    counts: {
      joins: joins.length, words: words.length, pairs: pairs.length,
      sentences: sentences.length,
    },
  };
}

// ————— ٧ب) أشكالُ التهيئة الحركية: هندسةٌ **محسوبة** لا خيالُ حرف —————
//
// المرحلةُ الأولى في `METHOD.md §٤` — «خطوطٌ أفقية/رأسية/مائلة · منحنيات ودوائر
// باتجاهٍ صحيح · موجاتٌ وحلقات · تحكّمٌ داخل حدود» — **قبل أيّ حرف**. ومحطاتُها
// الستُّ في `curriculum.js` (الجلسة ٣)، ومساراتُها هنا (بند الجلسة ٤: «بمساراتٍ من
// `make_paths.html`»).
//
// **ولِمَ تُبنى في العدّة وليس فيها خيالُ حرفٍ يُقرأ؟** لأنّ عهدَ `METHOD.md §٣.٨`
// **ألّا تُكتب إحداثياتٌ بيد**، وشكلُ التهيئة **ليس حقيقةً من حقائق الخطّ** تُقرأ من
// المُشكِّل — بل هو **تعريفُه الهندسيّ نفسُه**: «خطٌّ من حافّة الصندوق إلى حافّته»،
// «دائرةٌ نصفُ قطرها ثلثُ الصندوق». فالمكتوبُ هنا **التعريف**، والإحداثياتُ تُحسب
// منه — كما تُحسب أشكالُ عدّة المعايرة (`tools/make_pen_traces.mjs`). وموضعُها هذه
// العدّةُ لا وحدةٌ في `app/`، لثلاثة تجتمع فيها:
//   ١) **إعادةُ التوزيع نفسُها** (`resample`): أقصى طولِ قطعةٍ مقروءٌ من سماحة
//      المحرّك، فلا يُبنى شكلُ تهيئةٍ بقطعةٍ تخدع نافذةَ الرتابة.
//   ٢) **الحكمُ يُجرَّب ساعةَ البناء**: كلُّ شكلٍ يُدخَل على `judge` صحيحاً ومعكوساً
//      قبل أن يخرج من هنا — فلا يدخل التطبيقَ شكلٌ لا يقبله محرّكُه أو يقبل عكسَه.
//   ٣) **الصندوقُ صندوقُ الحروف** (`MARGIN` نفسُه): فما تمرّنت عليه اليدُ في التهيئة
//      هو المدى الذي ستملؤه الحروفُ بعدها، لا صندوقٌ آخر.
//
// **واتجاهُ الدوران يُقرأ من المادّة لا يُختار**: `METHOD.md §٤` يشترط «دوائر
// **باتجاهٍ صحيح**»، والصحيحُ هو دورانُ أوّل حلقةٍ سيكتبها الطفلُ — **حلقةُ م
// المعزولة** (المجموعةُ الأولى)، وإيماءتُها تقول «مع عقارب الساعة». فلا يُكتب
// الاتجاهُ هنا رأياً: يُقاس من مسار م المؤلَّف في هذا البناء نفسِه (إشارةُ مساحته
// المُوجَّهة)، فإن تبدّل مسارُها تبدّلت معه دوائرُ التهيئة.

/** الصندوقُ: حافّتا الكراسة نفسُهما (`MARGIN`) — مدى الحرف هو مدى التهيئة. */
const W_LOW = MARGIN;
const W_HIGH = GRID - MARGIN;
const W_MID = GRID / 2;

/** منحنىً محسوب: يُعاين كثيفاً ثم يُعاد توزيعُه بخطوة المحرّك (`stepFor`). */
const curve = (fn, dense = 260) => resample(
  Array.from({ length: dense + 1 }, (_, i) => fn(i / dense)).map((p) => [round1(p[0]), round1(p[1])]));

const wLine = (a, b) => curve((t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], 24);

/** قوسٌ حول مركز: من زاويةٍ إلى زاوية (إحداثياتُ شاشة، y نازلة). */
const wArc = (c, r, from, to) => curve((t) => {
  const a = from + (to - from) * t;
  return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
});

/** موجةٌ من اليمين إلى اليسار — أوّلُ بطنها **نازل** كبطون ب وس. */
const wWave = (y, amp, waves) => curve((t) => [
  W_HIGH - (W_HIGH - W_LOW) * t,
  y + amp * Math.sin(2 * Math.PI * waves * t),
]);

/**
 * خطٌّ مكسورٌ **بزوايا مدوَّرة** يمرّ بمواضعَ بأعيانها (زجزاجٌ ودرج).
 *
 * **ولِمَ تُدوَّر؟** لأن الزاوية الحادّة موضعٌ **لا يُقاس**: ضلعاها يقتربان فيقع
 * إسقاطُ يدٍ ترتجف على الضلع الخطأ، فيُردّ طفلٌ يدور الزاويةَ كما تُدار حقّاً. وقد
 * قِسناه: زجزاجٌ بزوايا حادّة يحتمل ١٨ من سماحة ٦٣ — **دون عهد `child-drift`** —
 * ويحتمل ٥٤ إذا دُوِّرت زواياه. وهي عينُ قاعدة الجلسة ٢: **ما لا يبلغ سماحةَ
 * المحرّك لا يُقاس، ولا يُدرَّس ما لا يُقاس**. واليدُ تدور الزاويةَ كذلك لا تكسرها.
 */
function wPolyline(points, round = 140) {
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const [a, b, c] = [points[i - 1], points[i], points[i + 1]];
    const v1 = [a[0] - b[0], a[1] - b[1]];
    const v2 = [c[0] - b[0], c[1] - b[1]];
    const n1 = Math.hypot(...v1) || 1;
    const n2 = Math.hypot(...v2) || 1;
    const cut = Math.min(round, n1 / 2, n2 / 2);
    const p1 = [b[0] + (v1[0] / n1) * cut, b[1] + (v1[1] / n1) * cut];
    const p2 = [b[0] + (v2[0] / n2) * cut, b[1] + (v2[1] / n2) * cut];
    out.push(p1);
    for (let k = 1; k < 12; k++) {       // قوسٌ تربيعيّ بين الضلعين على رأس الزاوية
      const t = k / 12;
      out.push([(1 - t) ** 2 * p1[0] + 2 * (1 - t) * t * b[0] + t * t * p2[0],
        (1 - t) ** 2 * p1[1] + 2 * (1 - t) * t * b[1] + t * t * p2[1]]);
    }
    out.push(p2);
  }
  out.push(points[points.length - 1]);
  const poly = prepare(out);
  return curve((t) => pointAt(poly, t * poly.len).at, 200);
}

/**
 * **إشارةُ الدوران**: مساحةٌ مُوجَّهة موجبة = **مع عقارب الساعة** على الشاشة (لأن y
 * نازلة). ومقياسُها مُعايَرٌ بشكلٍ معلومٍ سلفاً في هذا المشروع: دائرةُ عدّة المعايرة
 * (`ring`) تمضي من قمّتها **يساراً** فتخرج سالبة.
 */
const spinOf = (points) => {
  let twice = 0;
  for (let i = 0; i < points.length; i++) {
    const q = points[(i + 1) % points.length];
    twice += points[i][0] * q[1] - q[0] * points[i][1];
  }
  return Math.sign(twice);
};

/**
 * **إعلانُ المحطات الست** — لكلٍّ ثلاثةُ أشكال، ومفتاحُها **عينُ `part` في
 * `curriculum.js`** (يحرسه `tools/test_warmup.mjs`: لا محطةَ بلا أشكال ولا شكلَ بلا
 * محطة). و`spin` يُمرَّر إلى ما يدور، فالدوائرُ والحلقاتُ تتبع حلقةَ الميم.
 */
const WARMUP_SPEC = (spin) => [
  ['lines-h', [
    ['خطٌّ أفقيٌّ طويل من اليمين إلى اليسار — اتجاهُ الكتابة',
      [wLine([W_HIGH, W_MID], [W_LOW, W_MID])]],
    ['خطّان أفقيان: الأعلى ثم الأدنى — يدٌ تعيد الحركةَ نفسَها',
      [wLine([W_HIGH, 350], [W_LOW, 350]), wLine([W_HIGH, 650], [W_LOW, 650])]],
    ['ثلاثةُ خطوطٍ قصيرة بترتيبها من أعلى — ضبطُ الابتداء ثلاثاً',
      [250, 500, 750].map((y) => wLine([W_HIGH, y], [W_LOW, y]))],
  ]],
  ['lines-v', [
    ['خطٌّ رأسيٌّ من أعلى إلى أسفل — نزولُ الألف',
      [wLine([W_MID, W_LOW], [W_MID, W_HIGH])]],
    ['خطّان رأسيان: الأيمنُ ثم الأيسر — ترتيبُ العربية',
      [wLine([650, W_LOW], [650, W_HIGH]), wLine([350, W_LOW], [350, W_HIGH])]],
    ['ثلاثةُ خطوطٍ رأسية من اليمين — ثباتُ النزول',
      [750, 500, 250].map((x) => wLine([x, W_LOW], [x, W_HIGH]))],
  ]],
  ['lines-d', [
    ['مائلٌ من أعلى اليمين إلى أسفل اليسار', [wLine([W_HIGH, W_LOW], [W_LOW, W_HIGH])]],
    ['مائلٌ من أعلى اليسار إلى أسفل اليمين', [wLine([W_LOW, W_LOW], [W_HIGH, W_HIGH])]],
    ['خيمةٌ بجزأين: صعودٌ من اليمين ثم نزولٌ إلى اليسار',
      [wLine([W_HIGH, W_HIGH], [W_MID, W_LOW]), wLine([W_MID, W_LOW], [W_LOW, W_HIGH])]],
  ]],
  ['curves', [
    ['كأسٌ: من اليمين ينزل إلى القاع ثم يصعد يساراً — بطنُ الباء',
      [wArc([W_MID, 420], 320, 0, Math.PI)]],
    ['قبّةٌ: من اليمين يصعد إلى القمّة ثم ينزل يساراً', [wArc([W_MID, 580], 320, 0, -Math.PI)]],
    ['دائرةٌ تامّة من قمّتها — **بدوران حلقة الميم**',
      [wArc([W_MID, W_MID], 320, -Math.PI / 2, -Math.PI / 2 + spin * 2 * Math.PI)]],
  ]],
  ['waves', [
    ['موجتان واسعتان من اليمين — بطنٌ فظهرٌ بلا رفعِ قلم', [wWave(W_MID, 140, 2)]],
    ['ثلاثُ موجاتٍ أضيق — يدٌ تضبط حركةً أصغر', [wWave(W_MID, 110, 3)]],
    ['حلقتان تدوران دورانَ الميم: اليمنى ثم اليسرى',
      [700, 300].map((x) => wArc([x, W_MID], 170, -Math.PI / 2, -Math.PI / 2 + spin * 2 * Math.PI))],
  ]],
  ['inside', [
    ['طريقٌ متموّج بين حدّين — لا يخرج القلمُ عن الممرّ', [wWave(W_MID, 150, 2)], true],
    ['طريقٌ منكسر: انعطافتان داخل الحدود',
      [wPolyline([[W_HIGH, 280], [640, 720], [360, 280], [W_LOW, 720]])], true],
    ['درجٌ ينزل يساراً — أفقيٌّ ورأسيٌّ في حركةٍ واحدة',
      [wPolyline([[W_HIGH, 200], [610, 200], [610, 450], [310, 450], [310, 700], [W_LOW, 700]], 100)], true],
  ]],
];

/**
 * **سماحةُ محطة «التحكّم داخل حدود»** — وهي عينُ ما تدرّسه: `METHOD.md §٣.٥`
 * «السماحةُ تملكها المحطة وتتشدّد مع التقدّم». فممرُّها أضيقُ من سماحة سائر المحطات،
 * **ويراه الطفلُ**: الشاشةُ ترسم الممرَّ بعرض السماحة نفسِها (`bounds` في `pen.js`)،
 * فلا حدَّ مرسومٌ يخالف الحدَّ المقيس.
 *
 * ⚠ ورقمُه **مبدئيٌّ كسائر أرقام السماحة** (`METHOD.md §٣.٥`: تُعايَر بمسارات ميدانٍ
 * حقيقية) — وموضعُ معايرته الجلسةُ ١٢ مع أصله.
 */
const WARMUP_STRICT = 0.7;

/** يبني أشكالَ التهيئة كلَّها، ويردّ ما لا يقبله المحرّكُ صحيحاً ويردّ عكسَه. */
function buildWarmups(paths) {
  const loop = paths['م']?.isolated?.strokes?.[0]?.points;
  if (!loop) {
    throw new Error('لا مسارَ لحلقة م المعزولة — ومنها يُقرأ اتجاهُ دوران دوائر التهيئة');
  }
  const spin = spinOf(loop);
  if (!spin) throw new Error('مساحةُ حلقة م صفرٌ — لا يُقرأ منها اتجاهُ دوران');

  const out = {};
  const report = [];
  for (const [part, shapes] of WARMUP_SPEC(spin)) {
    out[part] = { shapes: [] };
    for (const [note, strokes, strict] of shapes) {
      const id = `${part}/${out[part].shapes.length + 1}`;
      const ref = { strokes: strokes.map((points) => ({ points, start: points[0] })), dots: [] };
      const entry = { id, note, ref };
      if (strict) { entry.tolerance = WARMUP_STRICT; entry.bounds = true; }
      const tolerance = entry.tolerance;

      // **لا يخرج من هنا شكلٌ لا يقبله محرّكُه**: يُكتب صحيحاً فيُقبَل، ومعكوساً
      // فيُرَدّ — نظيرُ «المسارُ داخلَ خيال حرفه» في الحروف، مقيساً لا مدَّعىً.
      const walk = (back) => ref.strokes.map((s) => (back ? [...s.points].reverse() : s.points));
      const good = judge(ref, walk(false), { tolerance });
      const bad = judge(ref, walk(true), { tolerance });
      if (!good.accepted) throw new Error(`${id}: المحرّكُ يردّ كتابتَه الصحيحة (${good.primary})`);
      if (bad.accepted) throw new Error(`${id}: المحرّكُ يقبله معكوساً — شكلٌ لا يدرّس اتجاهاً`);

      // وأطرافُ الأشكال داخلَ الصندوق: ما خرج عن اللوح لا يبلغه إصبعُ الطفل
      const stray = ref.strokes.flatMap((s) => s.points)
        .filter((p) => p[0] < 0 || p[1] < 0 || p[0] > GRID || p[1] > GRID);
      if (stray.length) throw new Error(`${id}: ${stray.length} نقطةً خارج الشبكة`);

      out[part].shapes.push(entry);
      report.push({ id, strokes: ref.strokes.length, reversed: bad.primary, tolerance });
    }
  }
  return { warmups: out, report, spin };
}

// ————— ٨) العرضُ: الشبكةُ والخيالُ والهيكلُ والمسارُ المؤلَّف —————

const SVG = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}) => {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, String(v));
  return el;
};
const pathD = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ');

function ghostCanvas(work) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = GRID;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(work.image, 0, 0);
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = '#f7f4ee';
  ctx.fillRect(0, 0, GRID, GRID);
  canvas.style.opacity = '.28';
  return canvas;
}

function overlay(work, made, { nodes = true, skeleton = true, grid = true } = {}) {
  const svg = sv('svg', { viewBox: `0 0 ${GRID} ${GRID}` });
  if (grid) {
    for (let i = 1; i < 10; i++) {
      svg.append(sv('line', { class: 'grid-line', x1: i * 100, y1: 0, x2: i * 100, y2: GRID }));
      svg.append(sv('line', { class: 'grid-line', x1: 0, y1: i * 100, x2: GRID, y2: i * 100 }));
    }
  }
  if (skeleton) {
    for (const edge of work.graph.edges) {
      svg.append(sv('path', { class: 'skel', d: pathD(edge.chain.map(px2grid).map((p) => [round1(p[0]), round1(p[1])])) }));
    }
  }
  if (made) {
    for (const stroke of made.strokes) {
      svg.append(sv('path', { class: 'made', d: pathD(stroke.points) }));
      svg.append(sv('circle', { class: 'made-start', cx: stroke.start[0], cy: stroke.start[1], r: 22 }));
    }
    for (const dot of made.dots) {
      svg.append(sv('circle', { class: 'made-dot', cx: dot.at[0], cy: dot.at[1], r: 20 }));
    }
  }
  if (nodes) {
    for (const node of work.graph.nodes) {
      svg.append(sv('circle', { class: 'node', cx: node.at[0], cy: node.at[1], r: 26, 'data-id': node.id }));
      const tag = sv('text', { class: 'node-tag', x: node.at[0], y: node.at[1] });
      tag.textContent = String(node.id);
      svg.append(tag);
    }
  }
  return svg;
}

// ————— ٩) الأوضاع —————

async function anchors() {
  // ملفُّ الإيماءات يُخدَم للعدّة باسمٍ داخليّ (سائقُها يخدم `app/` جذراً)
  const res = await fetch('/__anchors.json');
  return res.json();
}

/** الحروفُ × أشكالُها الأربعة — قائمةُ العمل التامّة، تُقرأ في كل وضع. */
const allForms = (spec) => Object.keys(spec.letters)
  .flatMap((ch) => FORMS.map((form) => ({ ch, form })));
const workList = (spec) => Object.entries(spec.letters)
  .flatMap(([ch, forms]) => FORMS.filter((f) => forms[f]).map((form) => ({ ch, form })));

/** يبني كلَّ ما في ملفّ الإيماءات، ويتحقّق من دعوى «الشكلان واحد» بالخيال لا بالقول. */
function buildAll(spec, canon = null) {
  const paths = {};
  const report = [];
  for (const [ch, forms] of Object.entries(spec.letters)) {
    const done = {};
    const works = {};
    for (const form of FORMS) {
      const entry = forms[form];
      if (!entry) throw new Error(`${ch}: لا إيماءةَ لشكل ${FORM_AR[form]}`);
      works[form] = works[form] || studio(ch, form);
      const work = works[form];
      if (entry.sameAs) {
        // **الدعوى تُفحَص بالخيال**: بصمتا القناعين تتطابقان أو تسقط الدعوى.
        const source = works[entry.sameAs] || (works[entry.sameAs] = studio(ch, entry.sameAs));
        if (work.sig !== source.sig) {
          throw new Error(`${ch}/${FORM_AR[form]}: ادُّعي أنه عينُ ${FORM_AR[entry.sameAs]}`
            + ` وخيالاهما مختلفان (${work.sig} ≠ ${source.sig})`);
        }
        done[form] = done[entry.sameAs] || compose(source, forms[entry.sameAs]);
        report.push({ ch, form, sameAs: entry.sameAs, sig: work.sig, nodes: work.graph.nodes.length });
        continue;
      }
      if (entry.nodes != null && entry.nodes !== work.graph.nodes.length) {
        throw new Error(`${ch}/${FORM_AR[form]}: عُقَدُ الخيال ${work.graph.nodes.length}`
          + ` والإيماءةُ كُتبت على ${entry.nodes} — أُعيدت قراءةُ الخيال فلْتُراجَع الإيماءة`);
      }
      if (entry.sig && entry.sig !== work.sig) {
        throw new Error(`${ch}/${FORM_AR[form]}: بصمةُ الخيال ${work.sig} والإيماءةُ على ${entry.sig}`);
      }
      // **والعطبُ يسمّي موضعَه**: شكوى `compose` تخرج بلا اسم الشكل، فيضيع وقتُ من
      // يبحث عن أيّ إيماءةٍ من مئةٍ واثنتي عشرة اشتكت.
      try {
        done[form] = compose(work, entry);
      } catch (e) {
        throw new Error(`${ch}/${FORM_AR[form]}: ${e.message}`);
      }
      // **والعلامةُ المكتوبة ضربةً تُقاس على الخيال كلِّه**: ضربتُها في جرم العلامة لا
      // في جسم الحرف، فقياسُها على قناع الجسم يقول «خارج الحبر» وهي في حبرها.
      const ink = depthIn(work, done[form].strokes.flatMap((st) => st.points),
        entry.marks || entry.markStrokes ? work.mask : work.bodyMask);
      if (ink.out) {
        throw new Error(`${ch}/${FORM_AR[form]}: ${ink.out} نقطةً خارج خيال الحرف`
          + ` (${ink.stray.slice(0, 3).map((p) => p.join('،')).join(' · ')})`

          + ' — المسارُ يدّعي على الحرف ما ليس فيه');
      }
      report.push({
        ch, form, sig: work.sig, nodes: work.graph.nodes.length, depth: round1(ink.least),
        strokes: done[form].strokes.length, dots: done[form].dots.length,
        folds: done[form].strokes.reduce((n, st) => n + (st.folds?.length || 0), 0),
      });
    }
    paths[ch] = done;
    if (canon) canon[ch] = canonOf(works, done, forms);
  }
  return { paths, report };
}

async function runBuild() {
  const spec = await anchors();
  // **بناءٌ محدودٌ بحروفٍ بعينها** (`only`، الجلسة ٧): تُقاس به **مرشّحاتُ الكرّاسة**
  // — جوابان لحالةٍ حركية يُبنيان ويُدخَلان على المحرّك قبل أن يحكم المالك. وهو
  // **قياسٌ لا يُكتب منه ملفّ**: السائقُ يرفض الكتابة إذا صُفّيت الحروف (وإلّا خرجت
  // وحدةٌ ناقصة)، وأشكالُ التهيئة والكلماتُ لا تُبنى معه.
  const only = qs.get('only');
  if (only) {
    spec.letters = Object.fromEntries(
      Object.entries(spec.letters).filter(([ch]) => only.includes(ch)));
  }
  try {
    const canon = {};
    const { paths, report } = buildAll(spec, canon);
    if (only) {
      say(true, `بناءٌ محدود بـ«${only}» — قياسٌ لا تُكتب منه وحدة`, {
        paths, partial: only, meta: { report, grid: GRID },
      });
      await send();
      return;
    }
    for (const line of report) {
      say(true, `${line.ch} ${FORM_AR[line.form]}: `
        + (line.sameAs ? `عينُ ${FORM_AR[line.sameAs]} — خيالاهما ببصمةٍ واحدة (${line.sig})`
          : `${line.strokes} جزءاً و${line.dots} نقطةً · عُقَدُ الخيال ${line.nodes}`
            + (line.folds ? ` · طيّاتٌ معلنة ${line.folds}` : '')
            + ` · داخلَ الحبر كلُّه (أدنى غوص ${line.depth}) · بصمة ${line.sig}`));
    }
    // **وأشكالُ التهيئة تُبنى مع الحروف في التشغيلة نفسِها** (§٧ب): اتجاهُ دورانها
    // مقروءٌ من حلقة الميم المؤلَّفة الآن — فلا تُبنى على مسارٍ قديمٍ لها على القرص.
    const warm = buildWarmups(paths);
    for (const line of warm.report) {
      say(true, `تهيئة ${line.id}: ${line.strokes} جزءاً · معكوسُه يُرَدّ «${line.reversed}»`
        + (line.tolerance ? ` · سماحةُ محطتها ×${line.tolerance}` : ''));
    }
    say(true, `دورانُ دوائر التهيئة من حلقة م المعزولة: ${
      warm.spin > 0 ? 'مع عقارب الساعة' : 'عكسَ عقارب الساعة'}`);

    // ————— الكلماتُ (الجلسة ٨): المتغيّراتُ ولام-ألف قانونيّاتٌ، ثم النسخُ كلُّه —————
    //
    // المتغيّراتُ (ء ة أ إ) **تُؤلَّف عند أول كلمةٍ تحملها** — وكلماتُها في المنهج
    // اليوم، فتُبنى هنا قانونيّاتٍ ولا تُكتب في `paths.js` (ليست من حروف اقرأ الثمانية
    // والعشرين): موضعُها الكلماتُ التي تحملها في `word_paths.js`.
    await inlineFont(FONT_SRC);
    for (const [group, name] of [['variants', 'متغيّر'], ['ligatures', 'لام-ألف']]) {
      if (!spec[group]) continue;
      const groupReport = buildAll({ letters: spec[group] }, canon).report;
      for (const line of groupReport) {
        say(true, `${name} ${line.ch} ${FORM_AR[line.form]}: `
          + (line.sameAs ? `عينُ ${FORM_AR[line.sameAs]} (${line.sig})`
            : `${line.strokes} جزءاً و${line.dots} نقطةً · عُقَد ${line.nodes} · غوص ${line.depth}`));
      }
    }
    const built = await buildWords(spec, canon);
    for (const line of built.report) {
      const joins = line.joins.map((j) => (j.cut ? `${j.at}✂${j.gap}` : `${j.at}~${j.gap}`)).join(' ');
      say(true, `كلمة «${line.text}»: ${line.strokes} قطعةً و${line.dots} نقطةً`
        + ` · وصلُها [${joins}] · مقياسُ حروفها ×${line.scale}`
        + ` · فرقُ المقياسين ≤${(line.skew * 100).toFixed(0)}٪`
        + ` · غوص ${line.depth}`
        + (line.stray.length ? ` · ⚠ خارجَ حبر حرفه: ${line.stray.join(' ')}` : '')
        + (line.dropped.length ? ` · ⚠ ${line.dropped.join(' · ')}` : ''));
    }
    for (const fail of built.failedPairs) say(true, `⚠ سطرُ مسافةٍ سقط بإعلان: ${fail}`);
    for (const fail of built.failedSentences) say(true, `⚠ جملةٌ سقطت بإعلان: ${fail}`);
    for (const fail of built.failed) say(false, `كلمةٌ لم تُبنَ — ${fail}`);
    say(true, `الكلماتُ المؤلَّفة: ${Object.keys(built.words).length}`
      + ` (وصلات ${built.counts.joins} · كلمات ${built.counts.words}`
      + ` · أسطرُ مسافة ${built.counts.pairs - built.failedPairs.length}/${built.counts.pairs}`
      + ` · جمل ${built.counts.sentences - built.failedSentences.length}/${built.counts.sentences})`);
    if (built.failed.length) {
      say(false, `${built.failed.length} كلمةً لم تُبنَ — لا تُكتب وحدةٌ ناقصة`, { failRefs: built.failRefs });
      await send();
      return;
    }

    say(true, 'تمّ البناء', {
      // **وما سقط يُبلَّغ به المنهجَ لا سجلَّ الشاشة وحدَه** (جلسةُ التوسعة): جملةٌ
      // لا يؤلَّف لها خيالٌ **تبقى في المنهج** فيحمرّ `check_paths` عليها كلَّ مرّة.
      // فتخرج الساقطاتُ من هنا بأسمائها وعللها، ويقرؤها مولّدُ المنهج فيُسقطها من
      // مادّته بإعلان — **دورةٌ مغلقة بلا قائمةٍ تُكتب بيد**.
      dropped: [
        ...built.failedSentences.map((why) => ({ kind: 'sentence', why })),
        ...built.failedPairs.map((why) => ({ kind: 'pair', why })),
      ],
      paths,
      warmups: warm.warmups,
      words: built.words,
      markGlyphs: built.glyphs,
      meta: {
        report, grid: GRID, spin: warm.spin, warmups: warm.report,
        words: built.report, failedPairs: built.failedPairs,
        failedSentences: built.failedSentences, wordCounts: built.counts,
      },
    });
  } catch (e) {
    say(false, `تعذّر البناء: ${e.message}`);
  }
  await send();
}

async function runNodes() {
  const spec = await anchors();
  // جردُ المتغيّرات ولام-ألف مع الحروف (قانونيّاتُ الكلمة تُؤلَّف بالأداة نفسِها)،
  // وجردُ عُقَد العلامات في ذيله — منها تُؤلَّف إيماءاتُ الحركات (منظومة حكم ٥).
  const everything = { letters: { ...spec.letters, ...(spec.variants || {}), ...(spec.ligatures || {}) } };
  const list = allForms(everything);
  const table = {};
  if (spec.marks) {
    await inlineFont(FONT_SRC);
    for (const mark of Object.keys(spec.marks)) {
      try {
        const cm = await markCanonical(mark, null);
        table[`mark/${mark}`] = {
          aspect: round1(cm.aspect * 100) / 100,
          nodes: cm.work.graph.nodes.map((n) => ({ id: n.id, at: n.at.map(round1), deg: n.deg })),
          edges: cm.work.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
        };
        say(true, `علامة «${mark}»: ${cm.work.graph.nodes.length} عقدةً و${cm.work.graph.edges.length} حافّة`);
      } catch (e) {
        say(false, `علامة «${mark}»: ${e.message}`);
      }
    }
  }
  for (const { ch, form } of list) {
    try {
      const work = studio(ch, form);
      table[`${ch}/${form}`] = {
        sig: work.sig,
        ink: work.cal.ink,
        dots: work.dots,
        nodes: work.graph.nodes.map((n) => ({
          id: n.id, at: n.at.map(round1), deg: n.deg,
          width: round1(work.dt[n.px] * PX * 2),
        })),
        // **وعُقَدُ العلامات تُجرَد كعُقَد الجسم** — منها تُؤلَّف إيماءةُ الشولة
        marks: work.markWork.map((one) => ({
          nodes: one.graph.nodes.map((n) => ({ id: n.id, at: n.at.map(round1), deg: n.deg })),
          edges: one.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
        })),
        edges: work.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
      };
      say(true, `${ch} ${FORM_AR[form]}: ${work.graph.nodes.length} عقدةً و${work.graph.edges.length} حافّة`);
    } catch (e) {
      say(false, `${ch} ${FORM_AR[form]}: ${e.message}`);
    }
  }
  say(true, 'جردُ العُقَد', { table });
  await send();
}

/** لوحةُ مراجعةٍ بالعين: خيالٌ وهيكلٌ ومسارٌ مؤلَّف لكل شكل — تُلتقط صورةً. */
async function runSheet() {
  const spec = await anchors();
  // اللوحةُ تعرض الأشكالَ الأربعة لكل حرفٍ دائماً — وما لم تُؤلَّف إيماءتُه بعدُ
  // يُعرَض خيالُه وهيكلُه وعُقَدُه وحدَها، فهي لوحةُ التأليف كما هي لوحةُ المراجعة.
  //
  // **و`only` مِصفاةُ حروفٍ للتأليف** (الجلسة ٦): لوحةُ الـ٢٨ كاملةً تُسلَّم للعين،
  // لكنّ المؤلِّفَ يقرأ أرقامَ العُقَد وهو يؤلّف مجموعةً مجموعة — وأرقامٌ تصغر تحت
  // التصغير لا تُقرأ. والنافذةُ تتبع العددَ في الحالين (يحسبها السائق).
  // **و`pick` صفُّ أشكالٍ بأعيانها** (`ch/form`، الجلسة ٧): لوحةُ **مرشّحات الكرّاسة**
  // تعرض الحالةَ الحركية الواحدة في جوابيها، فتُنتقى أشكالُها بأعيانها لا حروفُها —
  // ولا يُعرَض معها ما لا شأنَ له بالسؤال المعروض على المالك.
  const only = qs.get('only');
  const pick = qs.get('pick');
  const list = pick
    ? pick.split(',').map((one) => one.split('/')).map(([ch, form]) => ({ ch, form }))
    : allForms(spec).filter(({ ch }) => !only || only.includes(ch));
  const board = document.createElement('div');
  board.id = 'sheet';
  // **ولوحةُ المرشّحات تضيق بأشكالها**: أربعةُ أعمدةٍ لصفٍّ من شكلين تترك نصفَ
  // الصورة فارغاً وتصغّر ما يُراد أن يُقرأ بالعين. فالأعمدةُ أقلُّ العددين، والسائقُ
  // يحسب النافذةَ بالعدد نفسِه (`sheet_window`) فلا يفترق الرقمان.
  if (list.length < 4) board.style.gridTemplateColumns = `repeat(${list.length}, 1fr)`;
  document.body.replaceChildren(board);
  const showNodes = qs.get('tags') !== '0';
  for (const { ch, form } of list) {
    const cell = document.createElement('figure');
    cell.className = 'cell';
    try {
      const work = studio(ch, form);
      const entry = spec.letters[ch][form];
      const gesture = entry?.sameAs ? spec.letters[ch][entry.sameAs] : entry;
      const src = entry?.sameAs ? studio(ch, entry.sameAs) : work;
      const made = gesture?.strokes ? compose(src, gesture) : null;
      cell.append(ghostCanvas(work), overlay(work, made, { nodes: showNodes }));
      const cap = document.createElement('figcaption');
      cap.textContent = `${ch} · ${FORM_AR[form]}`;
      cell.append(cap);
    } catch (e) {
      cell.textContent = `${ch} ${form}: ${e.message}`;
    }
    board.append(cell);
  }
  // **والبترُ يُقال ولا يُخفى** (مراجعةُ الجلسة ٥: نافذةٌ مكتوبةٌ بيد بترت لوحةَ
  // الـ٤٨ صامتةً، **وشاهدُ العين الناقصُ شاهدٌ كاذب**): اللوحةُ تقيس نفسَها في
  // النافذة التي فُتحت لها، فإن جاوزتها **احمرّ التشغيلُ من نفسه** ولم تُسلَّم صورةٌ
  // ناقصة على أنها تامّة. والسائقُ يحسب النافذةَ من عدد الصفوف — وهذا الحارسُ يقول
  // إن أخطأ الحساب.
  await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
  const need = document.documentElement.scrollHeight;
  const have = innerHeight;
  const cols = getComputedStyle(board).gridTemplateColumns.split(' ').length;
  const rows = Math.ceil(list.length / cols);
  say(need <= have + 1, `لوحةُ المراجعة: ${list.length} شكلاً في ${rows} صفاً`
    + (need <= have + 1 ? ` — كلُّها في النافذة (${need} ≤ ${have})`
      : ` — **النافذةُ تبتُر**: اللوحةُ ${need} بكسلاً والنافذةُ ${have}`));
  await send();
}

// ————— ١٠) العدّةُ لليد: نقرُ العُقَد ترتيباً واتجاهاً —————

async function runStudio() {
  const spec = await anchors().catch(() => ({ letters: {} }));
  const letters = Object.keys(spec.letters);
  document.body.innerHTML = `
    <aside>
      <h1>عدّةُ تأليف المسارات</h1>
      <p class="note">انقر عُقَدَ الحرف بترتيب كتابته — من أين يبدأ القلم، وإلى أين
        يمضي. الشكلُ يخرج من خيال الحرف نفسِه، وإيماءتُك ترتيبٌ واتجاهٌ لا إحداثيات.</p>
      <div class="row">
        <input id="ch" size="2" value="${letters[0] || 'ب'}">
        <select id="form">${FORMS.map((f) => `<option value="${f}">${FORM_AR[f]}</option>`).join('')}</select>
        <button id="reload">اقرأ الخيال</button>
      </div>
      <div class="row">
        <button id="newStroke">جزءٌ جديد</button>
        <button id="undo">تراجع</button>
        <button id="clear">امسح</button>
        <button id="play">شاهِد</button>
      </div>
      <div id="gesture"></div>
      <p class="note" id="verdict"></p>
      <div class="row"><button id="copy">انسخ الإيماءة</button><button id="copyJson">انسخ JSON</button></div>
      <div id="preview"></div>
    </aside>
    <div id="stage"></div>`;

  const stage = document.getElementById('stage');
  const out = document.getElementById('gesture');
  const verdict = document.getElementById('verdict');
  let work = null;
  let strokes = [[]];
  let surface = null;


  function draw() {
    const gesture = { strokes: strokes.filter((s) => s.length) };
    let made = null;
    try { made = gesture.strokes.length ? compose(work, gesture) : null; } catch (e) { verdict.textContent = e.message; }
    stage.replaceChildren(ghostCanvas(work), overlay(work, made));
    for (const circle of stage.querySelectorAll('.node')) {
      const id = Number(circle.dataset.id);
      if (strokes.some((s) => s.includes(id))) circle.classList.add('pick');
      circle.addEventListener('click', () => {
        strokes[strokes.length - 1].push(id);
        draw();
      });
    }
    out.textContent = JSON.stringify({ strokes: gesture.strokes, nodes: work.graph.nodes.length, sig: work.sig });
    if (made) {
      const clean = made.strokes.map((s) => s.points);
      const wrong = made.strokes.map((s) => [...s.points].reverse());
      const dots = made.dots.map((d) => [d.at, d.at, d.at]);
      const good = judge(made, [...clean, ...dots]);
      const bad = judge(made, [...wrong, ...dots]);
      verdict.textContent = `الحكم: الصحيحُ ${good.accepted ? 'يُقبل ✓' : `يُرفَض (${good.primary}) ✗`}`
        + ` · المعكوسُ ${bad.accepted ? 'يُقبَل ✗' : `يُرفَض (${bad.primary}) ✓`}`;
      const box = document.getElementById('preview');
      surface?.destroy();
      surface = penSurface({ ref: made, label: 'معاينةُ المسار' });
      box.replaceChildren(surface.el);
    }
  }

  async function reload() {
    const ch = document.getElementById('ch').value.trim();
    const form = document.getElementById('form').value;
    work = studio(ch, form);
    const saved = spec.letters[ch]?.[form];
    strokes = saved && !saved.sameAs ? saved.strokes.map((s) => [...s]) : [[]];
    if (!strokes.length) strokes = [[]];
    draw();
  }

  document.getElementById('reload').onclick = reload;
  document.getElementById('form').onchange = reload;
  document.getElementById('newStroke').onclick = () => { strokes.push([]); draw(); };
  document.getElementById('undo').onclick = () => {
    const last = strokes[strokes.length - 1];
    if (last.length) last.pop(); else if (strokes.length > 1) strokes.pop();
    draw();
  };
  document.getElementById('clear').onclick = () => { strokes = [[]]; draw(); };
  document.getElementById('play').onclick = () => surface?.play();
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(
    JSON.stringify({ strokes: strokes.filter((s) => s.length), nodes: work.graph.nodes.length, sig: work.sig }));
  document.getElementById('copyJson').onclick = () => navigator.clipboard.writeText(
    JSON.stringify(compose(work, { strokes: strokes.filter((s) => s.length) }), null, 1));
  await reload();
}

// ————— الإقلاع —————

let FONT_SRC = null;

(async () => {
  try {
    FONT_SRC = await loadFont();
    if (qs.has('build')) await runBuild();
    else if (qs.has('nodes')) await runNodes();
    else if (qs.has('sheet')) await runSheet();
    else await runStudio();
  } catch (e) {
    const box = document.createElement('div');
    box.id = 'log';
    box.className = 'bad';
    box.textContent = `استثناء: ${e && e.message}`;
    document.body.append(box);
    if (!qs.has('open')) { say(false, `استثناء: ${e && e.message}`); await send(); }
  }
})();
</script>
