          open.points = open.points.slice(0, cut + 1).concat(points);
          const offset = cut + 1;
          open.folds.push(...folds.map((f) => ({ from: f.from + offset, apex: f.apex + offset, to: f.to + offset })));
          open.at.push(unit.text);
          return;
        }
        meta.joins.push({ at: unit.text, gap: round1(near), cut: true });
      }
      close();
      open = { points: [...points], folds: [...folds], at: [unit.text] };
    });
    if (source.ref.strokes.length > bodyCount || unit.kind === 'liga') close();

    // زوائدُ الوحدة في الكلمة: نقاطٌ (بعدّة القانونيّ) أو همزةُ متغيّرٍ (ضربةً)
    const canonDots = source.ref.dots;
    if (canonDots.length) {
      if (!unit.extras.length) throw new Error(`«${text}»/«${unit.text}»: نقاطُه لم تُعزَ من الخيال`);
      // **نقطةٌ لكلّ جرمٍ بموضعه** — لا مركزَ واحدٌ بمجموع العدّ (عطبُ م٤: العنقودُ
      // الثلاثيُّ يُرسَم دائرةً واحدة). وأجرامُ الخيال هي المقياس، **وعددُها يُطابَق
      // بعدد نقاط القانونيّ** فلا يمرّ التصاقٌ في الطبع صامتاً.
      // **والشكوى تُجمَع ولا توقف البناء** (حكمُ المدير، ١٥ أغسطس): `check_paths` هو
      // الحَكَم على المبنيّ — فبناءٌ يسقط عند أوّل التصاقٍ يمنع الحَكَمَ من الحكم.
      const want = canonDots.reduce((n, d) => n + d.count, 0);
      if (unit.extras.length !== want) {
        dropped.push(`${text}/${unit.text}: أجرامُ نقاطه في الخيال ${unit.extras.length}`
          + ` ونقاطُ قانونيّه ${want} — التُصِقت في الطبع أو انشقّت`);
      }
      dots.push(...unit.extras
        .map((b) => ({ at: [round1(b.at[0]), round1(b.at[1])], count: 1, after: true }))
        .sort(dotOrder));
    } else if (unit.ref.marks.length) {
      // همزةُ أ وإ من القانونيّ (أُلّفت بإيماءتها — حكم ٥ توطئةً لهمزات ق٣)
      for (const placed of unit.ref.marks) markStrokes.push({ ...placed, why: unit.text });
    } else if (unit.extras.length) {
      throw new Error(`«${text}»/«${unit.text}»: زوائدُ في الخيال (${unit.extras.length}) لا يعرفها قانونيُّه`);
    }
    if (!JOINS_AFTER[unit.text.at(-1)] || unit.wordEnd) close();

    // حركاتُ الوحدة ضرباتٌ بإيماءات علاماتها القانونية — بترتيبها في الرسم
    if (unit.marks.length) {
      for (const { mark, blobs } of unitMarks(unit, chars)) {
        const canonMark = canonMarks[mark];
        if (!canonMark) throw new Error(`«${text}»: لا إيماءةَ قانونيةً للعلامة «${mark}»`);
        const tm = fitTransform(canonMark.box, groupBox(blobs), text, mark);
        for (const stroke of canonMark.strokes) {
          markStrokes.push({
            points: stroke.points.map(tm.map),
            folds: carryFolds(stroke.folds, stroke.points.map(tm.map), 0, scale, dropped, `${text}/${mark}`),
            why: mark,
          });
        }
      }
    }
    // **وحبرُ الحرف حدُّ مساره في الكلمة**: نظيرُ «المسارُ داخلَ خيال حرفه» مرفوعاً إلى
    // الكلمة — فمسارٌ يتعدّى جسدَه إلى جسد جاره يمشي حبراً يمشيه غيرُه، فينطبق شقّان
    // من المسار بلا إعلان طيّة ويصير للموضع الواحد طولان. ويُقاس ولا يُفترَض.
    const own = depthIn(studioWord, [...unit.ref.strokes, ...unit.ref.marks].flatMap((st) => st.points),
      unit.bodyMask);
    meta.units.push({
      text: unit.text, form: unit.form, scale: round1(tr.s * 100) / 100, stray: own.out,
    });
  }
  close();

  // القطعُ ثم ضرباتُ العلامات ثم النقاط — والطيّاتُ تُحمَل عبر إعادة التوزيع أطوالاً،
  // والشوارد تُرَدّ إلى الحبر قبل التوزيع (فلا يبقى بعده طرفٌ على حافّة تقريب)
  const strokes = [
    ...runs.map((r, i) => resampleStroke({ ...r, points: snapIntoInk(r.points, studioWord.mask) }, dropped, `${text}#${i + 1}`, scale, ink)),
    ...markStrokes.map((m) => resampleStroke({ ...m, points: snapIntoInk(m.points, studioWord.mask) }, dropped, `${text}/${m.why}`, scale, ink)),
  ];
  // **وصندوقُ المادّة يسافر معها**: مربّعٌ للكلمة وسطرٌ عريضٌ للجملة — يقرؤه اللوحُ
  // فيرسم بمقاسه، ويقرؤه الحارسُ فيقيس عليه. (ويسقط إن كان مربّعاً، فلا رقمَ زائد.)
  const box = studioWord.cal.box;
  const ref = { strokes, dots, line: round1(studioWord.line), tolerance: scale };
  if (box && box[0] !== GRID) ref.box = [box[0], box[1]];

  // **المسارُ داخل خيال الكلمة** — الغَوصُ يُقاس نقطةً نقطة كما في الحرف، **وشكواه
  // تسمّي قطعتَها** (سنّةُ الجلسة ٧: العطبُ يسمّي موضعَه، فلا يُبحَث في كلمةٍ كلِّها)
  const labels = [...runs.map((r, i) => `قطعة ${i + 1} (${(r.at || []).join('')})`), ...markStrokes.map((m) => `علامة «${m.why}»`)];
  const depth = depthIn(studioWord, strokes.flatMap((s) => s.points), studioWord.mask);
  if (depth.out) {
    const guilty = strokes.map((s, i) => {
      const one = depthIn(studioWord, s.points, studioWord.mask);
      return one.out ? `${labels[i]}: ${one.out} من ${s.points.length}` : null;
    }).filter(Boolean);
    throw new Error(`«${text}»: ${depth.out} نقطةً خارج خيال الكلمة — ${guilty.join(' · ')}`
      + ` (${depth.stray.slice(0, 3).map((p) => p.join('،')).join(' · ')})`);
  }

  // **ولا يخرج من هنا ما لا يقبله محرّكُه**: صحيحُه يُقبَل ومعكوسُ أوّلِه يُرَدّ
  const walk = strokes.map((s) => s.points);
  const taps = dots.flatMap((d) => Array.from({ length: d.count }, () => [d.at]));
  const good = judge(ref, [...walk, ...taps], { tolerance: scale });
  if (!good.accepted) {
    const detail = good.faults.slice(0, 4)
      .map((f) => `${f.code}@${f.part}(${f.at.map(Math.round).join('،')})`).join(' · ');
    const err = new Error(`«${text}»: المحرّكُ يردّ كتابتَها الصحيحة — ${detail}`
      + ` — تغطية ${good.metrics.coverage.toFixed(2)} · أجزاء ${ref.strokes.length}+${dots.length}`
      + ` · طيّات [${strokes.map((s) => (s.folds || []).length).join('،')}]`);
    err.ref = ref;
    throw err;
  }
  const bad = judge(ref, [[...walk[0]].reverse(), ...walk.slice(1), ...taps], { tolerance: scale });
  if (bad.accepted) throw new Error(`«${text}»: المحرّكُ يقبل أولَها معكوساً`);

  log?.({
    text, strokes: strokes.length, dots: dots.length, joins: meta.joins,
    skew: meta.skew, depth: round1(depth.least), scale, dropped,
    stray: meta.units.filter((u) => u.stray).map((u) => `${u.text}:${u.stray}`),
  });
  return { ref, meta, dropped };
}

/**
 * **قانونيُّ العلامة**: خيالُ العلامة وحدَها يملأ صندوقَه (تُصيَّر على حاملٍ صفريّ
 * «ـ» ليعرف المُشكِّلُ أنها علامةُ حرف، ثم يُقاس جرمُها ويُكبَّر وحدَه)، وتُنحَّف
 * ويُقرأ هيكلُها بياناً، **وتُمشى بإيماءتها المؤلَّفة** — عينُ منظومة حكم ٥ (شولةُ
 * الكاف): البدايةُ والاتجاهُ مادّةٌ مدرَّسة في العلامة كما في الجسم، توطئةً لهمزات
 * ق٣. ثم تُنزَّل على نظائرها في الكلمات بجرمها هناك.
 */
async function markCanonical(mark, entry) {
  // **حبرُ العلامة فرقُ نزعٍ لا تصفيةَ موضع** (أمسكه أوّلُ بناء): الضمّةُ والتنوينُ
  // خرجا **شريطَ الحامل نفسَه** (عقدتان أفقيتان متطابقتان لعلامتين مختلفتين) لأنّ
  // التصفيةَ بالمركز تُبقي الشريطَ الممدود. فالحاملُ يُرسَم مرّتين — به وبلا العلامة —
  // والفرقُ حبرُها وحدَه، وهو مبدأُ عزو حركات الكلمة بعينه.
  const carrier = 'ـ';
  setSheet(GRID);                       // وقانونيُّ العلامة كذلك: صندوقُه مربّع
  const inkOf = async (size, x, y) => maskMinus(
    imageMask(await svgPaint(carrier + mark, size, x, y)),
    imageMask(await svgPaint(carrier, size, x, y)));

  const probe = await inkOf(100, GRID / 2, GRID / 2);
  const box = maskBox(probe);
  if (!box) throw new Error(`علامة «${mark}»: لا جرمَ لها على الحامل`);
  const w = box.w;
  const h = box.h;
  const span = GRID - 2 * MARGIN;
  const scale = span / Math.max(w, h);
  const size = 100 * scale;
  const markMask = await inkOf(size, GRID / 2 + (GRID / 2 - box.cx) * scale,
    GRID / 2 + (GRID / 2 - box.cy) * scale);
  const parts = maskBodies(markMask).filter((b) => b.area >= DUST);
  if (!parts.length) throw new Error(`علامة «${mark}»: ضاع جرمُها في التكبير`);
  for (let i = 0; i < markMask.length; i++) markMask[i] = 0;
  for (const part of parts) for (const c of part.cells) markMask[c] = 1;
  const image = await svgPaint(carrier + mark, size, GRID / 2 + (GRID / 2 - box.cx) * scale,
    GRID / 2 + (GRID / 2 - box.cy) * scale);
  const work = { bodyMask: markMask, graph: skeletonGraph(thin(markMask)), dt: distance(markMask) };
  if (!entry?.strokes?.length) {
    return { mark, work, box: maskBox(markMask), aspect: w / h, strokes: null, image };
  }
  const strokes = [];
  for (const ids of entry.strokes) {
    // كما في `compose` سواءً: الطيّةُ المعلَنة من مفرق الهيكل (سنّةُ الشدّة الوسطى)
    // تُحمَل عبر الصقل أطوالاً ثم تُقرأ أرقاماً في المسار الموزَّع.
    const walked = walkGesture(work, ids);
    let points = smooth(walked.points, 2, work);
    points = extendEnd(points, markMask, true);
    let folds = walked.folds.map((f) => ({
      from: f.from ? f.from + 1 : 0, apex: f.apex + 1, to: f.to + 1,
    }));
    points = extendEnd(points, markMask, false);
    points = smooth(points, 2, work);
    const before = prepare(points);
    const spans = folds.map((f) => [before.cum[f.from], before.cum[f.apex], before.cum[f.to]]);
    points = resample(points);
    const at = (len) => Math.min(points.length - 1,
      Math.max(0, Math.round((len / (before.len || 1)) * (points.length - 1))));
    folds = spans.map(([a, b, c]) => ({ from: at(a), apex: at(b), to: at(c) }))
      .filter((f) => f.from < f.apex && f.apex < f.to);
    strokes.push(folds.length ? { points, start: points[0], folds } : { points, start: points[0] });
  }
  const ink = depthIn(work, strokes.flatMap((s) => s.points), markMask);
  if (ink.out) throw new Error(`علامة «${mark}»: ${ink.out} نقطةً خارج جرمها`);
  return {
    mark, work, image,
    box: maskBox(markMask),
    aspect: w / h,
    strokes,
    /** شارةُ العرض لبطاقة التعريف: العلامةُ في صندوقها المعياريّ — من المسار نفسِه */
    glyph: { strokes: strokes.map((s) => ({ points: s.points, start: s.start })), dots: [] },
  };
}

/**
 * **قانونيّاتُ التنزيل**: لكلِّ وحدةٍ (حرفاً أو متغيّراً أو لام-ألف) بشكل موقعها —
 * مسارُها المركَّب، وجسدُها (حدودُ قناعه)، وعددُ أجزاء جسدها (فما بعدها ضرباتُ
 * علاماتٍ مؤلَّفة تُفرَد في الكلمة إفرادَها).
 */
function canonOf(works, done, forms) {
  const out = {};
  for (const form of FORMS) {
    const entry = forms[form];
    const gesture = entry.sameAs ? forms[entry.sameAs] : entry;
    out[form] = {
      ref: done[form],
      body: maskBox(works[form].bodyMask),
      bodyStrokes: gesture.strokes.length,
    };
  }
  return out;
}

/**
 * **بناءُ مسارات الكلمات كلِّها من المنهج** — قائمةُ العمل تُقرأ من `curriculum.js`
 * (وصلاتُ مرحلة الوصل ثم كلماتُ الجداول كلُّها) **ولا كلمةَ تُكتب هنا**. وأسطرُ
 * المسافة (كلمتان تتجاوران بمسافةٍ من المُشكِّل — مادّةُ «المسافة بين الكلمات»)
 * تُشتقّ بقاعدةٍ معلنة: أولا كلمتَي كلِّ عقدة نسخٍ غير عقد العلامات.
 *
 * **والجملُ من سلّم اقرأ تُؤلَّف كما تُؤلَّف الكلمة** (الجلسة ٩، `METHOD.md §٤`
 * المرحلة ١٤): نصٌّ واحدٌ يُصيَّره المُشكِّل، فيخرج منه **اتجاهُ السطر والمسافةُ بين
 * الكلمات** حقيقةً مقيسةً لا تركيباً — وهي مادّةُ المحطة بعينها. ولا فرقَ في
 * التأليف بين جملةٍ وسطرِ مسافة: كلاهما كلماتٌ على سطرٍ واحد.
 */
/**
 * **قائمةُ عمل الكلمات — مرتّبةٌ ومقروءةٌ من المنهج** (تجزئةُ البناء، حكمُ المدير
 * ١٥ أغسطس ٢٠٢٦): وحدةٌ واحدةٌ مرقَّمة تُشرَّح دفعاتٍ، فلكلّ دفعةٍ حدّاها من هذه
 * القائمة بعينها — **فالترتيبُ عقدٌ**: دفعتان تُبنيان في تشغيلتين مختلفتين لا
 * تلتقيان على كلمةٍ مرّتين ولا تتركان واحدةً بينهما.
 */
function workListOf(cur) {
  const kind = (k) => cur.STAGES.filter((s) => s.kind === k).flatMap((s) => s.nodes || []);
  const joinNodes = kind('join');
  const pairs = joinNodes
    .filter((n) => (n.words || []).length >= 2 && !String(n.part).startsWith('sign-'))
    .map((n) => `${n.words[0]} ${n.words[1]}`);
  return [
    ...joinNodes.flatMap((n) => n.joins || []).map((text) => ({ kind: 'word', text })),
    ...Object.keys(cur.WORDS).map((text) => ({ kind: 'word', text })),
    ...pairs.map((text) => ({ kind: 'pair', text })),
    ...kind('sentence').flatMap((n) => n.sentences || []).map((text) => ({ kind: 'sentence', text })),
  ];
}

async function buildWords(spec, canon, opts = {}) {
  const cur = await import('/js/curriculum.js');
  JOINS_AFTER = {};
  for (const [ch, info] of Object.entries(cur.LETTERS)) JOINS_AFTER[ch] = !!info.joins;
  for (const [ch, info] of Object.entries(cur.VARIANTS)) JOINS_AFTER[ch] = !!info.joins;

  // **ومحطاتُ النوع الواحد كلُّها لا أُولاها** (جلسةُ التوسعة): صارت للنسخ محطاتٌ
  // (الوصلُ · البساتينُ · الجذور) وللجمل محطتان (القصيرةُ · السلّم) — و`find` كانت
  // تأخذ الأولى وحدَها **فتخرج الوحدةُ ناقصةً صامتة**: مادّةٌ في المنهج بلا مسار.
  const kind = (k) => cur.STAGES.filter((s) => s.kind === k).flatMap((s) => s.nodes || []);
  const joinNodes = kind('join');
  const joins = joinNodes.flatMap((n) => n.joins || []);
  const words = Object.keys(cur.WORDS);
  const pairs = joinNodes
    .filter((n) => (n.words || []).length >= 2 && !String(n.part).startsWith('sign-'))
    .map((n) => `${n.words[0]} ${n.words[1]}`);
  // وجملُ سلّم اقرأ — تُقرأ من عقدها كما تُقرأ الكلماتُ من جدولها
  const sentences = kind('sentence').flatMap((n) => n.sentences || []);

  // العلاماتُ المطلوبة قانونيّاتُها: كلُّ حركةٍ وردت في المادّة — فعلامةٌ بلا إيماءةٍ
  // مؤلَّفةٍ تُسقط البناءَ باسمها، ولا تدخل كلمةٌ حركتُها نقرةٌ عمياء.
  const needed = [...new Set([...joins, ...words, ...sentences]
    .flatMap((t) => [...t].filter((c) => HARAKA.test(c))))];
  const canonMarks = {};
  for (const mark of needed) {
    if (!spec.marks?.[mark]?.strokes?.length) {
      throw new Error(`العلامة «${mark}» تلزم الكلماتِ ولا إيماءةَ لها في \`marks\``);
    }
    canonMarks[mark] = await markCanonical(mark, spec.marks[mark]);
  }

  const out = {};
  const report = [];
  const failedPairs = [];
  const failed = [];
  const failRefs = {};
  const failedSentences = [];
  let reused = 0;

  /**
   * **الدفعةُ حدّان من قائمة العمل** (تجزئةُ البناء): بلا حدّين تُبنى القائمةُ كلُّها
   * كما كانت — فالتجزئةُ زيادةٌ لا تبديلُ عقد.
   *
   * **والمُعاد من بناءٍ قائم** (بصمةُ المدخلات، حكمُ المدير ب): ما لم يتبدّل مدخلُه
   * لا يُعاد بناؤه — والسائقُ هو الذي يقرّر ما يُعاد ويرسله في `reuse`، لأنه يعرف
   * **ما تبدّل في هذه الجلسة** ويقرأ البناءَ القائم من القرص. والكلمةُ المُعادة
   * تُقيَّد بعددها في الحصيلة فلا يُقال «بُنيت» وهي مَنسوخة.
   */
  const list = workListOf(cur);
  const from = Number.isFinite(opts.from) ? opts.from : 0;
  const to = Number.isFinite(opts.to) ? opts.to : list.length;
  const bags = { word: failed, pair: failedPairs, sentence: failedSentences };
  // **وشكوى الكلمة لا توقف جردَ أخواتها**: البناءُ يجمع الشكاوى كلَّها ثم يسقط بها
  // مجتمعةً — فيُرى العطبُ صنفاً لا واحدةً بعد واحدة (وقد كشف ذلك أنّ ما يبدو ثلاثةَ
  // أعطاب في ثلاث تشغيلاتٍ عطبٌ واحدٌ في المحرّك).
  for (const item of list.slice(from, to)) {
    const kept = opts.reuse?.[item.text];
    if (kept) { out[item.text] = kept; reused++; continue; }
    try {
      const st = await wordStudio(item.text);
      out[item.text] = composeWord(st, canon, canonMarks, (line) => report.push(line)).ref;
    } catch (e) {
      bags[item.kind].push(item.kind === 'word' ? `«${item.text}»: ${e.message}`
        : `${item.text}: ${e.message}`);
      if (e.ref) failRefs[item.text] = e.ref;
    }
  }
  const glyphs = {};
  for (const [mark, cm] of Object.entries(canonMarks)) glyphs[mark] = cm.glyph;
  return {
    words: out, report, glyphs, failedPairs, failedSentences, failed, failRefs,
    reused, total: list.length, from, to,
    counts: {
      joins: joins.length, words: words.length, pairs: pairs.length,
      sentences: sentences.length,
    },
  };
}

// ————— ٧ب) أشكالُ التهيئة الحركية: هندسةٌ **محسوبة** لا خيالُ حرف —————
//
// المرحلةُ الأولى في `METHOD.md §٤` — «خطوطٌ أفقية/رأسية/مائلة · منحنيات ودوائر
// باتجاهٍ صحيح · موجاتٌ وحلقات · تحكّمٌ داخل حدود» — **قبل أيّ حرف**. ومحطاتُها
// الستُّ في `curriculum.js` (الجلسة ٣)، ومساراتُها هنا (بند الجلسة ٤: «بمساراتٍ من
// `make_paths.html`»).
//
// **ولِمَ تُبنى في العدّة وليس فيها خيالُ حرفٍ يُقرأ؟** لأنّ عهدَ `METHOD.md §٣.٨`
// **ألّا تُكتب إحداثياتٌ بيد**، وشكلُ التهيئة **ليس حقيقةً من حقائق الخطّ** تُقرأ من
// المُشكِّل — بل هو **تعريفُه الهندسيّ نفسُه**: «خطٌّ من حافّة الصندوق إلى حافّته»،
// «دائرةٌ نصفُ قطرها ثلثُ الصندوق». فالمكتوبُ هنا **التعريف**، والإحداثياتُ تُحسب
// منه — كما تُحسب أشكالُ عدّة المعايرة (`tools/make_pen_traces.mjs`). وموضعُها هذه
// العدّةُ لا وحدةٌ في `app/`، لثلاثة تجتمع فيها:
//   ١) **إعادةُ التوزيع نفسُها** (`resample`): أقصى طولِ قطعةٍ مقروءٌ من سماحة
//      المحرّك، فلا يُبنى شكلُ تهيئةٍ بقطعةٍ تخدع نافذةَ الرتابة.
//   ٢) **الحكمُ يُجرَّب ساعةَ البناء**: كلُّ شكلٍ يُدخَل على `judge` صحيحاً ومعكوساً
//      قبل أن يخرج من هنا — فلا يدخل التطبيقَ شكلٌ لا يقبله محرّكُه أو يقبل عكسَه.
//   ٣) **الصندوقُ صندوقُ الحروف** (`MARGIN` نفسُه): فما تمرّنت عليه اليدُ في التهيئة
//      هو المدى الذي ستملؤه الحروفُ بعدها، لا صندوقٌ آخر.
//
// **واتجاهُ الدوران يُقرأ من المادّة لا يُختار**: `METHOD.md §٤` يشترط «دوائر
// **باتجاهٍ صحيح**»، والصحيحُ هو دورانُ أوّل حلقةٍ سيكتبها الطفلُ — **حلقةُ م
// المعزولة** (المجموعةُ الأولى)، وإيماءتُها تقول «مع عقارب الساعة». فلا يُكتب
// الاتجاهُ هنا رأياً: يُقاس من مسار م المؤلَّف في هذا البناء نفسِه (إشارةُ مساحته
// المُوجَّهة)، فإن تبدّل مسارُها تبدّلت معه دوائرُ التهيئة.

/** الصندوقُ: حافّتا الكراسة نفسُهما (`MARGIN`) — مدى الحرف هو مدى التهيئة. */
const W_LOW = MARGIN;
const W_HIGH = GRID - MARGIN;
const W_MID = GRID / 2;

/** منحنىً محسوب: يُعاين كثيفاً ثم يُعاد توزيعُه بخطوة المحرّك (`stepFor`). */
const curve = (fn, dense = 260) => resample(
  Array.from({ length: dense + 1 }, (_, i) => fn(i / dense)).map((p) => [round1(p[0]), round1(p[1])]));

const wLine = (a, b) => curve((t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], 24);

/** قوسٌ حول مركز: من زاويةٍ إلى زاوية (إحداثياتُ شاشة، y نازلة). */
const wArc = (c, r, from, to) => curve((t) => {
  const a = from + (to - from) * t;
  return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
});

/** موجةٌ من اليمين إلى اليسار — أوّلُ بطنها **نازل** كبطون ب وس. */
const wWave = (y, amp, waves) => curve((t) => [
  W_HIGH - (W_HIGH - W_LOW) * t,
  y + amp * Math.sin(2 * Math.PI * waves * t),
]);

/**
 * خطٌّ مكسورٌ **بزوايا مدوَّرة** يمرّ بمواضعَ بأعيانها (زجزاجٌ ودرج).
 *
 * **ولِمَ تُدوَّر؟** لأن الزاوية الحادّة موضعٌ **لا يُقاس**: ضلعاها يقتربان فيقع
 * إسقاطُ يدٍ ترتجف على الضلع الخطأ، فيُردّ طفلٌ يدور الزاويةَ كما تُدار حقّاً. وقد
 * قِسناه: زجزاجٌ بزوايا حادّة يحتمل ١٨ من سماحة ٦٣ — **دون عهد `child-drift`** —
 * ويحتمل ٥٤ إذا دُوِّرت زواياه. وهي عينُ قاعدة الجلسة ٢: **ما لا يبلغ سماحةَ
 * المحرّك لا يُقاس، ولا يُدرَّس ما لا يُقاس**. واليدُ تدور الزاويةَ كذلك لا تكسرها.
 */
function wPolyline(points, round = 140) {
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const [a, b, c] = [points[i - 1], points[i], points[i + 1]];
    const v1 = [a[0] - b[0], a[1] - b[1]];
    const v2 = [c[0] - b[0], c[1] - b[1]];
    const n1 = Math.hypot(...v1) || 1;
    const n2 = Math.hypot(...v2) || 1;
    const cut = Math.min(round, n1 / 2, n2 / 2);
    const p1 = [b[0] + (v1[0] / n1) * cut, b[1] + (v1[1] / n1) * cut];
    const p2 = [b[0] + (v2[0] / n2) * cut, b[1] + (v2[1] / n2) * cut];
    out.push(p1);
    for (let k = 1; k < 12; k++) {       // قوسٌ تربيعيّ بين الضلعين على رأس الزاوية
      const t = k / 12;
      out.push([(1 - t) ** 2 * p1[0] + 2 * (1 - t) * t * b[0] + t * t * p2[0],
        (1 - t) ** 2 * p1[1] + 2 * (1 - t) * t * b[1] + t * t * p2[1]]);
    }
    out.push(p2);
  }
  out.push(points[points.length - 1]);
  const poly = prepare(out);
  return curve((t) => pointAt(poly, t * poly.len).at, 200);
}

/**
 * **إشارةُ الدوران**: مساحةٌ مُوجَّهة موجبة = **مع عقارب الساعة** على الشاشة (لأن y
 * نازلة). ومقياسُها مُعايَرٌ بشكلٍ معلومٍ سلفاً في هذا المشروع: دائرةُ عدّة المعايرة
 * (`ring`) تمضي من قمّتها **يساراً** فتخرج سالبة.
 */
const spinOf = (points) => {
  let twice = 0;
  for (let i = 0; i < points.length; i++) {
    const q = points[(i + 1) % points.length];
    twice += points[i][0] * q[1] - q[0] * points[i][1];
  }
  return Math.sign(twice);
};

/**
 * **إعلانُ المحطات الست** — لكلٍّ ثلاثةُ أشكال، ومفتاحُها **عينُ `part` في
 * `curriculum.js`** (يحرسه `tools/test_warmup.mjs`: لا محطةَ بلا أشكال ولا شكلَ بلا
 * محطة). و`spin` يُمرَّر إلى ما يدور، فالدوائرُ والحلقاتُ تتبع حلقةَ الميم.
 */
const WARMUP_SPEC = (spin) => [
  ['lines-h', [
    ['خطٌّ أفقيٌّ طويل من اليمين إلى اليسار — اتجاهُ الكتابة',
      [wLine([W_HIGH, W_MID], [W_LOW, W_MID])]],
    ['خطّان أفقيان: الأعلى ثم الأدنى — يدٌ تعيد الحركةَ نفسَها',
      [wLine([W_HIGH, 350], [W_LOW, 350]), wLine([W_HIGH, 650], [W_LOW, 650])]],
    ['ثلاثةُ خطوطٍ قصيرة بترتيبها من أعلى — ضبطُ الابتداء ثلاثاً',
      [250, 500, 750].map((y) => wLine([W_HIGH, y], [W_LOW, y]))],
  ]],
  ['lines-v', [
    ['خطٌّ رأسيٌّ من أعلى إلى أسفل — نزولُ الألف',
      [wLine([W_MID, W_LOW], [W_MID, W_HIGH])]],
    ['خطّان رأسيان: الأيمنُ ثم الأيسر — ترتيبُ العربية',
      [wLine([650, W_LOW], [650, W_HIGH]), wLine([350, W_LOW], [350, W_HIGH])]],
    ['ثلاثةُ خطوطٍ رأسية من اليمين — ثباتُ النزول',
      [750, 500, 250].map((x) => wLine([x, W_LOW], [x, W_HIGH]))],
  ]],
  ['lines-d', [
    ['مائلٌ من أعلى اليمين إلى أسفل اليسار', [wLine([W_HIGH, W_LOW], [W_LOW, W_HIGH])]],
    ['مائلٌ من أعلى اليسار إلى أسفل اليمين', [wLine([W_LOW, W_LOW], [W_HIGH, W_HIGH])]],
    ['خيمةٌ بجزأين: صعودٌ من اليمين ثم نزولٌ إلى اليسار',
      [wLine([W_HIGH, W_HIGH], [W_MID, W_LOW]), wLine([W_MID, W_LOW], [W_LOW, W_HIGH])]],
  ]],
  ['curves', [
    ['كأسٌ: من اليمين ينزل إلى القاع ثم يصعد يساراً — بطنُ الباء',
      [wArc([W_MID, 420], 320, 0, Math.PI)]],
    ['قبّةٌ: من اليمين يصعد إلى القمّة ثم ينزل يساراً', [wArc([W_MID, 580], 320, 0, -Math.PI)]],
    ['دائرةٌ تامّة من قمّتها — **بدوران حلقة الميم**',
      [wArc([W_MID, W_MID], 320, -Math.PI / 2, -Math.PI / 2 + spin * 2 * Math.PI)]],
  ]],
  ['waves', [
    ['موجتان واسعتان من اليمين — بطنٌ فظهرٌ بلا رفعِ قلم', [wWave(W_MID, 140, 2)]],
    ['ثلاثُ موجاتٍ أضيق — يدٌ تضبط حركةً أصغر', [wWave(W_MID, 110, 3)]],
    ['حلقتان تدوران دورانَ الميم: اليمنى ثم اليسرى',
      [700, 300].map((x) => wArc([x, W_MID], 170, -Math.PI / 2, -Math.PI / 2 + spin * 2 * Math.PI))],
  ]],
  ['inside', [
    ['طريقٌ متموّج بين حدّين — لا يخرج القلمُ عن الممرّ', [wWave(W_MID, 150, 2)], true],
    ['طريقٌ منكسر: انعطافتان داخل الحدود',
      [wPolyline([[W_HIGH, 280], [640, 720], [360, 280], [W_LOW, 720]])], true],
    ['درجٌ ينزل يساراً — أفقيٌّ ورأسيٌّ في حركةٍ واحدة',
      [wPolyline([[W_HIGH, 200], [610, 200], [610, 450], [310, 450], [310, 700], [W_LOW, 700]], 100)], true],
  ]],
];

/**
 * **سماحةُ محطة «التحكّم داخل حدود»** — وهي عينُ ما تدرّسه: `METHOD.md §٣.٥`
 * «السماحةُ تملكها المحطة وتتشدّد مع التقدّم». فممرُّها أضيقُ من سماحة سائر المحطات،
 * **ويراه الطفلُ**: الشاشةُ ترسم الممرَّ بعرض السماحة نفسِها (`bounds` في `pen.js`)،
 * فلا حدَّ مرسومٌ يخالف الحدَّ المقيس.
 *
 * ⚠ ورقمُه **مبدئيٌّ كسائر أرقام السماحة** (`METHOD.md §٣.٥`: تُعايَر بمسارات ميدانٍ
 * حقيقية) — وموضعُ معايرته الجلسةُ ١٢ مع أصله.
 */
const WARMUP_STRICT = 0.7;

/** يبني أشكالَ التهيئة كلَّها، ويردّ ما لا يقبله المحرّكُ صحيحاً ويردّ عكسَه. */
function buildWarmups(paths) {
  const loop = paths['م']?.isolated?.strokes?.[0]?.points;
  if (!loop) {
    throw new Error('لا مسارَ لحلقة م المعزولة — ومنها يُقرأ اتجاهُ دوران دوائر التهيئة');
  }
  const spin = spinOf(loop);
  if (!spin) throw new Error('مساحةُ حلقة م صفرٌ — لا يُقرأ منها اتجاهُ دوران');

  const out = {};
  const report = [];
  for (const [part, shapes] of WARMUP_SPEC(spin)) {
    out[part] = { shapes: [] };
    for (const [note, strokes, strict] of shapes) {
      const id = `${part}/${out[part].shapes.length + 1}`;
      const ref = { strokes: strokes.map((points) => ({ points, start: points[0] })), dots: [] };
      const entry = { id, note, ref };
      if (strict) { entry.tolerance = WARMUP_STRICT; entry.bounds = true; }
      const tolerance = entry.tolerance;

      // **لا يخرج من هنا شكلٌ لا يقبله محرّكُه**: يُكتب صحيحاً فيُقبَل، ومعكوساً
      // فيُرَدّ — نظيرُ «المسارُ داخلَ خيال حرفه» في الحروف، مقيساً لا مدَّعىً.
      const walk = (back) => ref.strokes.map((s) => (back ? [...s.points].reverse() : s.points));
      const good = judge(ref, walk(false), { tolerance });
      const bad = judge(ref, walk(true), { tolerance });
      if (!good.accepted) throw new Error(`${id}: المحرّكُ يردّ كتابتَه الصحيحة (${good.primary})`);
      if (bad.accepted) throw new Error(`${id}: المحرّكُ يقبله معكوساً — شكلٌ لا يدرّس اتجاهاً`);

      // وأطرافُ الأشكال داخلَ الصندوق: ما خرج عن اللوح لا يبلغه إصبعُ الطفل
      const stray = ref.strokes.flatMap((s) => s.points)
        .filter((p) => p[0] < 0 || p[1] < 0 || p[0] > GRID || p[1] > GRID);
      if (stray.length) throw new Error(`${id}: ${stray.length} نقطةً خارج الشبكة`);

      out[part].shapes.push(entry);
      report.push({ id, strokes: ref.strokes.length, reversed: bad.primary, tolerance });
    }
  }
  return { warmups: out, report, spin };
}

// ————— ٨) العرضُ: الشبكةُ والخيالُ والهيكلُ والمسارُ المؤلَّف —————

const SVG = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}) => {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, String(v));
  return el;
};
const pathD = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ');

function ghostCanvas(work) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = GRID;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(work.image, 0, 0);
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = '#f7f4ee';
  ctx.fillRect(0, 0, GRID, GRID);
  canvas.style.opacity = '.28';
  return canvas;
}

function overlay(work, made, { nodes = true, skeleton = true, grid = true } = {}) {
  const svg = sv('svg', { viewBox: `0 0 ${GRID} ${GRID}` });
  if (grid) {
    for (let i = 1; i < 10; i++) {
      svg.append(sv('line', { class: 'grid-line', x1: i * 100, y1: 0, x2: i * 100, y2: GRID }));
      svg.append(sv('line', { class: 'grid-line', x1: 0, y1: i * 100, x2: GRID, y2: i * 100 }));
    }
  }
  if (skeleton) {
    for (const edge of work.graph.edges) {
      svg.append(sv('path', { class: 'skel', d: pathD(edge.chain.map(px2grid).map((p) => [round1(p[0]), round1(p[1])])) }));
    }
  }
  if (made) {
    for (const stroke of made.strokes) {
      svg.append(sv('path', { class: 'made', d: pathD(stroke.points) }));
      svg.append(sv('circle', { class: 'made-start', cx: stroke.start[0], cy: stroke.start[1], r: 22 }));
    }
    for (const dot of made.dots) {
      svg.append(sv('circle', { class: 'made-dot', cx: dot.at[0], cy: dot.at[1], r: 20 }));
    }
  }
  if (nodes) {
    for (const node of work.graph.nodes) {
      svg.append(sv('circle', { class: 'node', cx: node.at[0], cy: node.at[1], r: 26, 'data-id': node.id }));
      const tag = sv('text', { class: 'node-tag', x: node.at[0], y: node.at[1] });
      tag.textContent = String(node.id);
      svg.append(tag);
    }
  }
  return svg;
}

// ————— ٩) الأوضاع —————

async function anchors() {
  // ملفُّ الإيماءات يُخدَم للعدّة باسمٍ داخليّ (سائقُها يخدم `app/` جذراً)
  const res = await fetch('/__anchors.json');
  return res.json();
}

/** الحروفُ × أشكالُها الأربعة — قائمةُ العمل التامّة، تُقرأ في كل وضع. */
const allForms = (spec) => Object.keys(spec.letters)
  .flatMap((ch) => FORMS.map((form) => ({ ch, form })));
const workList = (spec) => Object.entries(spec.letters)
  .flatMap(([ch, forms]) => FORMS.filter((f) => forms[f]).map((form) => ({ ch, form })));

/** يبني كلَّ ما في ملفّ الإيماءات، ويتحقّق من دعوى «الشكلان واحد» بالخيال لا بالقول. */
function buildAll(spec, canon = null) {
  const paths = {};
  const report = [];
  for (const [ch, forms] of Object.entries(spec.letters)) {
    const done = {};
    const works = {};
    for (const form of FORMS) {
      const entry = forms[form];
      if (!entry) throw new Error(`${ch}: لا إيماءةَ لشكل ${FORM_AR[form]}`);
      works[form] = works[form] || studio(ch, form);
      const work = works[form];
      if (entry.sameAs) {
        // **الدعوى تُفحَص بالخيال**: بصمتا القناعين تتطابقان أو تسقط الدعوى.
        const source = works[entry.sameAs] || (works[entry.sameAs] = studio(ch, entry.sameAs));
        if (work.sig !== source.sig) {
          throw new Error(`${ch}/${FORM_AR[form]}: ادُّعي أنه عينُ ${FORM_AR[entry.sameAs]}`
            + ` وخيالاهما مختلفان (${work.sig} ≠ ${source.sig})`);
        }
        done[form] = done[entry.sameAs] || compose(source, forms[entry.sameAs]);
        report.push({ ch, form, sameAs: entry.sameAs, sig: work.sig, nodes: work.graph.nodes.length });
        continue;
      }
      if (entry.nodes != null && entry.nodes !== work.graph.nodes.length) {
        throw new Error(`${ch}/${FORM_AR[form]}: عُقَدُ الخيال ${work.graph.nodes.length}`
          + ` والإيماءةُ كُتبت على ${entry.nodes} — أُعيدت قراءةُ الخيال فلْتُراجَع الإيماءة`);
      }
      if (entry.sig && entry.sig !== work.sig) {
        throw new Error(`${ch}/${FORM_AR[form]}: بصمةُ الخيال ${work.sig} والإيماءةُ على ${entry.sig}`);
      }
      // **والعطبُ يسمّي موضعَه**: شكوى `compose` تخرج بلا اسم الشكل، فيضيع وقتُ من
      // يبحث عن أيّ إيماءةٍ من مئةٍ واثنتي عشرة اشتكت.
      try {
        done[form] = compose(work, entry);
      } catch (e) {
        throw new Error(`${ch}/${FORM_AR[form]}: ${e.message}`);
      }
      // **والعلامةُ المكتوبة ضربةً تُقاس على الخيال كلِّه**: ضربتُها في جرم العلامة لا
      // في جسم الحرف، فقياسُها على قناع الجسم يقول «خارج الحبر» وهي في حبرها.
      const ink = depthIn(work, done[form].strokes.flatMap((st) => st.points),
        entry.marks || entry.markStrokes ? work.mask : work.bodyMask);
      if (ink.out) {
        throw new Error(`${ch}/${FORM_AR[form]}: ${ink.out} نقطةً خارج خيال الحرف`
          + ` (${ink.stray.slice(0, 3).map((p) => p.join('،')).join(' · ')})`

          + ' — المسارُ يدّعي على الحرف ما ليس فيه');
      }
      report.push({
        ch, form, sig: work.sig, nodes: work.graph.nodes.length, depth: round1(ink.least),
        strokes: done[form].strokes.length, dots: done[form].dots.length,
        folds: done[form].strokes.reduce((n, st) => n + (st.folds?.length || 0), 0),
      });
    }
    paths[ch] = done;
    if (canon) canon[ch] = canonOf(works, done, forms);
  }
  return { paths, report };
}

/**
 * 🧩 **دفعةُ الكلمات** (تجزئةُ البناء — حكمُ المدير، ١٥ أغسطس ٢٠٢٦): تشغيلةٌ تبني
 * حدَّين من قائمة العمل وترسلهما، **ولا تبني القانونيّاتِ من جديد**: تقرؤها من
 * `/__canon.json` الذي كتبته دفعةُ الحروف — وهي كائناتٌ نصّيةٌ صرفة (مسارٌ وصندوقُ
 * جسدٍ وعددُ أجزائه)، فتُنقَل بلا خسارة.
 *
 * **وعلّتُها**: بناءُ ٨٩٠ كلمةً في تشغيلةٍ واحدة لا يعطي نبضاً حتى يتمّ، فإن جاوز
 * مهلتَه ضاع العملُ كلُّه (وقع مرّتين، ٦٠٠ث و٢٧٠٠ث). فصارت دفعاتٍ: **كلُّ دفعةٍ
 * تكتب جزأها وتطبع نبضَها**، والملفُّ النهائيّ يُجمَّع من الأجزاء — وعهدُ «لا وحدةَ
 * ناقصة» يبقى على الملفّ النهائيّ حيث كان.
 */
/**
 * ————— 📐 **دفعةُ القياس**: خيالُ الكلمة يُقاس ولا يُؤلَّف منه مسار (جلسة ك١) —————
 *
 * **علّتُها أمرُ المالك** (١٩ أغسطس ٢٠٢٦): «اجعل الكلَّ نابعاً من الحروف التي
 * اعتمدناها، ولا كلماتٍ من حروفٍ قديمة». وكان تأليفُ الكلمة يُنزِّل **قانونيَّ
 * المتصفّح** (الخيالَ خالصاً) على جسد الكلمة — فبقيت الكلماتُ على حروفٍ سبقت
 * طبقةَ المالك (ص٦) وطبقةَ السطر (ص٢). **والحرفُ اليومَ في `paths.js` بعينه**،
 * فلا يُبنى من جديد ولا يُشتقّ: **تُقاس من الخيال المواضعُ وحدَها** — أين يجلس
 * كلُّ حرفٍ من الكلمة وأين علامتُه — **ويُركَّب المسارُ في `tools/word_layer.py`
 * من `paths.js` نفسِه**.
 *
 * ⇐ **فما يخرج من هنا قياسٌ لا مسار**: صناديقُ الأجساد والعلامات وخطُّ الأساس.
 */
function boxOut(b) {
  return b && { x0: round1(b.x0), y0: round1(b.y0), x1: round1(b.x1), y1: round1(b.y1),
    w: round1(b.w), h: round1(b.h), cx: round1(b.cx), cy: round1(b.cy) };
}

function measureWord(st) {
  return {
    line: round1(st.line),
    sheet: st.cal.box,
    units: st.units.map((unit) => ({
      text: unit.text,
      form: unit.form,
      kind: unit.kind,
      wordEnd: !!unit.wordEnd,
      box: boxOut(unit.body.box),
      extras: unit.extras.map((b) => boxOut(b.box)),
      marks: unitMarks(unit, st.chars).map((m) => ({ mark: m.mark, box: boxOut(groupBox(m.blobs)) })),
    })),
  };
}

/** قانونيّاتُ العلامات — تُبنى مرّةً في أوّل دفعةٍ وتُقيَّد لتقرأها طبقةُ التركيب. */
async function markLibrary(spec, texts) {
  const needed = [...new Set(texts.flatMap((t) => [...t].filter((c) => HARAKA.test(c))))];
  const out = {};
  for (const mark of needed) {
    if (!spec.marks?.[mark]?.strokes?.length) {
      throw new Error(`العلامة «${mark}» تلزم الكلماتِ ولا إيماءةَ لها في \`marks\``);
    }
    const cm = await markCanonical(mark, spec.marks[mark]);
    out[mark] = {
      box: boxOut(cm.box),
      strokes: cm.strokes.map((s) => ({ points: s.points, folds: s.folds || [] })),
      glyph: cm.glyph,
    };
  }
  return out;
}

/**
 * **قطعُ الوحدة ونقاطُها من قناعها** — قاعدةٌ واحدة تخدم العيّنةَ والبناء (بند ك٢)،
 * فلا تُكتب مرّتين ولا تفترقان يومَ تُصحَّح إحداهما.
 *
 * `em` **جسمُ الحرف بوحدات اللوح الجاري** (مقاسُ الخطّ الذي رُسم به) — **والنقطةُ
 * تُعرَف بامتدادها نسبةً إليه لا بعتبةٍ مطلقة** (عيبُ ليلة العيّنة الثاني، وشاهدٌ
 * لقاعدة «الحدُّ العامل لا الثابتُ المكتوب»): أقصرُ ضربةٍ حقيقية تجاوز ثلثَ الجسم
 * والنقطةُ دونه — والقاعدةُ لا تُمَسّ.
 *
 * **والترتيبُ كتابيٌّ أوّليّ** (بند ك٢/٢ — وإيماءاتُ الكيفية بندٌ لاحق لا يدخل هنا):
 * الأجسامُ من أيمنِها (فالعربيةُ تُكتب يمنةً)، وكلُّ قطعةٍ تبدأ من أيمنِ طرفيها
 * فإن استويا فمن أعلاهما، وقطعُ الجسم الواحد على مبادئها كذلك. **ورفعُ القلم**
 * يُعلَن في `lift` على قاعدة المالك المحصورة: مبدأُ جسمٍ جديد رفعٌ (وهو ما يقع بعد
 * غير الموصول: ا د ذ ر ز و)، وما اتّصل حبرُه فالقلمُ فيه ماضٍ.
 */
function skelOf(mask, em, wantInk = false, tall = 0.3, wide = 0.6) {
  const parts = bodies(mask);
  const keep = parts.filter((b) => b.area >= DUST);
  const emCells = em / PX;
  const bbox = (b) => {
    let x0 = MASK_W;
    let x1 = 0;
    let y0 = MASK_H;
    let y1 = 0;
    for (const c of b.cells) {
      const cx = c % MASK_W;
      const cy = (c - cx) / MASK_W;
      if (cx < x0) x0 = cx;
      if (cx > x1) x1 = cx;
      if (cy < y0) y0 = cy;
      if (cy > y1) y1 = cy;
    }
    return { x0, x1, y0, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  };
  const isDot = (b) => {
    const { w, h } = bbox(b);
    return h < emCells * tall && w < emCells * wide;
  };
  // والنقطةُ تُعاد قطعَ ناظرٍ صادقة: مركزٌ ونصفا قطرٍ من صندوقها — فالمزدوجة
  // الملتحمة تظهر بيضيّةً كما هي في الحبر، لا دائرةً منتفخةً تكذب.
  const dots = keep.filter(isDot).map((b) => {
    const { w, h } = bbox(b);
    return [b.at[0] * PX, b.at[1] * PX, (w / 2) * PX, (h / 2) * PX];
  });
  const big = keep.filter((b) => !isDot(b));
  big.sort((a, b) => bbox(b).x1 - bbox(a).x1);
  const pieces = [];
  // **وصندوقُ كلِّ جسمٍ يُعلَن**: به تُقاس فرجةُ النقطة في فضاء الحكم نفسِه (حبراً
  // لا هيكلاً)، فلا يُقارَن مقيسان في فضاءين — وبه يعرف من بعدَنا أين يجلس الجسم.
  const boxes = big.map((b) => {
    const k = bbox(b);
    return [k.x0 * PX, k.y0 * PX, (k.x1 + 1) * PX, (k.y1 + 1) * PX];
  });
  big.forEach((b, bi) => {
    const g = skeletonGraph(thin(maskOf(b.cells)));
    const edges = g.edges.map((e) => e.chain.map((q) => {
      const [qx, qy] = pxAt(q);
      return [qx * PX, qy * PX];
    }));
    for (const e of edges) {
      const head = e[0];
      const tail = e[e.length - 1];
      if (tail[0] > head[0] + PX || (Math.abs(tail[0] - head[0]) <= PX && tail[1] < head[1])) {
        e.reverse();
      }
    }
    edges.sort((p, q) => (q[0][0] - p[0][0]) || (p[0][1] - q[0][1]));
    edges.forEach((pts, i) => pieces.push({ pts, body: bi, lift: i === 0 }));
  });
  let ink;
  if (wantInk) {
    ink = [];
    for (const b of keep) {
      for (let i = 0; i < b.cells.length; i += 4) {
        const c = b.cells[i];
        const cx = c % MASK_W;
        ink.push([cx * PX, ((c - cx) / MASK_W) * PX]);
      }
    }
  }
  return { pieces, dots, bodies: big.length, boxes, ink };
}

/**
 * 🔬 **عيّنةُ «كلُّ شيءٍ من الفونت»** (قرار المالك الناسخ، ٢٤ أغسطس ٢٠٢٦:
 * «كل ما هو مكتوب كله بلا استثناء من الفونت»): تُصاغ المادّةُ — حرفاً بموضعه
 * أو كلمةً كاملة — بالمُشكِّل وتُنحَّف هيكلاً، وتُعاد قطعُها ونقاطُها خاماً
 * للمعاينة بعين المالك. **وهي عيّانُ اليد** — والبناءُ التامّ في `runFontSkel`.
 */
async function runSkelSet() {
  const items = JSON.parse(qs.get('items') || '[]');
  for (const it of items) {
    try {
      let mask;
      let sizeUsed = 0;
      if (it.f) {
        mask = ghost(it.t, it.f).mask;
      } else {
        setSheet(GRID);
        shaper(200);
        const w = sctx.measureText(it.t).width || 1;
        const size = Math.min(200 * (GRID * 0.86) / w, GRID * 0.6);
        sizeUsed = size;
        sctx.clearRect(0, 0, GRID, GRID);
        shaper(size);
        const tw = sctx.measureText(it.t).width;
        sctx.fillText(it.t, (GRID - tw) / 2, GRID * 0.62);
        const data = sctx.getImageData(0, 0, GRID, GRID).data;
        mask = new Uint8Array(MASK * MASK);
        for (let y = 0; y < MASK; y++) {
          for (let x2 = 0; x2 < MASK; x2++) {
            let on = 0;
            for (let dy = 0; dy < PX; dy++) {
              for (let dx = 0; dx < PX; dx++) {
                if (data[(((y * PX + dy) * GRID) + (x2 * PX + dx)) * 4 + 3] > 128) on++;
              }
            }
            mask[y * MASK + x2] = on * 2 >= PX * PX ? 1 : 0;
          }
        }
      }
      const got = skelOf(mask, it.f ? MASK * 0.6 * PX : sizeUsed, !!qs.get('ink'));
      const name = it.f ? it.t + '/' + it.f : it.t;
      results.push({ ok: true, msg: `skel ${name}: قطع ${got.pieces.length} نقاط ${got.dots.length}`,
        skel: { name, pieces: got.pieces.map((p) => p.pts), dots: got.dots,
          ...(got.ink ? { ink: got.ink } : {}) } });
    } catch (err) {
      results.push({ ok: false, msg: `skel ${it.t}: ${err.message}` });
    }
  }
  await send();
}

/**
 * 🏗 **مولّدُ الهياكل من الفونت للمادّة كلِّها** (بند ك٢ — تعميمُ مرسوم ٢٤ أغسطس).
 *
 * كلُّ وحدةٍ — حرفاً بموضعه بالوصلة، أو كلمةً، أو جملةً — **تُشكَّل نصاً كاملاً
 * دفعةً واحدة** بمحرّك الخطّ ثم يُستخرج هيكلُها: **لا تركيبَ حرفٍ إلى حرفٍ**.
 *
 * **والمقياسُ واحدٌ للمادّة كلِّها** (أمرُ المالك المنتهي في النسبة): يُرسَم كلُّ
 * وحدةٍ بأكبرِ مقاسٍ يسعه لوحُها — **دقّةُ تتبّعٍ لا حكمُ نِسَب**، وهي عينُ حجّة
 * `line_layer.py` — ثم تُردُّ إحداثياتُها إلى **فضاءٍ واحد**: جسمُ الحرف فيه
 * `EM_OUT`، وخطُّ الأساس صفرٌ، ومبدأُ السينِ حافّةُ الحبر اليمنى (فالوحداتُ
 * تجلس على سطرٍ واحد ويُقاس بعضُها ببعض). **فلا وحدةٌ تُكبَّر لتملأ خليّتَها.**
 *
 * وقائمةُ الدفعة تُخدَم ملفّاً (`/__font_items.json`) لا في العنوان — كما تُخدَم
 * قانونيّاتُ دفعة الكلمات، فلا يُحمَّل عنوانٌ بمادّةِ جملةٍ كاملة.
 */
const EM_OUT = GRID;

/**
 * **وحدُّ النقطة يُطلَب من المادّة لا من ثابتٍ مكتوب** (قاعدةُ «الحدّ العامل»):
 * القاعدةُ بحالها — **النقطةُ تُعرَف بامتدادها نسبةً لجسم الحرف** — وإنّما تبدّل
 * **مرجعُها**: في عيّان اليد الجسمُ خيالٌ يملأ خليّتَه، وهنا الجسمُ **جسمُ الخطّ
 * نفسِه** (`em`) لأنّ المادّةَ كلَّها على مقياسٍ واحد.
 *
 * **والرقمُ قِيس على المادّة كلِّها مرّتين**: أوّلاً بمسبار `?raw=1` (بلا تمييزٍ
 * أصلاً) فوُضع على ٠٫٢، **ثمّ أمسك الحارسُ نفسُه أنّ الفرجة عندها ٠٫٠٠١ لا أكثر**:
 * **شولةُ الكاف** ٠٫٢٠١ وأعلى «نقطةٍ» ٠٫١٩٩ — **وهما شيءٌ واحد**: الشولةُ عينُها
 * خرجت جسماً في `ك/معزول` ونقطةً في «الظلام الحالك في كهف الجبل»، **فحُكم على
 * الشيء الواحد بحكمين**. ⇐ **والنقاطُ الصادقةُ كلُّها دون ٠٫١٤٢**، فالفرجةُ
 * الحقيقية ٠٫١٤٢ ← ٠٫٢٠١ **والحدُّ منتصفُها** — وبه تبقى شولةُ الكاف ضربةً في
 * كل موضع (وهي إحدى رفعتَي القلم المسمّاتين في `CLAUDE.md`).
 * **والعرضُ يبقى واسعاً** فلا تُطرَد المزدوجةُ الملتحمة.
 */
const DOT_TALL = 0.17;
const DOT_WIDE = 0.6;

async function runFontSkel() {
  await inlineFont(FONT_SRC);
  const items = await (await fetch('/__font_items.json')).json();
  for (const it of items) {
    const name = it.form ? `${it.text}/${it.form}` : it.text;
    try {
      const text = it.form ? SHAPE[it.form](it.text) : it.text;
      // **حارسُ العلامات**: المادّةُ تُحصَد نصاً مجرَّداً — «لا تشكيل في كل تطبيق
      // اكتب»، وقد تسرّبت الحركاتُ إلى العيّنة الأولى فظهرت السكونُ حلقةً.
      if (HARAKA.test(text)) throw new Error('نصٌّ مشكولٌ — والحصادُ مجرَّد');
      if (text.includes('ـ')) throw new Error('نصٌّ فيه تطويل — ولا يُدَسّ في الحصاد');
      setSheet(GRID);
      const probe = maskBox(imageMask(await svgPaint(text, 100, GRID / 2, GRID / 2)));
      if (!probe) throw new Error('لا حبرَ في المسبار');
      const scale = Math.min((SHEET_MAX - 2 * MARGIN) / probe.w, (GRID - 2 * MARGIN) / probe.h);
      const size = 100 * scale;
      setSheet(probe.w * scale + 2 * MARGIN);
      const baseline = MARGIN + (GRID / 2 - probe.y0) * scale;
      const anchor = SHEET_W / 2 - (probe.cx - GRID / 2) * scale;
      const mask = imageMask(await svgPaint(text, size, anchor, baseline));
      const box = maskBox(mask);
      if (!box) throw new Error('لا حبرَ في الرسم');
      // `?raw=1` مسبارُ معايرة: بلا تمييز نقطةٍ — تخرج الأجرامُ كلُّها أجساماً
      const got = skelOf(mask, qs.has('raw') ? 0 : size, false, DOT_TALL, DOT_WIDE);
      if (!got.bodies) throw new Error('لا جسمَ — كلُّ حبرها نقاط');
      // إلى الفضاء الواحد: `EM_OUT` جسماً، وصفرٌ أساساً، وحافّةُ الحبر اليمنى مبدأً
      const k = EM_OUT / size;
      const at = (p) => [round1((p[0] - box.x1) * k), round1((p[1] - baseline) * k)];
      const pieces = got.pieces.map((piece) => ({
        p: resample(piece.pts.map(at), 1), body: piece.body, lift: piece.lift,
      }));
      const dots = got.dots.map((d) => [...at([d[0], d[1]]), round1(d[2] * k), round1(d[3] * k)]);
      // **ولام-ألفٍ تُسأل عن نفسها بالقياس**: أضيقُ من «لـا» ⇐ المُشكِّلُ صهرها
      // رسماً واحداً كما يجب، وأوسعُ أو مثلُها ⇐ خرجت «لـا» وهو ممنوعٌ قطعاً.
      let lig = null;
      if (text.includes('لا')) {
        shaper(100);
        lig = sctx.measureText(text).width
          < sctx.measureText(text.replace(/لا/g, 'لـا')).width - 0.5;
      }
      results.push({
        ok: true,
        msg: `${name}: أجسام ${got.bodies} · قطع ${pieces.length} · نقاط ${dots.length}`,
        unit: {
          name, text: it.text, form: it.form || null, kind: it.kind,
          em: EM_OUT, size: round1(size), bodies: got.bodies, lig,
          box: [round1((box.x0 - box.x1) * k), round1((box.y0 - baseline) * k),
            0, round1((box.y1 - baseline) * k)],
          bboxes: got.boxes.map((b) => [...at([b[0], b[1]]), ...at([b[2], b[3]])]),
          pieces, dots,
        },
      });
    } catch (err) {
      results.push({ ok: false, msg: `${name}: ${err.message}`, fell: { name, why: err.message } });
    }
  }
  await send();
}

async function runWordMeasure() {
  const spec = await anchors();
  const cur = await import('/js/curriculum.js');
  JOINS_AFTER = {};
  for (const [ch, info] of Object.entries(cur.LETTERS)) JOINS_AFTER[ch] = !!info.joins;
  for (const [ch, info] of Object.entries(cur.VARIANTS)) JOINS_AFTER[ch] = !!info.joins;
  await inlineFont(FONT_SRC);
  const list = workListOf(cur);
  const from = Number(qs.get('from') || 0);
  const to = Number(qs.get('to') || 0) || list.length;
  const shapes = {};
  const failed = [];
  for (const item of list.slice(from, to)) {
    try {
      shapes[item.text] = { ...measureWord(await wordStudio(item.text)), kind: item.kind };
    } catch (e) {
      failed.push({ kind: item.kind, text: item.text, why: `«${item.text}»: ${e.message}` });
    }
  }
  const extra = {};
  if (from === 0) {
    // **المتغيّراتُ ولام-ألف قانونيّاتٌ لا حروفَ في `paths.js`** — تبقى على الخيال
    // بعلّتها المعلَنة (ليست من حروف اقرأ الثمانية والعشرين فلا طبقةَ مالكٍ لها
    // ولا صفَّ في المرجع)، **ويُقيَّد ذلك في نسب الوحدة** فلا يُظَنّ أنها منه.
    const canon = {};
    for (const group of ['variants', 'ligatures']) {
      if (spec[group]) buildAll({ letters: spec[group] }, canon);
    }
    extra.canon = canon;
    extra.marks = await markLibrary(spec, list.map((i) => i.text));
    extra.joins = JOINS_AFTER;
    extra.total = list.length;
  }
  say(true, `دفعةُ القياس [${from}–${to}] من ${list.length}:`
    + ` قِيست ${Object.keys(shapes).length} · تعذّرت ${failed.length}`, {
    measure: { from, to, total: list.length, shapes, failed, ...extra },
  });
  await send();
}

async function runWordChunk() {
  const spec = await anchors();
  const canon = await (await fetch('/__canon.json')).json();
  const reuse = await fetch('/__reuse.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  const from = Number(qs.get('from') || 0);
  const to = Number(qs.get('to') || 0) || undefined;
  await inlineFont(FONT_SRC);
  const built = await buildWords(spec, canon, { from, to, reuse });
  for (const fail of built.failed) say(false, `كلمةٌ لم تُبنَ — ${fail}`);
  for (const fail of [...built.failedPairs, ...built.failedSentences]) say(true, `⚠ سقط بإعلان: ${fail}`);
  say(true, `دفعةُ الكلمات [${built.from}–${built.to}] من ${built.total}:`
    + ` بُنيت ${Object.keys(built.words).length - built.reused}`
    + ` · نُسخت بلا بناء ${built.reused}`
    + ` · سقطت ${built.failed.length + built.failedPairs.length + built.failedSentences.length}`, {
    chunk: {
      words: built.words, glyphs: built.glyphs, total: built.total,
      failed: built.failed, failedPairs: built.failedPairs,
      failedSentences: built.failedSentences, report: built.report, reused: built.reused,
    },
  });
  await send();
}

async function runBuild() {
  const spec = await anchors();
  // **بناءٌ محدودٌ بحروفٍ بعينها** (`only`، الجلسة ٧): تُقاس به **مرشّحاتُ الكرّاسة**
  // — جوابان لحالةٍ حركية يُبنيان ويُدخَلان على المحرّك قبل أن يحكم المالك. وهو
  // **قياسٌ لا يُكتب منه ملفّ**: السائقُ يرفض الكتابة إذا صُفّيت الحروف (وإلّا خرجت
  // وحدةٌ ناقصة)، وأشكالُ التهيئة والكلماتُ لا تُبنى معه.
  const only = qs.get('only');
  if (only) {
    spec.letters = Object.fromEntries(
      Object.entries(spec.letters).filter(([ch]) => only.includes(ch)));
  }
  try {
    const canon = {};
    const { paths, report } = buildAll(spec, canon);
    if (only) {
      say(true, `بناءٌ محدود بـ«${only}» — قياسٌ لا تُكتب منه وحدة`, {
        paths, partial: only, meta: { report, grid: GRID },
      });
      await send();
      return;
    }
    for (const line of report) {
      say(true, `${line.ch} ${FORM_AR[line.form]}: `
        + (line.sameAs ? `عينُ ${FORM_AR[line.sameAs]} — خيالاهما ببصمةٍ واحدة (${line.sig})`
          : `${line.strokes} جزءاً و${line.dots} نقطةً · عُقَدُ الخيال ${line.nodes}`
            + (line.folds ? ` · طيّاتٌ معلنة ${line.folds}` : '')
            + ` · داخلَ الحبر كلُّه (أدنى غوص ${line.depth}) · بصمة ${line.sig}`));
    }
    // **وأشكالُ التهيئة تُبنى مع الحروف في التشغيلة نفسِها** (§٧ب): اتجاهُ دورانها
    // مقروءٌ من حلقة الميم المؤلَّفة الآن — فلا تُبنى على مسارٍ قديمٍ لها على القرص.
    const warm = buildWarmups(paths);
    for (const line of warm.report) {
      say(true, `تهيئة ${line.id}: ${line.strokes} جزءاً · معكوسُه يُرَدّ «${line.reversed}»`
        + (line.tolerance ? ` · سماحةُ محطتها ×${line.tolerance}` : ''));
    }
    say(true, `دورانُ دوائر التهيئة من حلقة م المعزولة: ${
      warm.spin > 0 ? 'مع عقارب الساعة' : 'عكسَ عقارب الساعة'}`);

    // ————— الكلماتُ (الجلسة ٨): المتغيّراتُ ولام-ألف قانونيّاتٌ، ثم النسخُ كلُّه —————
    //
    // المتغيّراتُ (ء ة أ إ) **تُؤلَّف عند أول كلمةٍ تحملها** — وكلماتُها في المنهج
    // اليوم، فتُبنى هنا قانونيّاتٍ ولا تُكتب في `paths.js` (ليست من حروف اقرأ الثمانية
    // والعشرين): موضعُها الكلماتُ التي تحملها في `word_paths.js`.
    await inlineFont(FONT_SRC);
    for (const [group, name] of [['variants', 'متغيّر'], ['ligatures', 'لام-ألف']]) {
      if (!spec[group]) continue;
      const groupReport = buildAll({ letters: spec[group] }, canon).report;
      for (const line of groupReport) {
        say(true, `${name} ${line.ch} ${FORM_AR[line.form]}: `
          + (line.sameAs ? `عينُ ${FORM_AR[line.sameAs]} (${line.sig})`
            : `${line.strokes} جزءاً و${line.dots} نقطةً · عُقَد ${line.nodes} · غوص ${line.depth}`));
      }
    }
    // 🧩 **دفعةُ الحروف تقف هنا**: الحروفُ وأشكالُ التهيئة والقانونيّاتُ (ومنها
    // المتغيّراتُ ولام-ألف) — وترسل القانونيّاتِ ليقرأها كلُّ دفعةِ كلماتٍ بعدها،
    // ومعها **طولُ قائمة العمل** فيقسّمها السائقُ دفعاتٍ بلا قائمةٍ ثانيةٍ تفترق عنها.
    if (qs.get('part') === 'letters') {
      const cur = await import('/js/curriculum.js');
      const list = workListOf(cur);
      say(true, `جزءُ الحروف تمّ — قانونيّاتٌ ${Object.keys(canon).length}`
        + ` · وقائمةُ عمل الكلمات ${list.length}`, {
        paths, warmups: warm.warmups, canon, wordItems: list.length,
        meta: { report, grid: GRID, spin: warm.spin, warmups: warm.report },
      });
      await send();
      return;
    }
    const built = await buildWords(spec, canon);
    for (const line of built.report) {
      const joins = line.joins.map((j) => (j.cut ? `${j.at}✂${j.gap}` : `${j.at}~${j.gap}`)).join(' ');
      say(true, `كلمة «${line.text}»: ${line.strokes} قطعةً و${line.dots} نقطةً`
        + ` · وصلُها [${joins}] · مقياسُ حروفها ×${line.scale}`
        + ` · فرقُ المقياسين ≤${(line.skew * 100).toFixed(0)}٪`
        + ` · غوص ${line.depth}`
        + (line.stray.length ? ` · ⚠ خارجَ حبر حرفه: ${line.stray.join(' ')}` : '')
        + (line.dropped.length ? ` · ⚠ ${line.dropped.join(' · ')}` : ''));
    }
    for (const fail of built.failedPairs) say(true, `⚠ سطرُ مسافةٍ سقط بإعلان: ${fail}`);
    for (const fail of built.failedSentences) say(true, `⚠ جملةٌ سقطت بإعلان: ${fail}`);
    for (const fail of built.failed) say(false, `كلمةٌ لم تُبنَ — ${fail}`);
    say(true, `الكلماتُ المؤلَّفة: ${Object.keys(built.words).length}`
      + ` (وصلات ${built.counts.joins} · كلمات ${built.counts.words}`
      + ` · أسطرُ مسافة ${built.counts.pairs - built.failedPairs.length}/${built.counts.pairs}`
      + ` · جمل ${built.counts.sentences - built.failedSentences.length}/${built.counts.sentences})`);
    if (built.failed.length) {
      say(false, `${built.failed.length} كلمةً لم تُبنَ — لا تُكتب وحدةٌ ناقصة`, { failRefs: built.failRefs });
      await send();
      return;
    }

    say(true, 'تمّ البناء', {
      // **وما سقط يُبلَّغ به المنهجَ لا سجلَّ الشاشة وحدَه** (جلسةُ التوسعة): جملةٌ
      // لا يؤلَّف لها خيالٌ **تبقى في المنهج** فيحمرّ `check_paths` عليها كلَّ مرّة.
      // فتخرج الساقطاتُ من هنا بأسمائها وعللها، ويقرؤها مولّدُ المنهج فيُسقطها من
      // مادّته بإعلان — **دورةٌ مغلقة بلا قائمةٍ تُكتب بيد**.
      dropped: [
        ...built.failedSentences.map((why) => ({ kind: 'sentence', why })),
        ...built.failedPairs.map((why) => ({ kind: 'pair', why })),
      ],
      paths,
      warmups: warm.warmups,
      words: built.words,
      markGlyphs: built.glyphs,
      meta: {
        report, grid: GRID, spin: warm.spin, warmups: warm.report,
        words: built.report, failedPairs: built.failedPairs,
        failedSentences: built.failedSentences, wordCounts: built.counts,
      },
    });
  } catch (e) {
    say(false, `تعذّر البناء: ${e.message}`);
  }
  await send();
}

async function runNodes() {
  const spec = await anchors();
  // جردُ المتغيّرات ولام-ألف مع الحروف (قانونيّاتُ الكلمة تُؤلَّف بالأداة نفسِها)،
  // وجردُ عُقَد العلامات في ذيله — منها تُؤلَّف إيماءاتُ الحركات (منظومة حكم ٥).
  const everything = { letters: { ...spec.letters, ...(spec.variants || {}), ...(spec.ligatures || {}) } };
  const list = allForms(everything);
  const table = {};
  if (spec.marks) {
    await inlineFont(FONT_SRC);
    for (const mark of Object.keys(spec.marks)) {
      try {
        const cm = await markCanonical(mark, null);
        table[`mark/${mark}`] = {
          aspect: round1(cm.aspect * 100) / 100,
          nodes: cm.work.graph.nodes.map((n) => ({ id: n.id, at: n.at.map(round1), deg: n.deg })),
          edges: cm.work.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
        };
        say(true, `علامة «${mark}»: ${cm.work.graph.nodes.length} عقدةً و${cm.work.graph.edges.length} حافّة`);
      } catch (e) {
        say(false, `علامة «${mark}»: ${e.message}`);
      }
    }
  }
  for (const { ch, form } of list) {
    try {
      const work = studio(ch, form);
      table[`${ch}/${form}`] = {
        sig: work.sig,
        ink: work.cal.ink,
        dots: work.dots,
        nodes: work.graph.nodes.map((n) => ({
          id: n.id, at: n.at.map(round1), deg: n.deg,
          width: round1(work.dt[n.px] * PX * 2),
        })),
        // **وعُقَدُ العلامات تُجرَد كعُقَد الجسم** — منها تُؤلَّف إيماءةُ الشولة
        marks: work.markWork.map((one) => ({
          nodes: one.graph.nodes.map((n) => ({ id: n.id, at: n.at.map(round1), deg: n.deg })),
          edges: one.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
        })),
        edges: work.graph.edges.map((e) => ({ a: e.a, b: e.b, len: round1(chainLen(e.chain)) })),
      };
      say(true, `${ch} ${FORM_AR[form]}: ${work.graph.nodes.length} عقدةً و${work.graph.edges.length} حافّة`);
    } catch (e) {
      say(false, `${ch} ${FORM_AR[form]}: ${e.message}`);
    }
  }
  say(true, 'جردُ العُقَد', { table });
  await send();
}

/** لوحةُ مراجعةٍ بالعين: خيالٌ وهيكلٌ ومسارٌ مؤلَّف لكل شكل — تُلتقط صورةً. */
async function runSheet() {
  const spec = await anchors();
  // اللوحةُ تعرض الأشكالَ الأربعة لكل حرفٍ دائماً — وما لم تُؤلَّف إيماءتُه بعدُ
  // يُعرَض خيالُه وهيكلُه وعُقَدُه وحدَها، فهي لوحةُ التأليف كما هي لوحةُ المراجعة.
  //
  // **و`only` مِصفاةُ حروفٍ للتأليف** (الجلسة ٦): لوحةُ الـ٢٨ كاملةً تُسلَّم للعين،
  // لكنّ المؤلِّفَ يقرأ أرقامَ العُقَد وهو يؤلّف مجموعةً مجموعة — وأرقامٌ تصغر تحت
  // التصغير لا تُقرأ. والنافذةُ تتبع العددَ في الحالين (يحسبها السائق).
  // **و`pick` صفُّ أشكالٍ بأعيانها** (`ch/form`، الجلسة ٧): لوحةُ **مرشّحات الكرّاسة**
  // تعرض الحالةَ الحركية الواحدة في جوابيها، فتُنتقى أشكالُها بأعيانها لا حروفُها —
  // ولا يُعرَض معها ما لا شأنَ له بالسؤال المعروض على المالك.
  const only = qs.get('only');
  const pick = qs.get('pick');
  const list = pick
    ? pick.split(',').map((one) => one.split('/')).map(([ch, form]) => ({ ch, form }))
    : allForms(spec).filter(({ ch }) => !only || only.includes(ch));
  const board = document.createElement('div');
  board.id = 'sheet';
  // **ولوحةُ المرشّحات تضيق بأشكالها**: أربعةُ أعمدةٍ لصفٍّ من شكلين تترك نصفَ
  // الصورة فارغاً وتصغّر ما يُراد أن يُقرأ بالعين. فالأعمدةُ أقلُّ العددين، والسائقُ
  // يحسب النافذةَ بالعدد نفسِه (`sheet_window`) فلا يفترق الرقمان.
  if (list.length < 4) board.style.gridTemplateColumns = `repeat(${list.length}, 1fr)`;
  document.body.replaceChildren(board);
  const showNodes = qs.get('tags') !== '0';
  for (const { ch, form } of list) {
    const cell = document.createElement('figure');
    cell.className = 'cell';
    try {
      const work = studio(ch, form);
      const entry = spec.letters[ch][form];
      const gesture = entry?.sameAs ? spec.letters[ch][entry.sameAs] : entry;
      const src = entry?.sameAs ? studio(ch, entry.sameAs) : work;
      const made = gesture?.strokes ? compose(src, gesture) : null;
      cell.append(ghostCanvas(work), overlay(work, made, { nodes: showNodes }));
      const cap = document.createElement('figcaption');
      cap.textContent = `${ch} · ${FORM_AR[form]}`;
      cell.append(cap);
    } catch (e) {
      cell.textContent = `${ch} ${form}: ${e.message}`;
    }
    board.append(cell);
  }
  // **والبترُ يُقال ولا يُخفى** (مراجعةُ الجلسة ٥: نافذةٌ مكتوبةٌ بيد بترت لوحةَ
  // الـ٤٨ صامتةً، **وشاهدُ العين الناقصُ شاهدٌ كاذب**): اللوحةُ تقيس نفسَها في
  // النافذة التي فُتحت لها، فإن جاوزتها **احمرّ التشغيلُ من نفسه** ولم تُسلَّم صورةٌ
  // ناقصة على أنها تامّة. والسائقُ يحسب النافذةَ من عدد الصفوف — وهذا الحارسُ يقول
  // إن أخطأ الحساب.
  await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
  const need = document.documentElement.scrollHeight;
  const have = innerHeight;
  const cols = getComputedStyle(board).gridTemplateColumns.split(' ').length;
  const rows = Math.ceil(list.length / cols);
  say(need <= have + 1, `لوحةُ المراجعة: ${list.length} شكلاً في ${rows} صفاً`
    + (need <= have + 1 ? ` — كلُّها في النافذة (${need} ≤ ${have})`
      : ` — **النافذةُ تبتُر**: اللوحةُ ${need} بكسلاً والنافذةُ ${have}`));
  await send();
}

// ————— ١٠) العدّةُ لليد: نقرُ العُقَد ترتيباً واتجاهاً —————

async function runStudio() {
  const spec = await anchors().catch(() => ({ letters: {} }));
  const letters = Object.keys(spec.letters);
  document.body.innerHTML = `
    <aside>
      <h1>عدّةُ تأليف المسارات</h1>
      <p class="note">انقر عُقَدَ الحرف بترتيب كتابته — من أين يبدأ القلم، وإلى أين
        يمضي. الشكلُ يخرج من خيال الحرف نفسِه، وإيماءتُك ترتيبٌ واتجاهٌ لا إحداثيات.</p>
      <div class="row">
        <input id="ch" size="2" value="${letters[0] || 'ب'}">
        <select id="form">${FORMS.map((f) => `<option value="${f}">${FORM_AR[f]}</option>`).join('')}</select>
        <button id="reload">اقرأ الخيال</button>
      </div>
      <div class="row">
        <button id="newStroke">جزءٌ جديد</button>
        <button id="undo">تراجع</button>
        <button id="clear">امسح</button>
        <button id="play">شاهِد</button>
      </div>
      <div id="gesture"></div>
      <p class="note" id="verdict"></p>
      <div class="row"><button id="copy">انسخ الإيماءة</button><button id="copyJson">انسخ JSON</button></div>
      <div id="preview"></div>
    </aside>
    <div id="stage"></div>`;

  const stage = document.getElementById('stage');
  const out = document.getElementById('gesture');
  const verdict = document.getElementById('verdict');
  let work = null;
  let strokes = [[]];
  let surface = null;


  function draw() {
    const gesture = { strokes: strokes.filter((s) => s.length) };
    let made = null;
    try { made = gesture.strokes.length ? compose(work, gesture) : null; } catch (e) { verdict.textContent = e.message; }
    stage.replaceChildren(ghostCanvas(work), overlay(work, made));
    for (const circle of stage.querySelectorAll('.node')) {
      const id = Number(circle.dataset.id);
      if (strokes.some((s) => s.includes(id))) circle.classList.add('pick');
      circle.addEventListener('click', () => {
        strokes[strokes.length - 1].push(id);
        draw();
      });
    }
    out.textContent = JSON.stringify({ strokes: gesture.strokes, nodes: work.graph.nodes.length, sig: work.sig });
    if (made) {
      const clean = made.strokes.map((s) => s.points);
      const wrong = made.strokes.map((s) => [...s.points].reverse());
      const dots = made.dots.map((d) => [d.at, d.at, d.at]);
      const good = judge(made, [...clean, ...dots]);
      const bad = judge(made, [...wrong, ...dots]);
      verdict.textContent = `الحكم: الصحيحُ ${good.accepted ? 'يُقبل ✓' : `يُرفَض (${good.primary}) ✗`}`
        + ` · المعكوسُ ${bad.accepted ? 'يُقبَل ✗' : `يُرفَض (${bad.primary}) ✓`}`;
      const box = document.getElementById('preview');
      surface?.destroy();
      surface = penSurface({ ref: made, label: 'معاينةُ المسار' });
      box.replaceChildren(surface.el);
    }
  }

  async function reload() {
    const ch = document.getElementById('ch').value.trim();
    const form = document.getElementById('form').value;
    work = studio(ch, form);
    const saved = spec.letters[ch]?.[form];
    strokes = saved && !saved.sameAs ? saved.strokes.map((s) => [...s]) : [[]];
    if (!strokes.length) strokes = [[]];
    draw();
  }

  document.getElementById('reload').onclick = reload;
  document.getElementById('form').onchange = reload;
  document.getElementById('newStroke').onclick = () => { strokes.push([]); draw(); };
  document.getElementById('undo').onclick = () => {
    const last = strokes[strokes.length - 1];
    if (last.length) last.pop(); else if (strokes.length > 1) strokes.pop();
    draw();
  };
  document.getElementById('clear').onclick = () => { strokes = [[]]; draw(); };
  document.getElementById('play').onclick = () => surface?.play();
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(
    JSON.stringify({ strokes: strokes.filter((s) => s.length), nodes: work.graph.nodes.length, sig: work.sig }));
  document.getElementById('copyJson').onclick = () => navigator.clipboard.writeText(
    JSON.stringify(compose(work, { strokes: strokes.filter((s) => s.length) }), null, 1));
  await reload();
}

// ————— ١١) المِرسمة: لوحُ المالك — كتابةٌ واحدةٌ تعطي الشكلَ والحركةَ معاً —————
//
// **سندُها** (بند `SESSIONS.md` ص٥، وتصريحُ المالك ١٨ أغسطس ٢٠٢٦): «سأكتب **فوق
// علامتك** بخطٍّ أوضحَ وأجمل، **واعتمد أنت شيئاً قريباً من الشكل الذي أعطيك إياه مع
// الاتجاهات». ⇐ **فلا وضعان بل نمطٌ واحد**: يكتب فوق خيالنا الخافت كما يُكتب الحرفُ
// حقاً، **فضرباتُه هي أجزاؤنا بترتيبها واتجاهها، وأثرُه هو مرجعُ الشكل**.
//
// **وتعديلُ العهد مكتوبٌ صريحاً** (`SESSIONS.md` ص٥/٤): «لا إحداثياتٌ تُكتب بيد» عهدٌ
// ضدَّ **الرقم المظنون** لا ضدَّ **المرجع المرسوم** — فنصُّه اليوم: «لا إحداثيّ إلا من
// هيكل الخيال **أو من يد المالك مرجعاً**، ويُختم بمصدره وتاريخه (`origin: owner`)».
// فما يخرج من هنا مختومٌ كذلك في `tools/owner_shapes.json`، ولا يُكتب في `paths.js` بيد.
//
// **والتطبيعُ معلَنٌ لا يبدّل الهوية** — أربعُ خطوات، ولكلٍّ سندُها:
//   ١) **تحويلُ تشابهٍ** (نقلٌ ومقياسٌ واحدٌ للمحورين): يضع أعلى أثره على **خطّ القمّة**
//      وأسفلَه على **خطّ الأساس** (مصطلحا الكرّاسة) — وهو **حفظُ الهوية بتعريفها**
//      الهندسيّ: الأشكالُ المتشابهة شكلٌ واحد. ولا تدويرَ ولا قصَّ ولا مقياسَين.
//      **وإن جاوز عرضُه صندوقَه رجع المقياسُ إلى العرض** (سنّةُ `wordFit` نفسُها).
//   ٢) **تنعيمٌ خفيف** برشّتين — رعشةُ الإصبع لا رسمُ اليد.
//   ٣) **إعادةُ أخذِ عيّناتٍ منتظمة** بـ`resample` — خطوةُ المحرّك نفسُها لا خطوةٌ ثانية.
//   ٤) **وتقريبٌ إلى عُشر وحدة الشبكة** (يفعله `resample`) — فالخرجُ على ١٠٠٠×١٠٠٠.
//
// **و«قريبٌ من رسمه» رقمٌ محروس لا رخصةُ انحراف**: يُقاس بُعدُ كلِّ نقطةٍ من أثره
// (بعد التشابه، فالتشابهُ لا يبدّل شكلاً) عن المسار المعتمَد، ويُطبع أقصاه ومتوسطُه —
// **وحدُّه سماحةُ المحرّك نفسُها** (`TOLERANCE.lateral`): ما أزاحه التطبيعُ أكثرَ ممّا
// يسمح به المحرّكُ لطفلٍ ينحرف عن نموذجه **لم يعد رسمَه**، فيُردّ ولا يُعتمَد.
// **ولا يُعتمَد إلا ما رآه بعينه**: الناتجُ يُعرض فوق أثره قبل «اعتمد».

/** كلماتُ الدَّور الثالث — يختارها المنهجُ لا الهوى (ص٥/٨): أصعبُ وصلاتنا وأطولُ موصول. */
const OWNER_WORDS = ['مِحْفَظَة', 'غُرْفَة', 'شَمْس', 'سُلَحْفَاة', 'عَنْكَبُوت'];

// ————— بابُ العلامات (`?only=marks`) — **آخرُ ما بقي من خطِّ الطباعة** —————
// الثمانيةُ المتغيّرة أجسامُها معتمَدةٌ من يد المالك في `paths.js` (أ إ آ ⇐ ا · ؤ ⇐ و
// · ئ ى ⇐ ي · ة ⇐ ه)، **والعلامةُ وحدَها تأتي من الخطّ**. فهذه خمسُ سلَعٍ تُرسَم
// كالكلمة سواءً بسواء (مسارٌ واحدٌ من خيالٍ واحد) — ولا شيفرةَ التقاطٍ جديدة.
const OWNER_MARKS = ['ء', 'أ', 'إ', 'آ', 'ة'];
const MARKS_MODE = qs.get('only') === 'marks';
/** ما شكا منه بعينه (١٨ أغسطس) — يتقدّم داخلَ دَوره لا على الطابور كلِّه. */
const COMPLAINED = ['ط', 'ظ', 'م', 'ص', 'ض'];
const DIGIT = /^[٠-٩]$/;
const JOINED = FORMS.filter((f) => f !== 'isolated');
const arNum = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d]);

/**
 * **الطابورُ محسوبٌ لا مقدَّر: ١٢٢ خانة** — ١١٢ شكلَ حرفٍ (٢٨ × أربعة مواقع) + ١٠
 * أرقامٍ مرّةً واحدة (أشكالُ الرقم الأربعة **متطابقةٌ بايتاً** فرسمُها مرّةً يسري على
 * أربعتها، ويُعلَن في الشاشة ولا يُخفى).
 *
 * **وترتيبُه ثمرةُ الكرّاسة** (`STROKE_ORDER.md §١ب`): تُبذَر المعزولاتُ الثمانيةُ
 * والعشرون منها فيُصدِّقها المالكُ سريعاً، **فيبدأ طابورُه بما لا تغطّيه**:
 * **الأرقامُ العشرة** (لا تغطّيها ألبتّة) ← **الأشكالُ الموصولة ٨٤** (لا تغطّيها) ←
 * **المعزولاتُ ٢٨ تصديقاً**. وفي كلِّ دَورٍ يتقدّم **ما شكا منه** ثم يمضي بترتيب المنهج.
 */
function ownerQueue(spec) {
  if (MARKS_MODE) {
    return OWNER_MARKS.map((text) => ({ kind: 'word', text,
      key: `علامة/${text}`, name: text }));
  }
  const keys = Object.keys(spec.letters);
  const digits = keys.filter((ch) => DIGIT.test(ch));
  const letters = keys.filter((ch) => !DIGIT.test(ch));
  const first = [...COMPLAINED.filter((ch) => letters.includes(ch)),
    ...letters.filter((ch) => !COMPLAINED.includes(ch))];
  const slot = (ch, form) => ({ kind: 'letter', ch, form, key: `${ch}/${form}`,
    name: `${ch} · ${FORM_AR[form]}` });
  return [
    ...digits.map((ch) => ({ kind: 'digit', ch, form: 'isolated', key: `${ch}/isolated`,
      name: `الرقم ${ch}`, twins: FORMS.length })),
    ...first.flatMap((ch) => JOINED.map((form) => slot(ch, form))),
    ...first.map((ch) => slot(ch, 'isolated')),
    ...OWNER_WORDS.map((text) => ({ kind: 'word', text, key: `كلمة/${text}`, name: text })),
  ];
}

// ————— إسقاطُ أثر اليد: التطبيعُ ومقياسُ القرب —————

/** صندوقُ حبرٍ من ضربات (كـ`maskBox` سواءً بسواء، لكنه من نقاطٍ لا من قناع). */
function inkBox(strokes) {
  let x0 = Infinity; let y0 = Infinity; let x1 = -Infinity; let y1 = -Infinity;
  for (const stroke of strokes) {
    for (const [x, y] of stroke) {
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  if (!Number.isFinite(x0)) return null;
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

/** بُعدُ نقطةٍ عن قطعةٍ مستقيمة — أساسُ مقياس القرب. */
function segDist(p, a, b) {
  const vx = b[0] - a[0];
  const vy = b[1] - a[1];
  const l2 = vx * vx + vy * vy;
  if (!l2) return dist(p, a);
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / l2));
  return Math.hypot(p[0] - (a[0] + t * vx), p[1] - (a[1] + t * vy));
}

/** بُعدُ نقطةٍ عن مسارٍ مكسور. */
function polyDist(p, poly) {
  if (poly.length < 2) return dist(p, poly[0] || p);
  let best = Infinity;
  for (let i = 1; i < poly.length; i++) best = Math.min(best, segDist(p, poly[i - 1], poly[i]));
  return best;
}

/**
 * **تطبيعُ أثر اليد** — الخطواتُ الأربع أعلاه، ومعها مقياسُ القرب.
 * `raw` ضرباتُ يده بترتيبها (نقاطٌ على شبكة اللوح)، و`taps` نقراتُه.
 * ويعود بالمسار المعتمَد ومعه **رقمُ القرب** الذي يفتح «اعتمد» أو يُغلقه.
 */
function normalizeInk(box, raw, taps = []) {
  const span = box.sheet[0] - 2 * MARGIN;
  const his = inkBox(raw);
  // **حرفٌ نقرةٌ لا مسار** (الصفرُ بحكم المالك): لا أثرَ يُطبَّع، والنقرةُ حيث نقر.
  if (!his) {
    return { strokes: [], dots: taps.map((p) => [round1(p[0]), round1(p[1])]),
      norm: { scale: 1, shift: [0, 0], mean: 0, max: 0, limit: TOLERANCE.lateral }, ok: !!taps.length };
  }
  // ١) تحويلُ التشابه: قمّتُه على القمّة وأساسُه على الأساس — وإن عرُض رجع إلى العرض
  const scale = Math.min(box.fit.h / (his.h || 1), span / (his.w || 1));
  const shift = [box.fit.cx - his.cx * scale, box.fit.cy - his.cy * scale];
  const put = (p) => [p[0] * scale + shift[0], p[1] * scale + shift[1]];
  const placed = raw.map((stroke) => stroke.map(put));
  // ٢ و٣ و٤) تنعيمٌ خفيف ثم عيّناتٌ منتظمة على الشبكة (خطوةُ المحرّك نفسُها)
  const strokes = placed.map((stroke) => (stroke.length > 1 ? resample(smooth(stroke, 2))
    : [[round1(stroke[0][0]), round1(stroke[0][1])]]));
  // مقياسُ القرب: كلُّ نقطةٍ من أثره **بعد التشابه** إلى المسار المعتمَد
  let sum = 0;
  let count = 0;
  let max = 0;
  for (let s = 0; s < placed.length; s++) {
    for (const p of placed[s]) {
      const d = polyDist(p, strokes[s]);
      sum += d;
      count++;
      if (d > max) max = d;
    }
  }
  const mean = count ? sum / count : 0;
  return {
    strokes,
    dots: taps.map(put).map((p) => [round1(p[0]), round1(p[1])]),
    norm: { scale: round1(scale * 100) / 100, shift: shift.map(round1),
      mean: round1(mean), max: round1(max), limit: TOLERANCE.lateral },
    ok: max <= TOLERANCE.lateral,
  };
}

/** المسارُ المعتمَد بصيغة المحرّك — ليُحكَم عليه بحكمه لا بحكمٍ ثانٍ. */
const asMade = (out) => ({
  strokes: out.strokes.filter((s) => s.length > 1).map((points) => ({ points, start: points[0] })),
  dots: out.dots.map((at) => ({ at, count: 1, after: true })),
});

// ————— لوحُ المِرسمة —————

let ANCHOR_SPEC = { letters: {} };

/**
 * **خيالُ خانةٍ** — حرفاً كان أو رقماً أو كلمة. ويُقرأ منه ساعتَه (لا بعدَه) كلُّ ما
 * تتبدّل به عوالمُ اللوح (`SHEET_W/H` تتبدّل للكلمة): صندوقُ الحبر، **وصندوقُ
 * المسار** الذي عليه تقع المحاذاة، وبصمتُه.
 *
 * **ولِمَ صندوقُ المسار لا صندوقُ الحبر؟** لأنّ أثرَ يده **خطُّ وسطٍ** كمسارنا سواءً —
 * والحبرُ أوسعُ منه بنصف عرض القلم من كلِّ جهة. فمحاذاةُ خطِّ وسطٍ إلى صندوق حبرٍ
 * تنفخ رسمَه بعرض القلم، **ومحاذاةُ مثيلٍ بمثيله** تضعه حيث يقع حقاً.
 */
async function slotGhost(item) {
  if (item.kind === 'word') {
    const cal = await wordFit(item.text);
    const image = await svgPaint(item.text, cal.size, cal.x, cal.baseline);
    const mask = imageMask(image);
    const ink = maskBox(mask);
    const sig = fingerprint(mask);
    setSheet(GRID);                     // وتُردّ عوالمُ اللوح كما كانت
    if (!ink) throw new Error(`لا حبرَ في «${item.text}»`);
    // **والكلمةُ بلا هيكلٍ مؤلَّف** (`compose` لا يمشي هيكلَ كلمة، §٧ج) — فصندوقُها
    // صندوقُ حبرها، ويُعلَن: أثرُه يقع أوسعَ من مسارنا بنصف عرض القلم.
    return { image, ink, fit: ink, sheet: cal.box, sig, base: null, top: ink.y0, made: null };
  }
  const work = studio(item.ch, item.form);
  const ink = maskBox(work.bodyMask);
  // **ورسمُنا الحاليّ يُعرض معه** (ص٥/٥: «الخيالُ خافتٌ تحت يده — رسمُنا الحالي»):
  // جهةً وترتيباً كما تفعل أسهمُ الكرّاسة المرقَّمة، فيحكم على معروضٍ لا على فراغ.
  const entry = ANCHOR_SPEC.letters[item.ch]?.[item.form];
  const gesture = entry?.sameAs ? ANCHOR_SPEC.letters[item.ch][entry.sameAs] : entry;
  const src = entry?.sameAs ? studio(item.ch, entry.sameAs) : work;
  let made = null;
  try { made = gesture ? compose(src, gesture) : null; } catch { made = null; }
  const lines = made && made.strokes.length ? made.strokes.map((s) => s.points)
    : work.graph.edges.map((e) => e.chain.map(px2grid));
  return { image: work.image, ink, fit: inkBox(lines) || ink, sheet: [GRID, GRID],
    sig: work.sig, base: work.cal.baseline, top: (inkBox(lines) || ink).y0, made };
}

async function runOwnerBoard() {
  ANCHOR_SPEC = await anchors();
  const queue = ownerQueue(ANCHOR_SPEC);
  const shapes = queue.filter((s) => s.kind !== 'word').length;
  const state = await fetch('/__done.json').then((r) => r.json()).catch(() => ({ done: [] }));
  const done = new Set(state.done || []);
  const skipped = new Set(JSON.parse(localStorage.getItem('mirsam:skip') || '[]'));

  document.body.className = 'mirsam';
  document.body.innerHTML = `
    <div id="mirsam">
      <div id="mirsam-head">
        <span id="mirsam-count"></span>
        <span id="mirsam-name"></span>
        <span id="mirsam-hint"></span>
      </div>
      <div id="mirsam-board"><div id="slate"></div></div>
      <div id="mirsam-foot">
        <button id="back">السابق</button>
        <button id="redo">أعِد</button>
        <button id="keep" class="go">اعتمد</button>
        <button id="skip">تخطَّ</button>
      </div>
    </div>
    <div id="mirsam-say"></div>`;

  const slate = document.getElementById('slate');
  const banner = document.getElementById('mirsam-say');
  const keep = document.getElementById('keep');
  const count = document.getElementById('mirsam-count');
  const name = document.getElementById('mirsam-name');
  const hint = document.getElementById('mirsam-hint');
  let at = 0;
  let box = null;                        // خيالُ الخانة الجارية
  let raw = [];                          // ضرباتُ يده بترتيبها
  let taps = [];                         // ونقراتُه
  let wet = null;                        // الضربةُ تحت إصبعه الآن
  let wetPath = null;
  let out = null;                        // الناتجُ المطبَّع المعروض
  let ink = null;                        // طبقةُ الحبر (تُحدَّث وحدَها فلا يُعاد الخيال)

  const tell = (text, bad = false) => {
    banner.textContent = text;
    banner.classList.toggle('bad', bad);
    banner.classList.add('on');
    setTimeout(() => banner.classList.remove('on'), bad ? 2800 : 1000);
  };

  /** أوّلُ خانةٍ لم تُعتمَد ولم تُتخطَّ — **استئنافٌ من حيث وقف** (ص٥/٥). */
  const resume = () => {
    const k = queue.findIndex((s) => !done.has(s.key) && !skipped.has(s.key));
    return k < 0 ? 0 : k;
  };

  /** **الخيالُ يُبنى مرّةً للخانة**: قناعٌ ١٠٠٠×١٠٠٠ يُعاد رسمُه مع كلِّ حركةِ إصبعٍ
   *  يُثقِل اللوحَ على الآيباد — فطبقةُ الخيال والسطر تُركَّب مرّةً، والحبرُ وحدَه يُعاد. */
  /** **ضلعُ اللوح محسوبٌ من الحاوية**: أكبرُ ما يسع نسبةَ الخيال فيها — فطبقتا
   *  الخيال والحبر على مقاسٍ واحد، وإسقاطُ إصبعه يقع حيث وقع. */
  function fitSlate() {
    if (!box) return null;
    const [w, h] = box.sheet;
    const room = document.getElementById('mirsam-board').getBoundingClientRect();
    const s = Math.min(room.width / w, room.height / h);
    slate.style.width = `${Math.floor(w * s)}px`;
    slate.style.height = `${Math.floor(h * s)}px`;
    return { room, side: [Math.floor(w * s), Math.floor(h * s)] };
  }

  function mount() {
    const [w, h] = box.sheet;
    fitSlate();
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(box.image, 0, 0);
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = '#f7f4ee';
    ctx.fillRect(0, 0, w, h);
    canvas.style.opacity = '.20';
    const guide = sv('svg', { viewBox: `0 0 ${w} ${h}` });
    // **سطرُ الكرّاسة ظاهر** (ص٥/١): خطُّ الأساس (سطرُ الكتابة) وخطُّ القمّة — وعليهما
    // يُحاذى أثرُه، فما يراه هو ما يقيس به التطبيع.
    if (box.base != null) guide.append(sv('line', { class: 'grid-line base', x1: 0, y1: round1(box.base), x2: w, y2: round1(box.base) }));
    if (box.top != null) guide.append(sv('line', { class: 'grid-line', x1: 0, y1: round1(box.top), x2: w, y2: round1(box.top) }));
    if (box.made) for (const stroke of box.made.strokes) guide.append(sv('path', { class: 'skel', d: pathD(stroke.points) }));
    ink = sv('svg', { viewBox: `0 0 ${w} ${h}` });
    slate.replaceChildren(canvas, guide, ink);
    // **ونصيبُ اللوح من المنظور يُقاس ويُقال** — لا يوصَف: بلاغُ المالك في صفحة
    // التجربة («مربّعٌ في المنتصف ضيّق») لا يُردّ عليه بوصفٍ بل برقمٍ من الشاشة.
    if (qs.has('shot')) {
      const seen = slate.getBoundingClientRect();
      const share = Math.round((seen.height / innerHeight) * 100);
      const ratio = round1((seen.width / seen.height) / (w / h));
      say(share >= 60 && Math.abs(ratio - 1) < 0.02,
        `اللوحُ يملأ المنظور: ${Math.round(seen.width)}×${Math.round(seen.height)}`
        + ` من ${innerWidth}×${innerHeight} — ${share}٪ ارتفاعاً، ونسبتُه ×${ratio}`);
      // **والأزرارُ في المنظور لا تحته**: زرٌّ مقطوعٌ يُقرأ صفحةً معطّلة — وهو عينُ
      // ما شكا منه. ومقاسُ اللمس ≥٦٤ بكسل عهدُ العائلة.
      const foot = document.getElementById('mirsam-foot').getBoundingClientRect();
      const small = [...document.querySelectorAll('#mirsam-foot button')]
        .map((b) => b.getBoundingClientRect())
        .filter((r) => Math.min(r.width, r.height) < 64);
      const buttons = document.querySelectorAll('#mirsam-foot button').length;
      say(foot.bottom <= innerHeight + 1 && !small.length,
        `وأزرارُه ${arNum(buttons)} في المنظور: أسفلُها ${Math.round(foot.bottom)} من ${innerHeight}`
        + ` وأصغرُ ضلعٍ ${Math.round(Math.min(...[...document.querySelectorAll('#mirsam-foot button')]
          .map((b) => Math.min(b.getBoundingClientRect().width, b.getBoundingClientRect().height))))} بكسلاً`);
      send();
    }
  }

  /** طبقةُ الحبر: أثرُه رطباً، والناتجُ المطبَّع فوقه ببداياته وأرقامه واتجاهاته. */
  function drawInk() {
    const parts = [];
    for (const stroke of raw) if (stroke.length > 1) parts.push(sv('path', { class: 'wet', d: pathD(stroke) }));
    for (const tap of taps) parts.push(sv('circle', { class: 'wet', cx: round1(tap[0]), cy: round1(tap[1]), r: 26 }));
    if (out) {
      out.strokes.forEach((points, i) => {
        if (points.length > 1) parts.push(sv('path', { class: 'made', d: pathD(points) }));
        parts.push(sv('circle', { class: 'made-start', cx: points[0][0], cy: points[0][1], r: 30 }));
        const tag = sv('text', { class: 'made-tag', x: points[0][0], y: points[0][1] });
        tag.textContent = arNum(i + 1);
        parts.push(tag);
        const tip = points[points.length - 1];
        const from = points[Math.max(0, points.length - 4)];
        const a = Math.atan2(tip[1] - from[1], tip[0] - from[0]);
        const arm = (turn) => `${round1(tip[0] - 46 * Math.cos(a + turn))} ${round1(tip[1] - 46 * Math.sin(a + turn))}`;
        parts.push(sv('path', { class: 'made-head', d: `M${tip[0]} ${tip[1]} L${arm(0.42)} L${arm(-0.42)} Z` }));
      });
      for (const dot of out.dots) parts.push(sv('circle', { class: 'made-start', cx: dot[0], cy: dot[1], r: 22 }));
    }
    ink.replaceChildren(...parts);
    wetPath = null;
  }

  /** ورأسُ الشريط: العدّادُ والاسمُ والإرشاد — **بلا سطرِ قراءاتٍ تقنية**. */
  function label() {
    const item = queue[at];
    const bank = MARKS_MODE ? OWNER_MARKS : OWNER_WORDS;
    count.textContent = item.kind === 'word'
      ? `${MARKS_MODE ? 'علامة' : 'كلمة'} ${arNum(bank.indexOf(item.text) + 1)}`
        + ` من ${arNum(bank.length)}`
      : `${arNum(at + 1)} من ${arNum(shapes)}`;
    name.textContent = item.name;
    const near = out && out.strokes.length
      ? ` · قربُ رسمك ${arNum(Math.round(out.norm.max))} من ${arNum(out.norm.limit)}`
      : '';
    hint.textContent = (item.kind === 'digit'
      ? 'يُرسَم مرّةً — وأشكالُه الأربعة متطابقةٌ فيسري عليها'
      : item.kind === 'word'
        ? (MARKS_MODE ? 'اكتبها كما تكتبها — والعلامةُ ضربةٌ مستقلّةٌ بعد الجسم'
          : 'اكتبها موصولةً كما تكتبها — والوصلُ بيدك')
        : 'اكتبه فوق الخيال كما يُكتب — ضربةً بعد ضربة') + near;
    keep.disabled = !(out && (out.strokes.length || out.dots.length) && out.ok);
    document.getElementById('back').disabled = at === 0;
  }

  function reckon() {
    out = (raw.length || taps.length) ? normalizeInk(box, raw, taps) : null;
    if (out && !out.ok && out.strokes.length) {
      tell(`التطبيعُ أزاح رسمَك ${arNum(Math.round(out.norm.max))} وحدة`
        + ` (الحدُّ ${arNum(out.norm.limit)}) — أعِد الرسمَ أوضح`, true);
    }
    drawInk();
    label();
  }

  async function show(k) {
    at = Math.max(0, Math.min(queue.length - 1, k));
    raw = [];
    taps = [];
    wet = null;
    out = null;
    try {
      box = await slotGhost(queue[at]);
    } catch (e) {
      tell(`${queue[at].name}: ${e.message}`, true);
      return;
    }
    mount();
    drawInk();
    label();
  }

  // ————— يدُه على اللوح: كلُّ نزلةِ قلمٍ ضربة، وترتيبُها ترتيبُه واتجاهُها اتجاهُه —————
  const spot = (ev) => {
    const rect = slate.getBoundingClientRect();
    const [w, h] = box.sheet;
    return [((ev.clientX - rect.left) / rect.width) * w, ((ev.clientY - rect.top) / rect.height) * h];
  };
  slate.addEventListener('pointerdown', (ev) => {
    if (!box) return;
    ev.preventDefault();
    slate.setPointerCapture(ev.pointerId);
    wet = [spot(ev)];
    raw.push(wet);
    wetPath = sv('path', { class: 'wet', d: pathD(wet) });
    ink.append(wetPath);
  });
  slate.addEventListener('pointermove', (ev) => {
    if (!wet) return;
    const p = spot(ev);
    if (dist(p, wet[wet.length - 1]) < 2) return;
    wet.push(p);
    // **حرفٌ واحد يُحدَّث لا لوحٌ يُعاد**: خطُّ الضربة الجارية وحدَه
    if (wetPath) wetPath.setAttribute('d', pathD(wet));
  });
  const lift = () => {
    if (!wet) return;
    const stroke = wet;
    wet = null;
    raw = raw.filter((s) => s !== stroke);
    // **ما لا يبلغ نصفَ قطر قبول النقطة ليس مساراً يُقاس — بل نقرة** (`TOLERANCE.dot`):
    // فالنقاطُ نقراً كما نصّ البند، والمحرّكُ نفسُه يحكم على النقرة بمعيار النقطة.
    const len = stroke.length > 1 ? prepare(stroke).len : 0;
    if (len < TOLERANCE.dot) taps.push(stroke[0]);
    else raw.push(stroke);
    reckon();
  };
  slate.addEventListener('pointerup', lift);
  slate.addEventListener('pointercancel', lift);

  document.getElementById('redo').onclick = () => {
    raw = [];
    taps = [];
    wet = null;
    out = null;
    drawInk();
    label();
  };
