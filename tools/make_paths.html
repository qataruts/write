  // **ورجعةٌ إلى ما مضى** — زيادةٌ على الثلاثة بعلّةٍ مكتوبة: طابورٌ من ١٢٢ خانة
  // بلا رجعةٍ يجعل نقرةً واحدةً خاطئة على «اعتمد» **عطباً لا يُصلحه إلا مدير**.
  // وهي زرٌّ كبيرٌ رابع لا تبَّةٌ صغيرة، فعهدُ اللوح على حاله.
  document.getElementById('back').onclick = () => show(at - 1);
  document.getElementById('skip').onclick = () => {
    skipped.add(queue[at].key);
    localStorage.setItem('mirsam:skip', JSON.stringify([...skipped]));
    show(at + 1);
  };
  // **ولا حفظَ بلا اعتماد، ولا انتقالَ تلقائيّ** (ص٥/٥): زرُّه وحدَه يختم ويُقدّم.
  keep.onclick = async () => {
    const item = queue[at];
    keep.disabled = true;
    try {
      const res = await fetch('/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          kind: item.kind, ch: item.ch, form: item.form, text: item.text, key: item.key,
          sig: box.sig, sheet: box.sheet, strokes: out.strokes, dots: out.dots, norm: out.norm,
        }),
      }).then((r) => r.json());
      if (!res.ok) throw new Error(res.why || 'ردَّ الخادمُ رفضاً');
      (res.done || []).forEach((k) => done.add(k));
      done.add(item.key);
      tell(res.said || 'اعتُمد ✓');
      show(at + 1);
    } catch (e) {
      tell(`لم يُحفظ: ${e.message}`, true);
      keep.disabled = false;
    }
  };

  addEventListener('resize', () => { if (box) { fitSlate(); } });
  await show(resume());
}

// ————— مشهدُ الفحص: الطابورُ محسوب، والتطبيعُ لا يبدّل الهوية، والعكسُ يخرج عكساً —————

async function runOwnerCheck() {
  ANCHOR_SPEC = await anchors();
  const queue = ownerQueue(ANCHOR_SPEC);
  const shapes = queue.filter((s) => s.kind !== 'word');
  const digits = shapes.filter((s) => s.kind === 'digit');
  const joined = shapes.filter((s) => s.kind === 'letter' && s.form !== 'isolated');
  const alone = shapes.filter((s) => s.kind === 'letter' && s.form === 'isolated');
  say(shapes.length === 122 && digits.length === 10 && joined.length === 84 && alone.length === 28,
    `الطابورُ محسوبٌ لا مقدَّر: ${shapes.length} خانة`
    + ` — ${digits.length} أرقام و${joined.length} موصولاً و${alone.length} معزولاً`);
  say(queue.slice(0, digits.length).every((s) => s.kind === 'digit')
    && queue.slice(digits.length, digits.length + joined.length).every((s) => s.kind === 'letter' && s.form !== 'isolated')
    && queue.slice(digits.length + joined.length, shapes.length).every((s) => s.form === 'isolated'),
  'وترتيبُه بما لا تغطّيه الكرّاسة أوّلاً: الأرقامُ ثم الموصولةُ ثم تصديقُ المعزولات');
  say(joined.slice(0, COMPLAINED.length * JOINED.length)
    .every((s) => COMPLAINED.includes(s.ch)),
  `وما شكا منه يتقدّم في دَوره: ${COMPLAINED.join(' · ')}`);
  say(queue.filter((s) => s.kind === 'word').length === OWNER_WORDS.length,
    `ودَورُ الكلمات مفتوحٌ بـ${arNum(OWNER_WORDS.length)} كلمات`);

  // شواهدُ ثلاثة: ما شكا منه (ط) · وموصولٌ (م/وسطي) · ورقمٌ (٣)
  for (const [ch, form] of [['ط', 'isolated'], ['م', 'medial'], ['٣', 'isolated']]) {
    const box = await slotGhost({ kind: 'letter', ch, form });
    const tag = `${ch}/${FORM_AR[form]}`;
    if (!box.made) { say(false, `${tag}: لا رسمَ حالياً يُعرض تحت يده`); continue; }
    const ref = box.made.strokes.map((s) => s.points);
    // ١) التطبيعُ لا يبدّل الهوية: ما أزاحه دون سماحة المحرّك نفسِها
    const fwd = normalizeInk(box, ref);
    say(fwd.ok, `${tag}: التطبيعُ لا يبدّل الهوية — أقصى إزاحةٍ ${fwd.norm.max}`
      + ` (الحدُّ ${TOLERANCE.lateral}) ومتوسطُها ${fwd.norm.mean} · مقياسُه ×${fwd.norm.scale}`);
    // ٢) **سالباً**: رسمةٌ عكسية تُخرج مرجعاً عكسياً — البدايةُ حيث كانت النهاية
    const rev = normalizeInk(box, ref.map((s) => [...s].reverse()));
    const flipped = rev.strokes.length === fwd.strokes.length && rev.strokes.every((s, i) => {
      const twin = fwd.strokes[i];
      return dist(s[0], twin[twin.length - 1]) < TOLERANCE.start
        && dist(s[s.length - 1], twin[0]) < TOLERANCE.start;
    });
    say(flipped, `${tag}: والعكسُ يخرج عكساً — بدايةُ المعكوس حيث كانت نهايةُ الصحيح`);
    // ٣) وحكمُ المحرّك عليه بعينه: الصحيحُ يُقبل والمعكوسُ يُرفَض
    const made = asMade(fwd);
    const dotted = made.dots.map((d) => [d.at, d.at, d.at]);
    const good = judge(made, [...fwd.strokes, ...dotted]);
    const bad = judge(made, [...rev.strokes, ...dotted]);
    say(good.accepted && !bad.accepted,
      `${tag}: وحكمُ المحرّك — الصحيحُ ${good.accepted ? 'يُقبل ✓' : `يُرفَض (${good.primary}) ✗`}`
      + ` والمعكوسُ ${bad.accepted ? 'يُقبَل ✗' : `يُرفَض (${bad.primary}) ✓`}`);
    // ٤) والحدُّ محروسٌ مجرَّباً سالباً: رعشةٌ مصنوعة فوق الحدّ تُردّ ولا تُعتمَد
    const shaky = ref.map((s) => s.map((p, i) => [p[0] + (i % 2 ? 1 : -1) * TOLERANCE.lateral * 2, p[1]]));
    const rough = normalizeInk(box, shaky);
    say(!rough.ok, `${tag}: والحدُّ يردّ ما بعُد — رعشةٌ مصنوعة أقصاها ${rough.norm.max}`
      + ` فوق ${TOLERANCE.lateral} ⇐ ${rough.ok ? 'مرّت ✗' : 'رُدَّت ✓'}`);
  }

  // ٥) والنقرةُ نقرةٌ لا مسار: أثرٌ أقصرُ من نصف قطر النقطة يخرج نقرةً بموضعه
  const zero = await slotGhost({ kind: 'letter', ch: '٠', form: 'isolated' });
  const tapped = normalizeInk(zero, [], [[500, 500]]);
  say(!tapped.strokes.length && tapped.dots.length === 1 && tapped.ok,
    `٠/معزول: النقرةُ تخرج نقرةً بموضعها (${tapped.dots[0]}) لا مساراً`);

  // ٦) ودَورُ الكلمات يُبنى خيالُه فعلاً — ولو لم يُملأ في أوّل جلسة
  const word = await slotGhost({ kind: 'word', text: OWNER_WORDS[0] });
  say(!!word.ink && word.sheet[0] > 0,
    `وخيالُ «${OWNER_WORDS[0]}» يُبنى: صندوقُه ${word.sheet[0]}×${word.sheet[1]}`);
  await send();
}

// ————— الإقلاع —————

let FONT_SRC = null;

(async () => {
  try {
    FONT_SRC = await loadFont();
    if (qs.get('part') === 'measure') await runWordMeasure();
    if (qs.get('part') === 'skelset') await runSkelSet();
    else if (qs.get('part') === 'fontskel') await runFontSkel();
    else if (qs.get('part') === 'words') await runWordChunk();
    else if (qs.has('build')) await runBuild();
    else if (qs.has('nodes')) await runNodes();
    else if (qs.has('sheet')) await runSheet();
    else if (qs.has('board')) await (qs.has('check') ? runOwnerCheck() : runOwnerBoard());
    else await runStudio();
  } catch (e) {
    const box = document.createElement('div');
    box.id = 'log';
    box.className = 'bad';
    box.textContent = `استثناء: ${e && e.message}`;
    document.body.append(box);
    if (!qs.has('open') && !(qs.has('board') && !qs.has('check'))) { say(false, `استثناء: ${e && e.message}`); await send(); }
  }
})();
</script>
