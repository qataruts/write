<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أيقونة «اُكْتُبْ»</title>
<!-- **ألوانُ الأيقونة تُقرأ من لوح التطبيق نفسِه** (الجلسة هـ١): لا تُكتب هنا مرّةً
     ثانية فتشيخ يومَ يتحرّك اللوح. والمقروءُ `--brand-1..3` وحدَها — وهي المعلَنُ أنّ
     موضعَها العلامةُ وأيقونتُها لا الشاشات. -->
<link rel="stylesheet" href="../app/css/app.css">
<style>
  /* أيقونة التطبيق: تُرسَم هنا وتُلتقط بـ tools/make_icons.py — لا أصل ثنائيّ يُحرَّر يدوياً.
     المقاس والهامش يأتيان من الرابط: ?size=512&pad=0.20 (الهامش لأيقونة maskable).
     الخطّ خطُّ العلامة نفسُه (`app/fonts/`) لا خطّ النظام: الأيقونةُ والترويسةُ علامةٌ واحدة. */
  @font-face {
    font-family: 'Marhey';
    src: url('../app/fonts/Marhey-arabic.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;          /* لا نلتقط بخطٍّ احتياطيّ ثم نُسمّيه علامتنا */
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: grid; place-items: center; }
  .icon {
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, var(--brand-1) 0%, var(--brand-2) 45%, var(--brand-3) 100%);
    color: #fff;
    font-family: var(--icon-font, 'Marhey'), 'Geeza Pro', 'Al Bayan', sans-serif;
    font-weight: 700;
    line-height: 1;
    overflow: hidden;
  }
  /* حبرُ الكلمة لا يجلس في وسط سطره: الخطّ يُجلسه على خطّ أساس ثم يتوزّع حولَه.
     فتُرفع الكلمةُ بمقدار انزياح حبرها هي — قاعدةُ DESIGN §٤ نفسُها (giantInk)،
     مقيسةً لا مقدَّرة (`--ink-lift` يكتبها القياس أدناه). */
  .icon span { transform: translateY(var(--ink-lift, 0em)); }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const size = +(q.get('size') || 512);
  const pad = +(q.get('pad') || 0);          // نسبة الهامش الآمن (maskable = .2)
  const round = q.get('round') !== '0';      // الأيقونة المقنَّعة تملأ المربّع كاملاً

  // **الخطُّ يُقرأ من اللوح لا يُكتب هنا** (دَينٌ أُدّي في هـ٢): كان اسمُ الخطّ مكتوباً
  // في هذا الملفّ ثلاث مرّات، فيومَ يُبدَّل خطُّ العلامة تبقى الأيقونةُ تُبنى بالمهجور.
  // فصار الأصلُ `--font-brand` من `app.css` نفسِه، **ويُقبَل خطٌّ بالرابط** ليُصَفّ
  // مرشَّحٌ لم يُحكَم له بعدُ في امتحان الأيقونات (`tools/identity_row.html`).
  const boardFont = getComputedStyle(document.documentElement)
    .getPropertyValue('--font-brand').split(',')[0].trim().replace(/^['"]|['"]$/g, '');
  const family = q.get('font') || boardFont;
  const src = q.get('src');
  if (q.get('font') && src) {
    document.head.append(Object.assign(document.createElement('style'), {
      textContent: `@font-face{font-family:'${family}';src:url('${src}') format('woff2');`
        + `font-weight:400 700;font-display:block}`,
    }));
  }
  document.documentElement.style.setProperty('--icon-font', `'${family}'`);
  const FONT = family;
  // **نسبةُ ملء الحبر — من أخوينا لا من ذوق**: يُمرّرها `make_icons.py` مقيسةً من
  // أيقونتَي اقرأ واحسب المنشورتين (انظر علّتها هناك). وإن غابت بقي الحكمُ القديم.
  const fill = +(q.get('fill') || 0);

  document.body.style.width = `${size}px`;
  document.body.style.height = `${size}px`;
  if (q.get('bg')) document.body.style.background = q.get('bg');

  const box = document.createElement('div');
  box.className = 'icon';
  box.style.width = `${size}px`;
  box.style.height = `${size}px`;
  box.style.borderRadius = round ? `${size * 0.22}px` : '0';
  // مشكولةٌ في كل مقاس (قاعدةُ اقرأ، تسري هنا): العلامةُ واحدةٌ لا تتبدّل بالمقاس،
  // والتشكيلُ في الأيقونة الصغرى زخرفةٌ لا تُقرأ — والأيقونةُ ليست مادّةَ قراءة.
  // والنسبةُ ٠٫٣٧ **حكمٌ قديم ضُبط لحبر Marhey**، ويبقى احتياطاً إن غابت نسبةُ الملء.
  const SAFE = size * (1 - 2 * pad);
  box.style.fontSize = `${SAFE * 0.37}px`;
  const word = Object.assign(document.createElement('span'), { textContent: 'اُكْتُبْ' });
  box.append(word);
  document.body.append(box);

  /**
   * **مقاسُ الكلمة يُقاس بحبرها هي** (دَينٌ أُدّي في هـ٢، وقد أدّاه احسب قبلنا):
   * رقمٌ واحد مضبوطٌ لخطٍّ بعينه يَقُصُّ علامةَ خطٍّ أعرضَ حبراً ويُقزّم علامةَ خطٍّ
   * أضيق — وقد رأينا الاثنين في لوحة المرشّحين. فيُقاس حبرُ الكلمة نفسِها ويُضبط
   * المقاسُ حتى **يشغل الحبرُ من علبته ما يشغله حبرُ أخوينا من علبتيهما** (`fill`).
   * والمقيسُ **أوسعُ بُعديه**: عرضاً كان أو ارتفاعاً — فلا تُقَصّ حركةٌ عالية.
   */
  function fitInk() {
    if (!fill) return;
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = `700 ${PROBE}px "${FONT}", sans-serif`;
      const m = ctx.measureText(word.textContent);
      const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      const span = Math.max(w, h);
      if (span > 0 && Number.isFinite(span)) {
        box.style.fontSize = `${PROBE * (SAFE * fill) / span}px`;
      }
    } catch { /* بلا canvas: الحكمُ القديم كما هو */ }
  }

  // القياس نظيرُ `inkLift` في app/js/ui.js حرفاً بحرف: نصفُ فرقِ صندوق الخطّ ناقصاً
  // نصفَ فرقِ صندوق الحبر — موجبُه يعني أن الحبر يجلس تحت المركز، فالرفعة سالبُه.
  const PROBE = 200;
  function applyLift() {
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = `700 ${PROBE}px "${FONT}", sans-serif`;
      ctx.textBaseline = 'alphabetic';
      const m = ctx.measureText(word.textContent);
      const base = (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2;
      const ink = (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
      if (Number.isFinite(base + ink)) {
        word.style.setProperty('--ink-lift', `${(-(base + ink) / PROBE).toFixed(4)}em`);
      }
    } catch { /* بلا canvas: توسيطٌ هندسيّ كما كان */ }
  }
  fitInk();
  applyLift();
  // `font-display: block` يؤخّر الرسم لا التحميل: القياسُ قبل وصول الخطّ قياسُ الاحتياطيّ.
  // فيُعاد بعد وصوله — و`--virtual-time-budget` في make_icons.py يضمن أن اللقطة بعده.
  // **والترتيبُ لازم**: الرفعةُ نسبةٌ من المقاس (`em`)، فتُقاس بعد ضبطه لا قبله.
  document.fonts?.ready.then(() => { fitInk(); applyLift(); });
</script>
</body>
</html>
