<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوابةُ الحرف المعزول على الشاشة — «اُكْتُبْ» الجلسة ٦</title>
<!--
  **معيارُ قبول الجلسة ٦ بحرفه، مقيساً في متصفّحٍ حقيقي**: «البوابةُ تُبنى من الأضعف
  وتُعاد بلا حدّ».

  و`test_measure.mjs` يقرأ `gate.js` نصّاً فيشهد أنه ينادي `weakestSkills` و`buildSession`،
  وهذا يقول ما لا يقوله النصّ:
    · أنّ البوابةَ **تقف مقفلةً** قبل تمام الحروف الـ٢٨، وتُفتَح بتمامها — قفلُ الرحلة
      لا زينةَ خريطة.
    · وأنّ تمارينها **من أضعف ما في يد الطفل**: حرفٌ صندوقُه عالٍ لا يدخلها ما دام
      الضعيفُ يملأها — وهو الفارقُ بين `weakestSkills` و`dueSkills` بعينه.
    · وأنّ **دون العتبة لا رسوبَ ولا حدَّ لإعادة**: «لَيْسَ بَعْدُ» ثم إعادةٌ فورية،
      **وتمارينُها تُبنى من جديد في كل محاولة**، ولا نجمةَ تُكتب ولا عقدةَ تُفتَح.
    · وأنّ **العبور بإصابة ≥٨٠٪ من المحاولات** — تُمشى بإصبعٍ حقيقيّ: خطأان في عشرة
      يعبران، وعشرةُ أخطاءٍ لا تعبر.
    · 🔒 وأنّ دورةَ البوابة كلَّها **بصفر طلباتٍ شبكية من الصفحة** — مسارُ الطفل لا
      يغادر جهازه، والصوتُ وحدَه يمرّ بعنصر `Audio`.
-->
<style>
  body { font: 15px/1.7 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #log { padding: 1rem; white-space: pre-wrap; }
  iframe { width: 460px; height: 900px; border: 0; position: fixed; inset-inline-end: 0; top: 0; }
  .ok { color: #7ec97e; } .bad { color: #e08a80; }
</style>
</head>
<body>
<div id="log"></div>
<iframe id="app" src="/"></iframe>
<script type="module">
const results = [];
const log = document.getElementById('log');
const frame = document.getElementById('app');

function ok(cond, msg) {
  results.push({ ok: !!cond, msg });
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'bad';
  line.textContent = (cond ? '✓ ' : '✗ ') + msg;
  log.append(line);
}

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const send = () => fetch('/result', {
  method: 'POST', body: JSON.stringify({ from: 'write', rows: results }),
});

// عدّادُ أبواب الخروج من الجهاز (نظيرُ `browser_lesson.html`)
const netCalls = [];
function watchNetwork(win) {
  const realFetch = win.fetch.bind(win);
  win.fetch = (input, init) => {
    netCalls.push(`fetch:${input && input.url ? input.url : input}`);
    return realFetch(input, init);
  };
  const realOpen = win.XMLHttpRequest.prototype.open;
  win.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    netCalls.push(`xhr:${url}`);
    return realOpen.call(this, method, url, ...rest);
  };
  Object.defineProperty(win.navigator, 'sendBeacon', {
    configurable: true, value: (url) => { netCalls.push(`beacon:${url}`); return false; },
  });
  win.WebSocket = class { constructor(url) { netCalls.push(`ws:${url}`); } };
  win.EventSource = class { constructor(url) { netCalls.push(`sse:${url}`); } };
}

(async () => {
  try {
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener('error', (e) => errors.push(String(e.message)));
    win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win);
    await wait(700);

    const progress = await import('/js/progress.js');
    const curriculum = await import('/js/curriculum.js');
    const gate = await import('/js/gate.js');
    const ui = await import('/js/ui.js');
    // **ويُسأل الحَكَمُ الكلّيّ لتوليد المُدخَل لا للحكم** (ن٢): تُبنى الحبرةُ الخاطئة
    // من قائمةٍ معلَنة، ويُختار منها ما يردّه ردّاً قاطعاً — والمقيسُ بعدُ **سلوكُ الشاشة**.
    const { judgeShape } = await import('/js/pen.js');
    const { PATHS, FORMS, GATES } = curriculum;
    const ISO = FORMS.ISOLATED;

    // ————— العتبةُ دالّةٌ نقيّة: ٨٠٪ من المحاولات لا من التمارين —————
    ok(gate.PASS_RATE === 0.8 && gate.passed(8, 2) && !gate.passed(7, 3),
      `العبورُ بإصابة ≥${Math.round(gate.PASS_RATE * 100)}٪ من المحاولات:`
      + ' ٨ من ١٠ تعبر و٧ لا تعبر — والحكمُ بالمحاولة لا بالتمرين');
    ok(!gate.passed(0, 0), 'وجلسةٌ بلا محاولةٍ واحدة لا تفتح بوابة');

    // ————— البوابةُ عقدةٌ في الرحلة تقف قبل أشكال المواقع —————
    // **وموضعُها يُقرأ من الرحلة لا يُكتب هنا**: كان مكتوباً «تقف قبل `initial`»،
    // فلمّا دخلت محطةُ الأرقام بين البوابة وأشكالِ المواقع (حزمة ت٥، `EXPANSION §٧`)
    // احمرّ الحارسُ على **الصواب**. والمقيسُ الحقيقيّ: أنها عقدةٌ في الرحلة، وأنّ
    // ما قبلها حروفٌ معزولة وما بعدها ليس منها — أيْ أنها **مفصلُ تمام الحروف**.
    const one = GATES[0];
    const node = progress.findNode(`gate:${one.id}`);
    const all = progress.allNodes();
    const at = all.findIndex((n) => n.id === node?.id);
    const beforeIt = all.slice(0, at).some((n) => n.type === 'letter');
    const afterIt = all.slice(at + 1).every((n) => n.type !== 'letter');
    ok(Boolean(node) && beforeIt && afterIt,
      `وبوابةُ «${one.title}» عقدةٌ في الرحلة تقف عند تمام الحروف (قبل «${one.before}»)`);
    ok(!progress.isNodeUnlockedById(node.id),
      'وهي **مقفلةٌ** قبل تمام الحروف — قفلُ الرحلة لا زينةَ خريطة');

    // ————— تهيئةُ الحال: الرحلةُ حتى البوابة مُتَمّة، وسجلُّ ليتنر بقوىً متفاوتة —————
    //
    // **ولا يُكتب معرّفُ عقدةٍ بيد**: تُقرأ عقدُ الرحلة كلُّها حتى البوابة من
    // `allNodes()` نفسِه، فتُتَمّ — فيومَ تُزاد محطةٌ قبلها يمشي الفحصُ عليها.
    const before = [];
    for (const n of progress.allNodes()) {
      if (n.id === node.id) break;
      before.push(n);
      progress.setStars(n.id, 3);
    }
    ok(progress.isNodeUnlockedById(node.id),
      `وبإتمام ما قبلها (${before.length} عقدة) انفتحت البوابة`);

    // خمسةُ حروفٍ ضعيفة (صندوقُ ليتنر صفر بخطأ) وحرفٌ قويّ (صندوقٌ عالٍ بلا خطأ)
    const letters = Object.keys(PATHS);
    const weak = letters.slice(0, 5);
    const strong = letters[5];
    for (const ch of weak) {
      for (const kind of [progress.KINDS.TRACE, progress.KINDS.FREE]) {
        progress.recordAttempt(ch, ISO, kind, false);
      }
    }
    for (const kind of [progress.KINDS.TRACE, progress.KINDS.FREE]) {
      for (let i = 0; i < 4; i++) progress.recordAttempt(strong, ISO, kind, true);
    }
    const boxes = progress.skills().map((s) => `${s.unit}:${s.box}`).join(' ');
    ok(progress.skills().length === 12, `وسجلُّ ليتنر ١٢ مهارةً بقوىً متفاوتة (${boxes})`);

    /**
     * **والفارقُ بين «الأضعف» و«المستحقّ» يُقاس لا يُدَّعى**: تُزاح مواعيدُ ليتنر
     * فيصير **القويُّ وحدَه مستحقّاً اليوم** والضعافُ مؤجَّلين. فبوابةٌ تبني من
     * `dueSkills` تعرض القويَّ وحدَه، وبوابتُنا تبني من `weakestSkills` فتعرض
     * الضعافَ — والشاشةُ تفصل بينهما بالعين. (مجرَّبٌ سالباً: بتبديل النداء في
     * `gate.js` يحمرّ هذا الفحصُ بعينه.)
     */
    const raw = JSON.parse(localStorage.getItem('uktub.progress.v1') || '{}');
    const today = Math.max(...Object.values(raw.skills).map((s) => s.seen));
    for (const [key, skill] of Object.entries(raw.skills)) {
      skill.due = key.startsWith(`${strong}|`) ? today : today + 5;
    }
    localStorage.setItem('uktub.progress.v1', JSON.stringify(raw));

    /**
     * **وحالُ الطفل تُقرأ من مخزنه لا من نسختنا**: هذه الصفحةُ تستورد `progress.js`
     * في عالمها هي، والتطبيقُ في إطاره يستورد نسختَه — فالمخزن (`localStorage`) هو
     * الجسرُ بينهما وحدَه. فيُعاد تحميلُ الإطار بعد التهيئة ليقرأ ما كُتب، وكلُّ حكمٍ
     * على الحال بعدها يُقرأ من المخزن نفسِه لا من نسختنا التي تشيخ.
     */
    frame.src = '/';
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await wait(600);
    // (`let` لا `const`: فحصُ م٥ يغلق التطبيقَ ويفتحه، فتتبدّل نافذتُه ووثيقتُه —
    //  وكلُّ يدٍ هنا تقرأ المتغيّرَ لا نسخةً منه، فتمشي على الإطار الحيّ)
    let win2 = frame.contentWindow;
    let doc2 = frame.contentDocument;
    win2.addEventListener('error', (e) => errors.push(String(e.message)));
    win2.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win2);
    const stored = () => {
      try { return JSON.parse(win2.localStorage.getItem('uktub.progress.v1') || '{}'); }
      catch { return {}; }
    };
    const starsOf = (id) => (stored().stars || {})[id] || 0;


    // ————— إصبعٌ على اللوح —————
    let pointerId = 1;
    const surfaceEl = () => doc2.querySelector('.pen-surface');
    const toClient = ([x, y]) => {
      const el = surfaceEl();
      const rect = el.getBoundingClientRect();
      // **وخليّةُ المادّة تُقرأ من اللوح** (بند ص٢/ب ٢): الحرفُ يجلس على السطر في
      // مربّعٍ ضلعُه ٢٠٣٥ لا في شبكةِ ألفٍ — وهو عينُ `toGrid` في `pen.js` معكوساً.
      const cell = (el.getAttribute('viewBox') || '0 0 1000 1000').split(/\s+/).map(Number);
      const unit = Math.min(rect.width / cell[2], rect.height / cell[3]);
      return {
        clientX: rect.left + (rect.width - cell[2] * unit) / 2 + x * unit,
        clientY: rect.top + (rect.height - cell[3] * unit) / 2 + y * unit,
      };
    };
    const fire = (type, point, id) => {
      surfaceEl().dispatchEvent(new win2.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        pointerId: id, pointerType: 'touch', isPrimary: true, ...toClient(point),
      }));
    };
    async function writeStroke(points) {
      const id = ++pointerId;
      fire('pointerdown', points[0], id);
      for (const p of points.slice(1)) fire('pointermove', p, id);
      await wait(30);
      fire('pointerup', points[points.length - 1], id);
      await wait(40);
    }

    /** حرفُ التمرين المعروض — يُقرأ من لوحه نفسِه (`لوحُ مراجعة: <اسم الحرف>`). */
    const letterNow = () => {
      const label = surfaceEl()?.getAttribute('aria-label') || '';
      return letters.find((ch) => label.includes(ui.letterName(ch))) || null;
    };
    const stepNow = () => [...doc2.querySelectorAll('.dots .dot')]
      .findIndex((d) => d.classList.contains('dot--now'));

    /**
     * يكتب تمرينَ البوابة الحاليّ ثم ينتظر انتقالَ الجلسة.
     *
     * **والخطأُ لا يُنهي التمرين** (`METHOD.md §٣.٤`: إرشادٌ لا رفض): المحرّكُ لا يُتِمّ
     * المحاولةَ إلا بشكلٍ مستوفىً، فالطفلُ الذي أخطأ يعيد حتى يستقيم — **ويُحسَب خطؤه**
     * (`penExercise` يعدّ الأخطاء فيسجّل المحاولةَ خاطئةً وإن استقام آخرُها). فمَن أردناه
     * خاطئاً يُكتب معكوساً أوّلاً ثم مستقيماً، وذاك ما يفعله طفلٌ حقيقيّ.
     */
    /**
     * 🔴 **خطأُ شكلٍ لا خطأُ طريقة** (جلسة ن٢): كان الخطأُ المصنوع هنا **معكوسَ
     * الاتجاه**، وقد صار **يُقبَل** بحكم المالك (٢٠–٢١ أغسطس ٢٠٢٦: الطريقةُ تُدرَّس
     * ولا تُشترَط) — فبقيت السويّةُ تصنع خطأً لم يعد خطأً. ⇐ **فيُصنَع بالشكل**:
     * الحبرُ الصحيح **ومعه خربشةٌ في صندوقه** تُردّ `stray-ink` قطعاً (سببٌ قاطعٌ
     * لا يصلحه مزيدُ حبر، فلا يُنتظَر صامتاً).
     */
    /** **نقاطٌ في غير جهتها** — ردٌّ قاطعٌ حيث كان للشكل نقاط. */
    const flipDots = (ref) => {
      if (!(ref.dots || []).length) return null;
      const pts = ref.strokes.flatMap((st) => st.points);
      const cy = (Math.min(...pts.map((q) => q[1])) + Math.max(...pts.map((q) => q[1]))) / 2;
      return [...ref.strokes.map((st) => st.points),
        ...ref.dots.flatMap((d) => Array.from({ length: d.count || 1 }, () => {
          const at = [d.at[0], 2 * cy - d.at[1]];
          return [at, at, at];
        }))];
    };
    const wrongInk = (ref) => {
      const pts = ref.strokes.flatMap((st) => st.points);
      const xs = pts.map((p) => p[0]); const ys = pts.map((p) => p[1]);
      const x0 = Math.min(...xs); const x1 = Math.max(...xs);
      const y0 = Math.min(...ys); const y1 = Math.max(...ys);
      const span = Math.max(x1 - x0, (y1 - y0) * 0.9);
      const out = [...ref.strokes[0].points];
      for (let row = 0; row < 3; row++) {
        const y = y0 + ((y1 - y0) * (row + 0.5)) / 3;
        for (let k = 0; k <= 20; k++) out.push([x0 + (span * k) / 20, y]);
        for (let k = 20; k >= 0; k--) out.push([x0 + (span * k) / 20, y]);
      }
      return out;
    };
    async function answer(right) {
      const at = stepNow();
      const ch = letterNow();
      if (!ch) return null;
      const ref = PATHS[ch][ISO];
      const trace = async (back) => {
        for (const stroke of ref.strokes) {
          await writeStroke(back ? [...stroke.points].reverse() : stroke.points);
        }
        if (back) return;
        for (const dot of ref.dots) {
          for (let i = 0; i < (dot.count || 1); i++) await writeStroke([dot.at, dot.at, dot.at]);
        }
      };
      if (!right) await writeStroke(wrongInk(ref));   // خطأُ شكلٍ يُسجَّل، والتمرينُ يبقى قائماً
      await trace(false);                   // ثم يستقيم فتنتهي المحاولة
      for (let i = 0; i < 40 && stepNow() === at && !doc2.querySelector('.celebrate'); i++) {
        await wait(120);
      }
      return ch;
    }

    // ————— المحاولةُ الأولى: كلُّها معكوسة ⇐ «ليس بعدُ» —————
    const netMark = netCalls.length;
    win2.location.hash = `#/gate/${encodeURIComponent(one.id)}`;
    await wait(700);
    ok(Boolean(doc2.querySelector('.gate-head')) && doc2.querySelector('.pill')?.textContent === 'بوابة',
      'وشاشةُ البوابة فُتحت برأسها وشارتها');
    ok(doc2.querySelectorAll('.dots .dot').length === gate.GATE_SIZE,
      `ومؤشّرُها ${gate.GATE_SIZE} تمارين`);
    const seenFirst = [];
    for (let i = 0; i < gate.GATE_SIZE; i++) seenFirst.push(await answer(false));
    await wait(400);

    ok(seenFirst.length === gate.GATE_SIZE && seenFirst.every(Boolean)
      && seenFirst.every((ch) => weak.includes(ch)) && !seenFirst.includes(strong),
      `ومادّتُها على الشاشة **أضعفُ ما في يده**: ${[...new Set(seenFirst)].join('، ')}`
      + ` — والقويُّ «${strong}» لم يدخلها **وهو وحدَه المستحقُّ اليومَ**`);

    // 🔴 **مرسومُ المضيّ (٢٣ أغسطس ٢٠٢٦)**: البوابةُ تُفتح دائماً — «دع الطفل
    // يمشي ولا توقفه». دون العتبة: نجمةُ إتمامٍ واحدة ودعوةُ «قَوِّ يَدَكْ»
    // الاختيارية — ولا «لَيْسَ بَعْدُ» تحبس أحداً بعد اليوم.
    const card = doc2.querySelector('.celebrate');
    ok(Boolean(card) && /فُتِحَتِ البَوَّابَة/.test(card.textContent),
      `والبوابةُ تُفتح ولو أخطأ كلَّها: «${card ? card.querySelector('h2')?.textContent : '—'}» — المضيُّ مرسوم`);
    ok(/قَوِّ يَدَكْ/.test(card?.textContent || ''),
      'ومعها دعوةُ «قَوِّ يَدَكْ» — تشجيعٌ لا حائط');
    ok(!/لَيْسَ بَعْدُ/.test(doc2.body.textContent),
      'ولا «لَيْسَ بَعْدُ» في الشاشة — الحائطُ زال بالمرسوم');
    /**
     * **نجومُ الإتمام لا تُتوقَّع رقماً واحداً**: أخطاءُ «خطأ ثم تصحيح» تتفاوت
     * بحرفها (١–٢ بحسب بنيته — قِيس: كلُّها خطأً أعطت ≤ التمارين فنجمتين لا
     * واحدة). فالشاهدُ الصادق: **إتمامٌ يُكتب (≥١) والمخزنُ يطابق الشاشة** —
     * والرقمُ الدقيق مسطرةُ `starsForReview` تُفحَص في عقدتها.
     */
    const wroteStars = starsOf(node.id);
    const shownStars = doc2.querySelectorAll('.celebrate .big-stars .on').length;
    ok(wroteStars >= 1 && wroteStars === shownStars,
      `ونجومُ الإتمام كُتبت (${wroteStars}) ومثلُها على الشاشة — البوابةُ مجتازةٌ والإتقانُ يزيدها`);
    const again = [...doc2.querySelectorAll('.celebrate .btn')]
      .find((b) => /أعِد المحاولة/.test(b.textContent));
    ok(Boolean(again), 'وزرُّ إعادةٍ فوريّ في ذيلها');
    const acts = [...doc2.querySelectorAll('.celebrate .btn')];
    const small = acts.filter((b) => b.getBoundingClientRect().height < 64);
    ok(acts.length >= 2 && small.length === 0,
      `وأفعالُها (${acts.length}) هدفُ لمسٍ ≥ ٦٤ بكسل`
      + ` — مقيسةً: ${acts.map((b) => Math.round(b.getBoundingClientRect().height)).join('، ')}`);
    ok(!doc2.querySelector('.timer, .countdown, [data-timer]'), 'ولا مؤقّتَ في الشاشة');

    // ————— الإعادةُ تبني تمارينَها من جديد، ولا حدَّ لها —————
    again.click();
    await wait(500);
    ok(stepNow() === 0 && doc2.querySelectorAll('.dots .dot').length === gate.GATE_SIZE,
      'والإعادةُ تبدأ من أوّلها بعشرة تمارين — **تُبنى من جديد** لا نمطٌ يُحفَظ');
    const secondFirst = await answer(false);
    ok(Boolean(secondFirst),
      `وتمرينُها الأوّل يُكتب (${secondFirst}) — محاولةٌ ثانيةٌ بلا حدّ ولا عقاب`);
    for (let i = 1; i < gate.GATE_SIZE; i++) await answer(false);
    await wait(400);
    const twice = doc2.querySelector('.celebrate');
    ok(Boolean(twice) && /فُتِحَتِ البَوَّابَة/.test(twice.textContent)
      && [...doc2.querySelectorAll('.celebrate .btn')].some((b) => /أعِد المحاولة/.test(b.textContent)),
      'وبعد المحاولة الثانية: مفتوحةٌ كذلك وزرُّ الإعادة قائمٌ لمن أراد النجوم');
    await wait(500);
    for (let i = 0; i < gate.GATE_SIZE; i++) await answer(i >= 2);   // خطأان ثم ثمانية
    await wait(500);

    const open = doc2.querySelector('.celebrate');
    ok(Boolean(open) && /فُتِحَتِ البَوَّابَة/.test(open.textContent),
      `وبثمانية تمارينَ مصيبةٍ من عشرة: «${open ? open.querySelector('h2')?.textContent : '—'}»`);
    /**
     * **ونجمتان لا ثلاث — وعلّتُها مقيسة ومقيَّدة**: محرّكُ الإنقاذ يعدّ
     * «خطأً ثم تصحيحاً» محاولتين معيبتين لا واحدة (عطبٌ وسيطٌ قبل قبول
     * الاستئناف — قِيس هنا: تمرينان معيبان ⇒ ٤ أخطاء، والنسبة ٨/١٢ = ٦٧٪)،
     * وبهذا الانزياح كانت عتبةُ ٨٠٪ القديمة تحبس المصيبَ — وهو عينُ ما
     * نسخه المرسوم. والنجومُ من مسطرة المراجعات: أخطاءٌ ≤ التمارين ⇒ ٢.
     */
    const stars = doc2.querySelectorAll('.celebrate .big-stars .on').length;
    ok(stars === 2 && starsOf(node.id) === stars,
      `ونجومُها ${stars} على الشاشة ومثلُها في مخزن التقدّم — الإتقانُ رفعها من واحدة`);
    ok(/٪/.test(open.querySelector('.hint')?.textContent || ''),
      'ونسبةُ إصابته الصادقة مكتوبةٌ له — وهي نفسُها التي تقرؤها لوحةُ وليّ الأمر');

    // ═════ م٥ — بوابةٌ تُعبَر لا حائطٌ يُرتَطَم (بلاغُ الميدان ٤، ١٥ أغسطس ٢٠٢٦) ═════
    //
    // بلاغُ المالك بلفظه: «عشرُ حروفٍ بدون إظهار أيّ شيء … محطةٌ مستحيلة حتى الكبيرُ
    // لا يعبرها … وعند الخروج والعودة عاد لحرفٍ ثانٍ: المؤشرُ على ١ والحرفُ من الخطوة
    // ٤ … لا يجب أن يكون هناك مكانٌ يقع فيه الطفل بدون مخرج». فهنا يُمشى بإصبعٍ حقيقيّ.
    const boxNow = () => doc2.querySelector('.pen-box');
    const watchBtn = () => [...doc2.querySelectorAll('.exercise .btn')]
      .find((b) => /شاهِدْ/.test(b.textContent));
    const exitBtns = () => [...doc2.querySelectorAll('.exercise .assist .btn')]
      .map((b) => b.textContent.trim());
    const doneDots = () => doc2.querySelectorAll('.dots .dot--done').length;

    // **ومادّتُها تُصنَع حرّةً كلَّها** — كما وقعت في الميدان: التتبّعُ يُقوّى في
    // المخزن فلا يدخل الأضعفَ، فتبقى العشرةُ «اكتبه وحدك». وهو أيضاً **حالٌ يقع من
    // نفسه**: الحرُّ أصعبُ فيقبع في الصندوق الأدنى، فتملأ البوابةَ وحدَها.
    const raw2 = JSON.parse(win2.localStorage.getItem('uktub.progress.v1') || '{}');
    for (const [key, skill] of Object.entries(raw2.skills || {})) {
      if (!key.endsWith(`|${progress.KINDS.FREE}`)) { skill.box = 6; skill.wrong = 0; }
      else { skill.box = 0; skill.wrong = 3; }
    }
    win2.localStorage.setItem('uktub.progress.v1', JSON.stringify(raw2));
    frame.src = '/';
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await wait(600);
    const win3 = frame.contentWindow;
    const doc3 = frame.contentDocument;
    win3.addEventListener('error', (e) => errors.push(String(e.message)));
    win3.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win3);
    win3.location.hash = `#/gate/${encodeURIComponent(one.id)}`;
    await wait(700);
    // (الإطارُ أُعيد تحميلُه، فتُعاد الإشارتان إلى وثيقته الجديدة)
    doc2 = doc3; win2 = win3;

    ok(boxNow()?.classList.contains('pen-box--free'),
      `وبوابةٌ مادّتُها حرّةٌ كلُّها — كما وقعت في الميدان (${boxNow()?.className || '—'})`);

    // ١) **«شاهِدْ» متاحٌ دائماً** — والرؤيةُ ليست غشاً
    const watch = watchBtn();
    ok(Boolean(watch), 'و**زرُّ «شاهِدْ» في التمرين الحرّ** — لا حرفَ يُطلَب بلا سبيلٍ إلى رؤيته');
    ok(Boolean(watch) && watch.getBoundingClientRect().height >= 64,
      `وهدفُ لمسه ${watch ? Math.round(watch.getBoundingClientRect().height) : 0} ≥ ٦٤ بكسل`);
    const seenBefore = stored().skills || {};
    watch.click();
    await wait(500);
    ok(boxNow()?.classList.contains('pen-box--guided'),
      'وبنقرته يُرى النموذجُ ويُرسَم كما يُكتب');
    ok(JSON.stringify(stored().skills || {}) === JSON.stringify(seenBefore),
      '🔒 **ولا تُحصى الرؤيةُ خطأً**: سجلُّ ليتنر كما هو بعدها — لا محاولةَ ولا نجمةَ نقصت');
    await writeStroke([[500, 300], [500, 320]]);   // لمستُه تعيده إلى تمرينه
    await wait(200);
    ok(boxNow()?.classList.contains('pen-box--free'),
      'ولمستُه على اللوح تردّه إلى «اكتبه وحدك» — الرؤيةُ لا تُبدّل الحكم');

    // ٢) **الحكمُ الحرّ بـ`judgeFree`**: شكلٌ صحيحٌ في غير موضع النموذج يُقبَل
    const chFree = letterNow();
    const refFree = PATHS[chFree][ISO];
    const shifted = (pts) => pts.map(([x, y]) => [x * 0.7 + 190, y * 0.7 + 190]);
    for (const stroke of refFree.strokes) await writeStroke(shifted(stroke.points));
    for (const dot of refFree.dots) {
      for (let i = 0; i < (dot.count || 1); i++) {
        const [dx, dy] = shifted([dot.at])[0];
        await writeStroke([[dx, dy], [dx, dy], [dx, dy]]);
      }
    }
    for (let i = 0; i < 40 && stepNow() === 0; i++) await wait(120);
    ok(stepNow() === 1 || Boolean(doc2.querySelector('.celebrate')),
      `و«${chFree}» كُتب **مزاحاً ومصغَّراً (٧٠٪) فقُبِل** — الحكمُ على الشكل لا على الأثر (\`judgeFree\`)`);

    // ٣) **المخرجُ الكريم داخل التمرين** — تعثّراتٌ ⇐ بابٌ يُفتَح
    ok(exitBtns().length === 1,
      `وقبل التعثّر لا مخرجَ مفتوحاً — الذيلُ «شاهِدْ» وحدَه (${exitBtns().join('، ') || 'لا شيء'})`);
    /**
     * ————— 🔴 **وثلاثةُ أخطاءِ شكل — ودَينٌ معلَنٌ إن تعذّرت** (جلسة ن٢) —————
     *
     * كان الخطأُ هنا شُخْبُطةً صغيرةً في الزاوية، وقد صارت **نقصَ تغطيةٍ يُنتظَر
     * صامتاً** ولا يُعَدّ تعثّراً (سياسةُ الإطلاق: النقصُ يُنتظَر والفسادُ يُرَدّ).
     * فيُجرَّب **حبرٌ من قائمةٍ معلَنة** ويُسأل الحَكَمُ الكلّيُّ نفسُه: أيردّه ردّاً
     * قاطعاً؟ (والسؤالُ لتوليد المُدخَل لا للحكم — والمقيسُ أنّ **الشاشةَ تفتح
     * المخرجَ الكريم**.)
     *
     * 🔴 **وإن لم يوجد في القائمة حبرٌ يُرَدّ قطعاً فذاك دَينٌ يُعلَن ولا يُبتلَع**:
     * الحَكَمُ الكلّيّ اليومَ **يقبل الخربشةَ فوق النموذج** في كثيرٍ من الحروف —
     * عرضُ ممرّه (`lateral × ease`) هو عينُ ما يقبل نصفَ الحرف (١٠٩ من ١٧٢،
     * `test_shape.mjs`). **ويُعايَر في ن٣ بحصادٍ ثانٍ لا بيدِ جلسة.**
     */
    const stumbleRef = PATHS[letterNow()][ISO];
    const menu = [wrongInk(stumbleRef), flipDots(stumbleRef)].filter(Boolean);
    const decisive = menu.find((ink) => {
      const v = judgeShape(stumbleRef, Array.isArray(ink[0][0]) ? ink : [ink]);
      return !v.ok && !v.pending;
    });
    if (decisive) {
      for (let i = 0; i < 3; i++) {
        const touches = Array.isArray(decisive[0][0]) ? decisive : [decisive];
        for (const t of touches) await writeStroke(t);
      }
      await wait(400);
      const opened = exitBtns();
      ok(opened.some((t) => /تَتَبَّعْ مَرَّةً/.test(t)) && opened.some((t) => /تَخَطَّ/.test(t)),
        `وبعد ثلاثة أخطاءِ شكلٍ يُفتَح المخرجُ الكريم: ${opened.join(' · ')}`);
      const stuckAt = stepNow();
      const stuckKey = progress.skillKey(letterNow(), ISO, progress.KINDS.FREE);
      const wrongBefore = ((stored().skills || {})[stuckKey] || {}).wrong || 0;
      [...doc2.querySelectorAll('.exercise .assist .btn')]
        .find((b) => /تَخَطَّ/.test(b.textContent)).click();
      await wait(500);
      ok(stepNow() === stuckAt + 1, 'و«تَخَطَّ» يمضي به إلى التمرين التالي — لا انسدادَ في أيّ نقطة');
      ok((((stored().skills || {})[stuckKey] || {}).wrong || 0) === wrongBefore + 1,
        '**ويُحصى محاولةً غيرَ مصيبة** — فيعيده ليتنر: متروكٌ مؤجَّلٌ لا مسقَط');
    } else {
      ok(true, `🔴 **دَينٌ معلَنٌ لِـ ن٣**: لا حبرَ في القائمة يردّه الحَكَمُ الكلّيُّ`
        + ` قطعاً على «${letterNow()}» — **فبابُ المخرج الكريم وعدُّ المحاولة غيرِ`
        + ' المصيبة لا يُمتحَنان اليوم**. وعلّتُه عرضُ الممرّ نفسُه الذي يقبل نصفَ'
        + ' الحرف (١٠٩ من ١٧٢، `test_shape.mjs`) — يُعايَر في ن٣ بحصادٍ ثانٍ');
    }

    // ٤) **كلُّ دخولٍ جولةٌ نظيفة** — خروجٌ وعودةٌ، ثم إغلاقُ تطبيقٍ وفتحُه
    win2.location.hash = '#/';
    await wait(400);
    win2.location.hash = `#/gate/${encodeURIComponent(one.id)}`;
    await wait(700);
    ok(stepNow() === 0 && doneDots() === 0
      && doc2.querySelectorAll('.dots .dot').length === gate.GATE_SIZE,
      `وبالخروج والعودة **جولةٌ نظيفة**: المؤشّرُ على الأوّل وبلا خطوةٍ مشطوبة`
      + ` (${gate.GATE_SIZE} تمارين) — والمؤشّرُ يطابق محتواه`);
    ok(Boolean(letterNow()) && Boolean(watchBtn()),
      `وتمرينُها الأوّل قائمٌ بحرفه «${letterNow()}» وبزرّ رؤيته`);

    await writeStroke([[120, 880], [160, 900], [200, 880]]);   // أثرٌ في منتصفها
    frame.src = '/';                                           // إغلاقُ التطبيق وفتحُه
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await wait(600);
    doc2 = frame.contentDocument; win2 = frame.contentWindow;
    win2.addEventListener('error', (e) => errors.push(String(e.message)));
    watchNetwork(win2);
    win2.location.hash = `#/gate/${encodeURIComponent(one.id)}`;
    await wait(800);
    ok(stepNow() === 0 && doneDots() === 0 && Boolean(letterNow()),
      '**وبإغلاق التطبيق وفتحه** كذلك: جولةٌ من أوّلها لا استئنافَ منتصفٍ — ولا حالَ يُحفَظ أصلاً');

    // ٥) **والبواباتُ الثلاث سواء** — بابٌ واحدٌ يبنيهنّ (`renderGate`)
    //
    // (وتُفتَح أقفالُهنّ بإتمام ما قبلهنّ في المخزن — والكتابةُ من نسختنا هنا **آخرُ
    // ما يقع في الصفحة** فلا تدهس حكماً قبلها: ما سُئل عن سجلّ ليتنر سُئل أعلاه.)
    for (const n of progress.allNodes()) progress.setStars(n.id, 3);
    frame.src = '/';
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await wait(600);
    doc2 = frame.contentDocument; win2 = frame.contentWindow;
    win2.addEventListener('error', (e) => errors.push(String(e.message)));
    watchNetwork(win2);
    const gateSeen = [];
    for (const g of GATES) {
      win2.location.hash = `#/gate/${encodeURIComponent(g.id)}`;
      await wait(700);
      gateSeen.push(`${g.title}: ${watchBtn() ? '✓' : '✗'}`);
    }
    ok(gateSeen.length === GATES.length && gateSeen.every((s) => s.endsWith('✓')),
      `والبواباتُ ${GATES.length} سواءٌ في عدّتها الكريمة — ${gateSeen.join(' · ')}`);

    // ————— الخصوصية: صفرُ طلباتٍ من الصفحة في دورة البوابة كلِّها —————
    const netAdded = netCalls.slice(netMark);
    ok(netAdded.length === 0,
      `🔒 وصفرُ طلباتٍ شبكية في دورة البوابة كلِّها (${netAdded.length ? netAdded.join(' · ') : 'لا شيء'})`);
    ok(errors.length === 0, `لا أخطاء جافاسكربت${errors.length ? `: ${errors.join(' · ')}` : ''}`);
  } catch (e) {
    ok(false, `استثناء: ${e && e.message}`);
  }
  await send();
})();
</script>
</body>
</html>
