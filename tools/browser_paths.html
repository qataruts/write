<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مساراتُ الحروف على الشاشة — «اُكْتُبْ» الجلسة ٢</title>
<!--
  **معيارُ قبول الجلسة ٢ بحرفه، مقيساً في متصفّحٍ حقيقي**:
  «كلُّ حرفٍ يُعرض متحركاً **من مساره نفسِه** ويُتتبَّع بالمحرك فيُقبل الصحيح
  ويُرفض المعكوس».

  و`tools/test_paths.mjs` يُدخِل المساراتِ على `judge` في node — وهذا يقول ما لا
  يقوله node: أن **الشاشة** ترسم الحرفَ من مساره (طولُ خطّ النموذج عينُ طول المسار،
  والرسمُ المتحرك يمشي عليه)، وأن **إصبعاً حقيقياً** (أحداثُ مؤشّرٍ على اللوح) يُقبل
  إذا كتب صحيحاً ويُردّ إذا عكس — على الأشكال كلِّها لا على عيّنة.

  🔒 ومعها الخصوصية: **صفرُ طلباتٍ شبكية** في دورة كتابةٍ كاملة على حرفٍ حقيقيّ
  (نظيرُ `browser_pen.html` في الجلسة ١، والحرفُ اليومَ حرفٌ لا شكلٌ هندسيّ).
-->
<style>
  body { font: 15px/1.7 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #log { padding: 1rem; white-space: pre-wrap; }
  iframe { width: 460px; height: 900px; border: 0; position: fixed; inset-inline-end: 0; top: 0; }
  .ok { color: #7ec97e; } .bad { color: #e08a80; }
</style>
</head>
<body>
<div id="log"></div>
<iframe id="app" src="/?dev=1#/pen"></iframe>
<script type="module">
const results = [];
const log = document.getElementById('log');
const frame = document.getElementById('app');

function ok(cond, msg) {
  results.push({ ok: !!cond, msg });
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'bad';
  line.textContent = (cond ? '✓ ' : '✗ ') + msg;
  log.append(line);
}

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// **وتقريرُنا مبصومٌ باسمنا** (`calc@16c37dc`): جارٌ في مساحة العمل قد يسبق إلى
// المنفذ، فيُهمِل خادمُنا كلَّ حمولةٍ بلا هذه البصمة — ولا يُقرأ تقريرُ جارٍ تقريرَنا.
const send = () => fetch('/result', {
  method: 'POST', body: JSON.stringify({ from: 'write', rows: results }),
});

// عدّادُ أبواب الخروج من الجهاز (نظيرُ `browser_pen.html`)
const netCalls = [];
function watchNetwork(win) {
  const realFetch = win.fetch.bind(win);
  win.fetch = (input, init) => {
    netCalls.push(`fetch:${input && input.url ? input.url : input}`);
    return realFetch(input, init);
  };
  const realOpen = win.XMLHttpRequest.prototype.open;
  win.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    netCalls.push(`xhr:${url}`);
    return realOpen.call(this, method, url, ...rest);
  };
  Object.defineProperty(win.navigator, 'sendBeacon', {
    configurable: true, value: (url) => { netCalls.push(`beacon:${url}`); return false; },
  });
  win.WebSocket = class { constructor(url) { netCalls.push(`ws:${url}`); } };
  win.EventSource = class { constructor(url) { netCalls.push(`sse:${url}`); } };
}

const polyLen = (points) => points.reduce((sum, p, i) => (i
  ? sum + Math.hypot(p[0] - points[i - 1][0], p[1] - points[i - 1][1]) : 0), 0);

/** يدُ طفلٍ مصنوعة: مشيةٌ على المسار المرجعيّ بخطوةٍ ثابتة. */
function walk(points, back) {
  const list = back ? [...points].reverse() : points;
  const out = [];
  for (let i = 0; i < list.length; i++) {
    out.push(list[i]);
    if (i < list.length - 1) {
      out.push([(list[i][0] + list[i + 1][0]) / 2, (list[i][1] + list[i + 1][1]) / 2]);
    }
  }
  return out;
}

(async () => {
  try {
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener('error', (e) => errors.push(String(e.message)));
    win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win);
    await wait(900);

    const { PATHS } = await import('/js/paths.js');
    const { FORM_NAMES } = await import('/js/curriculum.js');
    const { prepare, pointAt } = await import('/js/pen.js');

    /**
     * **خطُّ الطفل على الطيّة**: منتصفُ الضلعين — يصعد ثم يعود عليه، كما تُكتب
     * السنّةُ حقّاً في «اكتبه وحدك» (`METHOD.md §٥.٤`). ويُبنى من المسار نفسِه:
     * يُقرَن الضلعُ الصاعد بالنازل بنسبة الطول.
     */
    function spine(points, fold, steps = 24) {
      const up = prepare(points.slice(fold.from, fold.apex + 1));
      const down = prepare(points.slice(fold.apex, fold.to + 1));
      const mid = [];
      for (let i = 0; i <= steps; i++) {
        const a = pointAt(up, (i / steps) * up.len).at;
        const b = pointAt(down, (1 - i / steps) * down.len).at;
        mid.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
      }
      return [...points.slice(0, fold.from + 1), ...mid,
        ...[...mid].reverse().slice(1), ...points.slice(fold.to + 1)];
    }
    /**
     * **العودةُ على الأثر الرطب**: يصعد ضلعَ الطيّة الصاعد ثم **ينزل عليه هو** —
     * أطبعُ ما تفعله يدُ طفل، وبها أسقطت مراجعةُ المدير الثانية المحرّكَ على ب بوجهيها.
     */
    function retrace(points, fold) {
      const rising = points.slice(fold.from, fold.apex + 1);
      return [...points.slice(0, fold.from + 1), ...rising.slice(1),
        ...[...rising].reverse().slice(1), ...points.slice(fold.to + 1)];
    }
    const byHand = (make) => (ref) => ({
      dots: ref.dots,
      strokes: ref.strokes.map((s) => (s.folds?.length
        ? { points: make(s.points, s.folds[0]) } : s)),
    });
    const letters = Object.keys(PATHS);
    ok(letters.length > 0, `المساراتُ في التطبيق: ${letters.length} حرفاً (${letters.join('، ')})`);

    let pointerId = 1;
    const surfaceEl = () => doc.querySelector('.pen-surface');
    const toClient = ([x, y]) => {
      const rect = surfaceEl().getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);
      return {
        clientX: rect.left + (rect.width - size) / 2 + (x / 1000) * size,
        clientY: rect.top + (rect.height - size) / 2 + (y / 1000) * size,
      };
    };
    const fire = (type, point, id) => {
      surfaceEl().dispatchEvent(new win.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        pointerId: id, pointerType: 'touch', isPrimary: true, ...toClient(point),
      }));
    };
    async function writeStroke(points) {
      const id = ++pointerId;
      fire('pointerdown', points[0], id);
      for (const p of points.slice(1)) fire('pointermove', p, id);
      await wait(40);
      fire('pointerup', points[points.length - 1], id);
      await wait(40);
    }
    async function writeAll(ref, back) {
      for (const stroke of ref.strokes) await writeStroke(walk(stroke.points, back));
      for (const dot of ref.dots) {
        for (let i = 0; i < (dot.count || 1); i++) await writeStroke([dot.at, dot.at]);
      }
    }

    const press = (label) => {
      const button = [...doc.querySelectorAll('.dev-row .btn')]
        .find((b) => b.textContent.trim() === label);
      button?.click();
      return !!button;
    };
    const readout = () => doc.querySelector('.dev-readout')?.textContent || '';

    // ————— الأشكالُ كلُّها: عرضٌ من المسار، ثم صحيحٌ يُقبَل ومعكوسٌ يُرفَض —————
    const netMark = netCalls.length;
    let shown = 0;
    let judged = 0;
    for (const ch of letters) {
      ok(press(ch), `اختيارُ الحرف ${ch} من شاشة التجربة`);
      for (const [form, ref] of Object.entries(PATHS[ch])) {
        press(FORM_NAMES[form]);
        await wait(60);
        const svg = surfaceEl();
        if (!svg) { ok(false, `${ch} ${FORM_NAMES[form]}: لا لوحَ على الشاشة`); continue; }

        // **النموذجُ من المسار نفسِه**: طولُ خطّ النموذج المرسوم عينُ طول المسار
        // المرجعيّ — لا شكلَ ثانٍ يُرسَم للطفل ثم يُحكَم عليه بغيره.
        const trails = [...svg.querySelectorAll('.pen-stroke--trail')];
        const same = trails.length === ref.strokes.length && trails.every((t, i) => {
          const drawn = Number(t.getAttribute('stroke-dasharray'));
          return Math.abs(drawn - polyLen(ref.strokes[i].points)) < 1;
        });
        const dots = svg.querySelectorAll('.pen-dot').length;
        ok(same && dots === ref.dots.length,
          `${ch} ${FORM_NAMES[form]}: النموذجُ المرسوم عينُ المسار المرجعيّ`
          + ` (${trails.length} جزءاً و${dots} نقطة)`);
        if (same) shown++;

        // **ويُرسَم متحركاً**: بعد «شاهِد» يمشي القلمُ على المسار فينقص المتبقّي
        press('شاهِد');
        await wait(420);
        const moved = trails.some((t) => Number(t.getAttribute('stroke-dashoffset'))
          < Number(t.getAttribute('stroke-dasharray')) - 1);
        ok(moved, `${ch} ${FORM_NAMES[form]}: ويُرسَم متحركاً على مساره (شاهِد)`);
        press('أعِد');
        await wait(80);

        // **الصحيحُ يُقبَل**
        await writeAll(ref, false);
        const good = readout();
        const accepted = /✓ مقبول/.test(good);
        press('أعِد');
        await wait(60);

        // **والمعكوسُ يُرفَض**
        await writeAll(ref, true);
        const bad = readout();
        const rejected = !/✓ مقبول/.test(bad);
        ok(accepted && rejected,
          `${ch} ${FORM_NAMES[form]}: الصحيحُ ${accepted ? 'يُقبَل' : 'رُدّ — ' + good.split('\n')[0]}`
          + ` · المعكوسُ ${rejected ? 'يُرفَض' : 'قُبل وهو خطأ!'}`);
        if (accepted && rejected) judged++;
        press('أعِد');
        await wait(40);

        // **والسنّةُ على خطٍّ واحد** (الطيّةُ المعلَنة، الجلسة ٢ب): في التتبّع يمشي
        // الطفلُ على ضلعَي النموذج، وفي الصندوق الفارغ يكتب السنّةَ **خطّاً واحداً
        // صعوداً ونزولاً** كما تُكتب حقّاً. وهنا تُكتب **بإصبعٍ حقيقيّ** على اللوح —
        // فيمرّ خطُّها بتبسيط النقاط وإطارِ الرسم، لا بـ`judge` وحدها.
        // **ووجهان لليد الواحدة**: خطٌّ بين الضلعين، وعودةٌ على الأثر الرطب فوق
        // الضلع الصاعد نفسِه — والثاني هو الذي أسقط المحرّك في مراجعة المدير الثانية.
        if (ref.strokes.some((s) => s.folds?.length)) {
          for (const [what, make] of [['بين الضلعين', spine], ['على الأثر الرطب', retrace]]) {
            await writeAll(byHand(make)(ref), false);
            const free = readout();
            ok(/✓ مقبول/.test(free),
              `${ch} ${FORM_NAMES[form]}: **السنّةُ على خطٍّ واحد ${what}** تُقبَل بإصبعٍ حقيقيّ`
              + `${/✓ مقبول/.test(free) ? '' : ' — ' + free.split('\n')[0]}`);
            press('أعِد');
            await wait(40);
          }
        }
      }
    }
    const shapes = letters.reduce((n, ch) => n + Object.keys(PATHS[ch]).length, 0);
    ok(shown === shapes && judged === shapes,
      `فالأشكالُ كلُّها: ${shown}/${shapes} تُعرض من مساراتها و${judged}/${shapes} يُحكم عليها صواباً`);

    // ————— الخصوصية: صفرُ طلباتٍ في هذا كلِّه —————
    const cycle = netCalls.slice(netMark);
    ok(cycle.length === 0,
      '**صفرُ طلباتٍ شبكية** في كتابة الأشكال كلِّها — مسارُ الطفل لا يغادر جهازه'
      + `${cycle.length ? ' — ' + cycle.slice(0, 5).join('، ') : ''}`);
    const before = netCalls.length;
    try { await win.fetch('/manifest.webmanifest'); } catch { /* لا يهمّ ردُّه */ }
    ok(netCalls.length > before, 'والعدّادُ مجرَّبٌ سالباً: طلبٌ متعمَّد بعدها يُمسَك');

    ok(doc.documentElement.scrollWidth <= win.innerWidth + 1,
      `ولا فائضَ أفقيّ (${doc.documentElement.scrollWidth} ≤ ${win.innerWidth})`);
    ok(errors.length === 0,
      errors.length ? `أخطاءُ جافاسكربت: ${errors.join(' · ')}` : 'لا أخطاء جافاسكربت');
  } catch (e) {
    ok(false, `استثناء: ${e && e.message}`);
  }
  await send();
})();
</script>
</body>
</html>
