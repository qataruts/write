<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحصُ قشرة «اُكْتُبْ» — متصفّح حقيقي</title>
<!--
  **فحصُ القشرة على تطبيقٍ فارغ** (الجلسة ٠) — نظيرُ `browser_test.html` في اقرأ:
  صفحةُ قيادةٍ تسوق التطبيق في إطارٍ وترسل حصيلتَها إلى `POST /result`.

  والمقيسُ هنا معيارُ قبول الجلسة ٠ نفسُه: **يفتح من خادم ملفات بسيط بلا خطأ
  جافاسكربت واحد**. ومعه ما لا يصحّ أن يمرّ يوماً بلا فحص:
    · الخريطةُ تُرسَم، وعلامةُ «اُكْتُبْ» فيها بخطّها (لا خطّ نظام).
    · **الخريطةُ الفارغة تقول إنّها فارغة** ولا تصمت (فالصمتُ يُقرأ عطباً).
    · **أهدافُ اللمس ≥ ٦٤ بكسل** لفعل الشاشة الرئيس (`DESIGN §٤`).
    · لوحةُ وليّ الأمر خلف بوابتها الحسابية — لا تُفتح بنقرة طفل.
    · **صفرُ طلبٍ إلى مصدرٍ خارجيّ**: كلُّ ما يُجلَب من أصل التطبيق نفسِه.
    · الاتجاهُ RTL واللغةُ عربية، ولا فائضَ أفقيّ.

  ويُوسَّع في جلساته: فحصُ خصوصية القلم (صفر طلبات) في الجلسة ١، ومحطاتُ التهيئة
  في الجلسة ٤ — بصفحاتها لا بهذه.
-->
<style>
  body { font: 15px/1.7 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #log { padding: 1rem; white-space: pre-wrap; }
  iframe { width: 420px; height: 760px; border: 0; position: fixed; inset-inline-end: 0; top: 0; }
  .ok { color: #7ec97e; } .bad { color: #e08a80; }
</style>
</head>
<body>
<div id="log"></div>
<iframe id="app" src="/?dev=1"></iframe>
<script>
const results = [];
const log = document.getElementById('log');
const frame = document.getElementById('app');

/* ————— **حارسُ التعاقب** (الجلسة ٤ج — بلاغُ ميدان «احسب» الأول، `calc@ad59c56`) —————

   حرّاسُ البذرة كانوا **يعدّون التشغيلات ولا يقيسون التعاقب**: خمسةٌ وستون فحصاً أخضر
   عند احسب وأذنُ المالك تسمع صوتين معاً وثالثاً مقطوشاً. فيُبدَّل عنصرُ الصوت بشاهدٍ
   يسجّل **لحظتَي بدء كل تشغيلٍ وتمامه**، ومنهما يُحكَم: لا لحظةَ فيها صوتان معاً، ولا
   جملةً تُقطَع قبل تمامها إلا بإسكاتٍ مقصود، ولا انتقالاً يسبق تمامَ الكلام. */
/* **ومدّةُ الملفّ الوهميّ ٩٠٠ مللي** — فوق أطولِ مهلةٍ ثابتة كانت في شاشاتنا
   (`review.js` كان ينتقل بعد ٧٥٠ ويعيد بعد ٤٥٠، **وقد سقطتا في الجلسة ٥** فصار
   الانتقالُ ينتظر `ended`): بذلك يصير **العطبُ الأصليّ مرئياً للحارس** — من انتظر
   مهلةً بدل `ended` يقطع الجملةَ في منتصفها فيُقرأ «مقطوشاً»، ولولا ذلك لَمرّ. وتبقى
   المدّةُ على قدرها حارسةً لعودةِ المهلة يوماً.
   (والمهلةُ الأطولُ من المدّة يكشفها أخوه في `check_speech.mjs` بمدّتين مختلفتين.) */
/* **ونصوصُ القياس صارت من البنك بأعيانها** (الجلسة ٥): كانت حروفَ هجاءٍ مشكولةً لا
   ملفَّ لها — تُقاس بها المؤقّتاتُ وحدَها — فلمّا نُسخت أسماءُ الحروف من بنك اقرأ صار
   الطريقُ المقيسُ هو طريقَ الطفل نفسَه: مفتاحٌ في الفهرس فملفٌّ يُشغَّل، لا احتياطَ
   نطقٍ آليّ يلتفّ على الشاهد. */
let audioMs = 900;
const timeline = [];    // {key, doc, t0, t1} — لحظاتُ كل تشغيلٍ بالمللي، و`doc` نافذتُه
const failKeys = new Set();   // مفاتيحُ يتعثّر تحميلُها عمداً (فحصُ الاحتياط)

/** إغلاقُ ما بقي مفتوحاً — فلا فجوةٌ تُقرأ تراكباً على ما بعدها. */
const closeOpen = () => {
  for (const row of timeline) if (row.t1 === Infinity) row.t1 = performance.now();
};

/**
 * أزواجُ التشغيل المتقاطعة في مدىً من الزمن — «صوتان معاً» بحرفه.
 *
 * **والمقابلةُ داخلَ المستند الواحد** (درسُ احسب الثاني): صفحةُ الفحص ونافذةُ التطبيق
 * مستندان، ومستندٌ يُغادَر لا يموت لحظتَه — فتتقاطع مؤقّتاتُه مع أوّل جملةٍ في الوارد.
 * وذلك **نافذتان في اختبار لا صوتان في أذن طفل**، فلا يُقابَل صوتُ هذا بصوت ذاك،
 * **كي لا يحمرّ الحارسُ على الصواب**. وما داخل المستند الواحد يُقابَل كلُّه.
 */
const overlaps = (from = 0) => {
  const bad = [];
  for (const doc of new Set(timeline.map((r) => r.doc))) {
    const rows = timeline.filter((r) => r.doc === doc && r.t0 >= from).sort((a, b) => a.t0 - b.t0);
    for (let i = 1; i < rows.length; i++) {
      if (rows[i].t0 < rows[i - 1].t1 - 1) bad.push(`${rows[i - 1].key}+${rows[i].key}`);
    }
  }
  return bad;
};

/** يزرع الشاهدَ في نافذةٍ (صفحةُ الفحص أو نافذةُ التطبيق) — مرّةً واحدة لكلٍّ. */
function hookAudio(w, doc) {
  if (!w || w.__audioHooked) return;
  w.__audioHooked = true;
  w.Audio = class extends w.EventTarget {
    constructor(src = '') { super(); this.preload = ''; this.currentTime = 0; this.src = src; }
    set src(v) {
      this._src = v || '';
      this.__key = (String(this._src).split('/').pop() || '').split('?')[0].replace('.mp3', '');
    }
    get src() { return this._src; }
    play() {
      if (failKeys.has(this.__key)) {
        setTimeout(() => this.dispatchEvent(new w.Event('error')), 0);
        return Promise.reject(new Error('audio'));
      }
      this.__row = { key: this.__key, doc, t0: performance.now(), t1: Infinity };
      timeline.push(this.__row);
      this.__timer = setTimeout(() => {
        this.__close();
        this.dispatchEvent(new w.Event('ended'));
      }, audioMs);
      return Promise.resolve();
    }
    /** الإسكاتُ يُنهي المدى فعلاً (لا يبقى مفتوحاً فيُقرأ تراكباً على ما بعده). */
    __close() {
      clearTimeout(this.__timer);
      if (this.__row && this.__row.t1 === Infinity) this.__row.t1 = performance.now();
    }
    pause() { this.__close(); }
    load() {}
    removeAttribute() { this.src = ''; }
  };
}
const APP_DOC = 'تطبيق';   // نافذةُ الطفل · وصفحةُ الفحص نافذةٌ أخرى لا تُقابَل بها
hookAudio(window, 'قياس');

function ok(cond, msg) {
  results.push({ ok: !!cond, msg });
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'bad';
  line.textContent = (cond ? '✓ ' : '✗ ') + msg;
  log.append(line);
}

/** أخطاءُ الإطار تُلتقط من هنا: خطأٌ واحد يُسقِط الفحص — وهو عهدُ الجلسة ٠. */
const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// **وتقريرُنا مبصومٌ باسمنا** (`calc@16c37dc`): جارٌ في مساحة العمل قد يسبق إلى
// المنفذ، فيُهمِل خادمُنا كلَّ حمولةٍ بلا هذه البصمة — ولا يُقرأ تقريرُ جارٍ تقريرَنا.
const send = () => fetch('/result', {
  method: 'POST', body: JSON.stringify({ from: 'write', rows: results }),
});

(async () => {
  try {
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    hookAudio(win, APP_DOC);           // شاهدُ الصوت في نافذة الطفل — قبل أن تنطق شاشة
    win.addEventListener('error', (e) => errors.push(String(e.message)));
    win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    await wait(1200);

    // ————— ١) القشرة تُرسم —————
    ok(doc.documentElement.lang === 'ar' && doc.documentElement.dir === 'rtl',
      'الصفحة عربيةٌ واتجاهها من اليمين (lang=ar · dir=rtl)');
    ok(!doc.querySelector('.boot'), 'وقد استُبدل سطرُ «يُحمَّل التطبيق…» بالشاشة');
    ok(doc.querySelector('main.map'), 'والخريطةُ مرسومةٌ في الصفحة');

    const brand = doc.querySelector('.brand .brand-word');
    ok(brand && brand.textContent === 'اُكْتُبْ', 'وعلامةُ «اُكْتُبْ» في ترويستها');
    // **يُسأل اللوحُ لا الذاكرة** (دَينٌ أُدّي في هـ٢): كان اسمُ الخطّ مكتوباً هنا، فيومَ
    // يُبدَّل خطُّ العلامة يصير الحارسُ يحرس مهجوراً ويمرّ أخضرَ على علامةٍ بلا خطّها.
    // فالمطلوبُ أن يصل **ما يعلنه `--font-brand`** إلى الكلمة فعلاً على الشاشة.
    const family = brand ? win.getComputedStyle(brand.parentElement).fontFamily : '';
    const declared = win.getComputedStyle(doc.documentElement)
      .getPropertyValue('--font-brand').split(',')[0].trim().replace(/^['"]|['"]$/g, '');
    ok(Boolean(declared) && family.split(',')[0].replace(/^['"]|['"]$/g, '') === declared,
      `وبخطّ العلامة الذي يعلنه اللوح لا خطّ النظام (${declared} ⇐ ${family.split(',')[0]})`);

    // ————— ٢) الخريطةُ الفارغة تقول إنّها فارغة —————
    const notes = [...doc.querySelectorAll('main.map .note')].map((n) => n.textContent);
    const stations = doc.querySelectorAll('main.map .station').length;
    ok(stations > 0 || notes.some((t) => t.includes('لا محطةَ في الرحلة بعدُ')),
      stations > 0 ? `والرحلةُ فيها ${stations} محطة`
        : 'ولا محطةَ بعدُ — والخريطةُ تقول ذلك نصّاً (لا تصمت)');

    // ————— ٣) أهدافُ اللمس ≥ ٦٤ بكسل لفعل الشاشة الرئيس (DESIGN §٤) —————
    const parentBtn = doc.querySelector('.topbar .btn--ghost');
    const box = parentBtn ? parentBtn.getBoundingClientRect() : { width: 0, height: 0 };
    ok(box.height >= 44 && box.width >= 44,
      `وزرُّ لوحة وليّ الأمر هدفُ لمسٍ مقبول (${Math.round(box.width)}×${Math.round(box.height)})`);

    // ————— ٤) لا فائضَ أفقيّ (DESIGN §٤: الصفحة لا تُمرَّر أفقياً أبداً) —————
    ok(doc.documentElement.scrollWidth <= win.innerWidth + 1,
      `ولا فائضَ أفقيّ (${doc.documentElement.scrollWidth} ≤ ${win.innerWidth})`);

    // ————— ٥) لوحةُ وليّ الأمر خلف بوابتها الحسابية —————
    win.location.hash = '#/parent';
    await wait(600);
    const gate = frame.contentDocument.querySelector('.gate .gate-go');
    ok(!!gate, 'ولوحةُ وليّ الأمر خلف بوابةٍ حسابية — لا تُفتح بنقرة طفل');
    ok(!frame.contentDocument.querySelector('.audit'),
      'ولا شيءَ من اللوحة مرسومٌ قبل عبورها');

    // ————— ٦) صفرُ مصدرٍ خارجيّ (خصوصيةٌ بنيوية) —————
    const external = win.performance.getEntriesByType('resource')
      .map((e) => e.name)
      .filter((u) => !u.startsWith(win.location.origin) && !u.startsWith('data:') && !u.startsWith('blob:'));
    ok(external.length === 0,
      `وكلُّ ما جُلب من أصل التطبيق نفسِه (${external.length ? external.join('، ') : 'صفرُ مصدرٍ خارجيّ'})`);

    // ————— ٧) تعاقبُ الصوت: صوتٌ واحدٌ في الجوّ، والانتقالُ بعد تمامه —————
    //
    // **والقناةُ تُقاس في متصفّحٍ حقيقيّ بمؤقّتاته** — لا بمحاكاةٍ في node (تلك في
    // `check_speech.mjs`، وهما أخوان): تُستورَد `js/audio.js` نفسُها في هذه الصفحة
    // وتُساق بشاهد الصوت أعلاه بمؤقّتات المتصفّح لا بمحاكاةٍ.
    const audio = await import('/js/audio.js');
    const seqFrom = performance.now();

    // أ) نداءان في اللحظة نفسِها — وهو عينُ ما وقع في ميدان احسب
    const both = await Promise.all([audio.play('أَلِف'), audio.play('باء')]);
    const rows = timeline.filter((r) => r.t0 >= seqFrom);
    const cut = rows.filter((r) => r.t1 - r.t0 < audioMs * 0.9);
    ok(rows.length === 2 && cut.length === 0 && both.every((h) => h === true),
      `نداءان في اللحظة نفسِها يُسمَعان **تامَّين بالتتابع** (${rows.length} جملةً، `
      + `أقصرُها ${rows.length ? Math.round(Math.min(...rows.map((r) => r.t1 - r.t0))) : 0}ms `
      + `من ${audioMs})${cut.length ? ` — **مقطوشٌ: ${cut.map((r) => r.key).join('، ')}**` : ''}`);
    // **ولا يُقرأ «لا تراكبَ» من لا شيء**: الشرطُ مادّةٌ مقيسةٌ **ثم** خلوُّها من التقاطع —
    // فمَن أطلق ولم ينتظر يرجع قبل أن يبدأ صوتٌ، فيقيس الحارسُ صفراً ويقول «سليم».
    // (أمسك هذا الحارسُ نفسَه يومَ جُرّب سالباً: كان يخضرّ على صفر.)
    ok(rows.length === 2 && overlaps(seqFrom).length === 0,
      `ولا لحظةَ فيها صوتان يعملان معاً (${rows.length} جملةً مقيسة)${overlaps(seqFrom).length
        ? ` — **تراكب: ${overlaps(seqFrom).join('، ')}**` : ''}`);

    // ب) **وعدُ `play` يتمّ بتمام الكلام** — به تنتظر الشاشةُ قبل أن تنتقل
    const waitFrom = performance.now();
    await audio.play('ميم');
    const moved = performance.now();
    const line = timeline.find((r) => r.t0 >= waitFrom);
    ok(line && moved >= line.t1 && line.t1 - line.t0 >= audioMs * 0.9,
      `ووعدُ \`play\` **يتمّ بتمام الكلام** لا بمهلةٍ ثابتة: سُمع `
      + `${line ? Math.round(line.t1 - line.t0) : '؟'}ms من ${audioMs}، وعاد بعد تمامه بـ`
      + `${line ? Math.round(moved - line.t1) : '؟'}ms`);

    // ج) الإسكاتُ يُفرغ الطابور ولا يعطّله (نقرةُ الطفل الناقلة)
    const mark = timeline.length;
    const dropped = [audio.play('دال'), audio.play('هاء')];
    audio.stop();
    await Promise.all(dropped);
    ok(timeline.length === mark,
      `والإسكاتُ يُفرغ الطابور: ما صُفّ قبله لا يُشغَّل بعده (${timeline.length - mark} تشغيلاً بعده)`);
    await audio.play('واو');
    ok(timeline.length === mark + 1, 'والقناةُ تعمل بعد الإسكات (إفراغٌ لا تعطيل)');

    // د) **الاحتياطُ عند تعثّر الملف مهلةٌ محسوبة لا تجميد**: القناةُ تمضي ولا تقف
    failKeys.add(audio.keyFor('سين'));
    const stuckFrom = performance.now();
    const raced = await Promise.race([
      audio.play('سين').then(() => 'مضت'),
      wait(9000).then(() => 'تجمّدت'),
    ]);
    const stuckMs = performance.now() - stuckFrom;
    // **والمقدارُ شرطٌ كالمضيّ**: «مهلةٌ محسوبة» لا تعني رجوعاً فورياً — من رجع في
    // صفرٍ لم ينتظر شيئاً، وهو العطبُ نفسُه لا علاجُه.
    ok(raced === 'مضت' && stuckMs >= audio.estimateMs('سين') * 0.4,
      `وملفٌّ يتعثّر **يمضي بمهلةٍ محسوبة لا يجمّد القناة ولا يدهسها** `
      + `(${Math.round(stuckMs)}ms، والحدُّ المقدَّر ${audio.estimateMs('سين')}ms)`);
    failKeys.clear();

    // هـ) **وعلى مسار الطفل نفسِه**: نافذةُ التطبيق — لا لحظةَ فيها صوتان معاً.
    //     ولا شاشةَ ناطقةً بعد (الجلسة ٥ أولاها)، **فالحكمُ يستيقظ من تلقائه**:
    //     يومَ تُشغَّل أوّلُ جملةٍ في نافذة التطبيق يصير هذا السطرُ قياساً حقيقياً.
    closeOpen();
    const appRows = timeline.filter((r) => r.doc === APP_DOC);
    const myRows = timeline.length - appRows.length;
    const clashes = overlaps(0).length;
    // **والجملُ المقصودةُ تُعَدّ**: أربعٌ يجب أن تُسمَع في هذا القسم (أَلِفْ · بَاءْ · جِيمْ ·
    // وَاوْ) — ودَالْ وهَاءْ أُسقطتا بالإسكات عمداً، وزَايْ تعثّرت عمداً. فمن قاس أقلَّ
    // منها لم يقس القناةَ أصلاً، **ولا يُقرأ خلوُّه من التراكب سلامة**.
    ok(myRows >= 4 && clashes === 0,
      `ولا لحظةَ في الرحلة كلِّها يعمل فيها صوتان معاً (${appRows.length} تشغيلاً في نافذة الطفل`
      + `${appRows.length ? '' : ' — لا شاشةَ ناطقةً بعد، والقياسُ يستيقظ يومَ تنطق أولاها'}`
      + `، و${myRows} في قياس القناة)`
      + (clashes ? ` — **تراكب: ${overlaps(0).slice(0, 3).join('، ')}**` : ''));

    // ————— ٨) إشعارُ القشرة الجديدة: لا يقطع تمريناً ولا يحجب —————
    //
    // **ويُقاس حيّاً لا نصّاً**: تُنتظَر ولايةُ عامل الخدمة، ثم **تُعاد الصفحة**
    // كي يكون لها متولٍّ سابق (فأوّلُ تسجيلٍ تثبيتٌ لا تحديث ولا يُشعَر به)، ثم
    // يُطلَق `controllerchange` كما يُطلقه المتصفّح يومَ تتبدّل القشرةُ تحت الطفل.
    let swWin = win;
    let swDoc = doc;
    /**
     * **والمهلةُ تُشتقّ من طول العمل لا رقماً واحداً للجميع** (قاعدةُ العائلة نفسُها
     * التي رُفعت في مهلة الحظيرة): `install` يخزن **بنكَ الصوت كلَّه** قبل
     * `skipWaiting`، فلا متولّيَ قبل أن يتمّ. وكان الحدُّ ست ثوانٍ سُنَّت يومَ كان
     * البنكُ ١٤١ ملفاً، **فلمّا صار ٧٥٩ قُرئت بطءُ التخزين عطباً في الإشعار** وهي
     * مهلةٌ قصيرة. فيُقرأ عددُ البنك من فهرسه ويُشتقّ منه الحدّ — **فبنكٌ يكبر غداً
     * يوسّع مهلتَه من نفسه بلا سطرٍ يُعدَّل**.
     */
    const bankSize = await fetch('/audio/manifest.json')
      .then((r) => r.json()).then((m) => Object.keys(m).length).catch(() => 0);
    const CEILING = Math.max(30, Math.ceil(bankSize / 8));   // ×200ms
    const controlled = async () => {
      const t0 = Date.now();
      for (let i = 0; i < CEILING && !swWin.navigator.serviceWorker?.controller; i++) await wait(200);
      waited = Date.now() - t0;
      return Boolean(swWin.navigator.serviceWorker?.controller);
    };
    let waited = 0;
    if (!(await controlled())) {
      ok(false, `لم يستولِ عاملُ الخدمة على الصفحة خلال ${Math.round(CEILING * 0.2)}ث`
        + ` (بنكٌ ${bankSize} ملفاً) — لا يُقاس الإشعارُ بلا قشرةٍ متولّية`);
    } else {
      ok(true, `تولّى عاملُ الخدمة الصفحة بعد ${(waited / 1000).toFixed(1)}ث`
        + ` — والحدُّ مشتقٌّ من بنكٍ فيه ${bankSize} ملفاً (${Math.round(CEILING * 0.2)}ث)`);
      swWin.location.reload();
      await new Promise((r) => frame.addEventListener('load', r, { once: true }));
      swWin = frame.contentWindow;
      swDoc = frame.contentDocument;
      hookAudio(swWin, APP_DOC);
      swWin.addEventListener('error', (e) => errors.push(String(e.message)));
      swWin.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
      await wait(1200);

      const toastEl = () => swDoc.getElementById('toast');
      const shown = () => (toastEl() && !toastEl().hidden ? toastEl().textContent : '');
      const fireChange = () =>
        swWin.navigator.serviceWorker.dispatchEvent(new swWin.Event('controllerchange'));

      // (أ) **وهو في محطةٍ يكتب**: الإشعارُ يُؤجَّل ولا يقطع
      const node = swDoc.querySelector('main.map .station a[href^="#/"], main.map .station button');
      swWin.location.hash = '#/warmup/lines-h';
      await wait(700);
      ok(!swDoc.querySelector('main.map'), 'الطفلُ في محطةٍ لا في الخريطة (تهيئةُ اليد)');
      fireChange();
      await wait(300);
      ok(!shown().includes('وصل تحديث'),
        'وقشرةٌ جديدة تصل وهو يكتب: **لا تقطع تمرينَه** — الإشعارُ يُؤجَّل');

      // (ب) **وحين يعود إلى خريطته**: يُقال له، بلا حجب
      swWin.location.hash = '#/';
      await wait(700);
      ok(shown().includes('وصل تحديث'),
        `ثم يُقال له عند عودته إلى الخريطة («${shown().trim()}»)`);
      const blockers = swDoc.querySelectorAll('dialog[open], .overlay, .modal').length;
      ok(blockers === 0 && toastEl().querySelectorAll('button').length === 0,
        'وهو شريطٌ عابر: لا طبقةَ تحجب الشاشة، ولا زرَّ يُنقَر، ولا إعادةَ تحميلٍ تُفرض');
      ok(Boolean(swDoc.querySelector('main.map')),
        'والخريطةُ تحته تعمل كما هي — الشاشةُ لم تُقطَع ولم تُستبدَل');
      if (node) { /* عقدةُ الخريطة قُرئت للتوثيق لا للنقر */ }
    }

    // ————— ٩) وأخيراً: لا خطأ جافاسكربت واحد —————
    swWin.location.hash = '#/';
    await wait(500);
    ok(errors.length === 0,
      errors.length ? `أخطاءُ جافاسكربت: ${errors.join(' · ')}` : 'لا أخطاء جافاسكربت');
  } catch (e) {
    ok(false, `استثناء: ${e && e.message}`);
  }
  await send();
})();
</script>
</body>
</html>
