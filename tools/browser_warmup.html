<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>محطاتُ التهيئة الحركية على الشاشة — «اُكْتُبْ» الجلسة ٤</title>
<!--
  **معيارُ قبول الجلسة ٤ بحرفه، مقيساً في متصفّحٍ حقيقي**: «فحصُ متصفّحٍ **يعبر
  المحطات الست**» و«أهدافُ اللمس ≥ ٦٤ بكسل».

  و`tools/test_warmup.mjs` يُدخِل الأشكالَ على `judge` في node — وهذا يقول ما لا
  يقوله node:
    · أنّ **إصبعاً حقيقياً** (أحداثُ مؤشّرٍ على اللوح) يعبر المحطات الستّ **واحدةً
      بعد أخرى بالقفل التسلسليّ نفسِه**: لا تُفتَح محطةٌ حتى تُتمّ التي قبلها.
    · وأنّ **القياس يُكتب فعلاً على الجهاز**: نجومٌ في مخزن التقدّم، وأخطاءُ اتجاهٍ
      بأسمائها — **ولا مهارةَ واحدة في ليتنر** (إعفاءُ التهيئة مقيساً لا مُدَّعىً).
    · وأنّ **الانحرافَ إرشادٌ لا رفض**: دورانٌ معكوسٌ على الدائرة يومض ولا يُخرج
      الطفلَ من الشاشة، ثم يُقبَل حين يُكتب صحيحاً.
    · 🔒 وأنّ الدورةَ كلَّها بـ**صفر طلباتٍ شبكية** — مسارُ الطفل لا يغادر جهازه.
-->
<style>
  body { font: 15px/1.7 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #log { padding: 1rem; white-space: pre-wrap; }
  iframe { width: 460px; height: 900px; border: 0; position: fixed; inset-inline-end: 0; top: 0; }
  .ok { color: #7ec97e; } .bad { color: #e08a80; }
</style>
</head>
<body>
<div id="log"></div>
<iframe id="app" src="/"></iframe>
<script type="module">
const results = [];
const log = document.getElementById('log');
const frame = document.getElementById('app');

function ok(cond, msg) {
  results.push({ ok: !!cond, msg });
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'bad';
  line.textContent = (cond ? '✓ ' : '✗ ') + msg;
  log.append(line);
}

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const send = () => fetch('/result', { method: 'POST', body: JSON.stringify(results) });

// عدّادُ أبواب الخروج من الجهاز (نظيرُ `browser_pen.html` و`browser_paths.html`)
const netCalls = [];
function watchNetwork(win) {
  const realFetch = win.fetch.bind(win);
  win.fetch = (input, init) => {
    netCalls.push(`fetch:${input && input.url ? input.url : input}`);
    return realFetch(input, init);
  };
  const realOpen = win.XMLHttpRequest.prototype.open;
  win.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    netCalls.push(`xhr:${url}`);
    return realOpen.call(this, method, url, ...rest);
  };
  Object.defineProperty(win.navigator, 'sendBeacon', {
    configurable: true, value: (url) => { netCalls.push(`beacon:${url}`); return false; },
  });
  win.WebSocket = class { constructor(url) { netCalls.push(`ws:${url}`); } };
  win.EventSource = class { constructor(url) { netCalls.push(`sse:${url}`); } };
}

(async () => {
  try {
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener('error', (e) => errors.push(String(e.message)));
    win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win);
    await wait(700);

    const { WARMUPS } = await import('/js/warmups.js');
    const parts = Object.keys(WARMUPS);
    ok(parts.length > 0, `محطاتُ التهيئة في التطبيق: ${parts.length} (${parts.join('، ')})`);

    // ————— إصبعٌ على اللوح —————
    let pointerId = 1;
    const surfaceEl = () => doc.querySelector('.pen-surface');
    const toClient = ([x, y]) => {
      const rect = surfaceEl().getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);
      return {
        clientX: rect.left + (rect.width - size) / 2 + (x / 1000) * size,
        clientY: rect.top + (rect.height - size) / 2 + (y / 1000) * size,
      };
    };
    const fire = (type, point, id) => {
      surfaceEl().dispatchEvent(new win.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        pointerId: id, pointerType: 'touch', isPrimary: true, ...toClient(point),
      }));
    };
    async function writeStroke(points) {
      const id = ++pointerId;
      fire('pointerdown', points[0], id);
      for (const p of points.slice(1)) fire('pointermove', p, id);
      await wait(40);
      fire('pointerup', points[points.length - 1], id);
      await wait(60);
    }
    /** يدُ طفلٍ مصنوعة: تمشي على المسار المرجعيّ نفسِه (وتعكسه إن طُلب). */
    const hand = (points, back) => (back ? [...points].reverse() : points);
    async function writeShape(ref, back) {
      for (const stroke of ref.strokes) await writeStroke(hand(stroke.points, back));
    }

    const stored = () => {
      try { return JSON.parse(win.localStorage.getItem('uktub.progress.v1') || '{}'); }
      catch { return {}; }
    };
    const nodeOf = (part) => Object.keys(stored().stars || {}).find((id) => id.endsWith(`:${part}`));

    // ————— المحطاتُ الستّ بالقفل التسلسليّ —————
    const netMark = netCalls.length;
    let crossed = 0;
    let firstStation = true;

    for (const part of parts) {
      win.location.hash = `#/warmup/${encodeURIComponent(part)}`;
      await wait(500);
      const board = surfaceEl();
      if (!board) {
        ok(false, `${part}: لا لوحَ على الشاشة — أمقفلةٌ المحطةُ وقد أُتمّ ما قبلها؟`);
        continue;
      }

      // **النموذجُ من الشكل نفسِه**: عددُ خطوط النموذج عددُ أجزاء الشكل الأول
      const shapes = WARMUPS[part].shapes;
      const drawn = doc.querySelectorAll('.pen-stroke--trail').length;
      ok(drawn === shapes[0].ref.strokes.length,
        `${part}: اللوحُ يرسم نموذجَ شكله الأول (${drawn} جزءاً)`);

      // **ممرُّ السماحة يُرسم حيث تملكه المحطة**: `bounds` في بيان الشكل
      const fenced = doc.querySelectorAll('.pen-fence').length > 0;
      ok(fenced === Boolean(shapes[0].bounds),
        `${part}: ممرُّ الحدود ${shapes[0].bounds ? 'مرسومٌ كما تعلنه المحطة' : 'غيرُ مرسوم — ولا تعلنه'}`);

      // **أهدافُ اللمس ≥ ٦٤ بكسل لفعل الشاشة** (`DESIGN §٤`)
      const acts = [...doc.querySelectorAll('main.warmup .foot .btn')];
      const small = acts.filter((b) => b.getBoundingClientRect().height < 64);
      ok(acts.length >= 2 && small.length === 0,
        `${part}: أفعالُ الشاشة (${acts.length}) هدفُ لمسٍ ≥ ٦٤ بكسل`
        + (small.length ? ` — دونها: ${small.map((b) => Math.round(b.getBoundingClientRect().height)).join('، ')}` : ''));

      // **الانحرافُ إرشادٌ لا رفض** (مرّةً واحدة، في أوّل محطة): يُكتب الشكلُ الأول
      // معكوساً فلا يُقبَل ولا تُغلَق الشاشة، ثم يُكتب صحيحاً فيُقبَل.
      if (firstStation) {
        firstStation = false;
        await writeShape(shapes[0].ref, true);
        await wait(200);
        const stillHere = Boolean(surfaceEl());
        const noStars = !(stored().stars || {})[nodeOf(part) || ''];
        ok(stillHere && noStars,
          `${part}: المعكوسُ لا يُقبَل **ولا يُخرِج الطفلَ من الشاشة** — إرشادٌ لا رفض`);
        const faults = Object.keys(stored().faults || {});
        ok(faults.some((k) => k.startsWith(`${part}|`)),
          `${part}: وخطؤه سُجِّل باسمه (${faults.join('، ') || 'لا شيء'}) — عدّادُ أخطاء الاتجاه`);
      }

      for (const shape of shapes) {
        await writeShape(shape.ref, false);
        await wait(560);            // لحظةُ الانتقال إلى الشكل التالي
      }

      const stars = doc.querySelectorAll('main.warmup .big-stars .on').length;
      const saved = (stored().stars || {})[nodeOf(part) || ''] || 0;
      ok(stars > 0 && saved === stars,
        `${part}: أُتمّت — ${stars} نجومٍ على الشاشة و${saved} في مخزن التقدّم`);
      if (saved > 0) crossed++;
    }

    ok(crossed === parts.length,
      `**والمحطاتُ الستّ عُبرت كلُّها بالقفل التسلسليّ** (${crossed}/${parts.length})`);

    // ————— القياس: نجومٌ وأخطاءُ اتجاه، ولا ليتنر —————
    const state = stored();
    const faults = Object.entries(state.faults || {});
    ok(faults.length > 0,
      `وأخطاءُ الاتجاه مكتوبةٌ بأسمائها: ${faults.map(([k, v]) => `${k}×${v.n}`).join('، ')}`);
    ok(Object.keys(state.skills || {}).length === 0,
      '**ولا مهارةَ واحدة في ليتنر** — التهيئةُ معفاةٌ بعلّتها المكتوبة (وحداتُها ليست حروفاً)'
      + (Object.keys(state.skills || {}).length ? ` — كُتب: ${Object.keys(state.skills).join('، ')}` : ''));
    ok(faults.every(([key]) => !/[0-9]/.test(key.split('|')[1] || '')),
      'وما كُتب اسمُ الخطأ لا إحداثيُّ يد — مسارُ الطفل لا يُخزَّن');

    // ————— الخريطة: النجومُ عليها والمحطةُ التالية مفتوحة —————
    win.location.hash = '#/';
    await wait(600);
    const done = doc.querySelectorAll('main.map .station--warmup .node--done').length;
    ok(done === parts.length,
      `والخريطةُ تُظهر المحطات المنجَزة (${done}/${parts.length})`);
    const next = doc.querySelector('main.map [data-next]');
    ok(Boolean(next), 'و«تابع من هنا» انتقل إلى ما بعد التهيئة — القفلُ التسلسليّ يمشي');

    // ————— الخصوصية والسلامة —————
    const cycle = netCalls.slice(netMark);
    ok(cycle.length === 0,
      '🔒 **صفرُ طلباتٍ شبكية** في المحطات الستّ كلِّها — مسارُ الطفل لا يغادر جهازه'
      + `${cycle.length ? ' — ' + cycle.slice(0, 5).join('، ') : ''}`);
    const before = netCalls.length;
    try { await win.fetch('/manifest.webmanifest'); } catch { /* لا يهمّ ردُّه */ }
    ok(netCalls.length > before, 'والعدّادُ مجرَّبٌ سالباً: طلبٌ متعمَّد بعدها يُمسَك');

    ok(doc.documentElement.scrollWidth <= win.innerWidth + 1,
      `ولا فائضَ أفقيّ (${doc.documentElement.scrollWidth} ≤ ${win.innerWidth})`);
    ok(errors.length === 0,
      errors.length ? `أخطاءُ جافاسكربت: ${errors.join(' · ')}` : 'لا أخطاء جافاسكربت');
  } catch (e) {
    ok(false, `استثناء: ${e && e.message}`);
  }
  await send();
})();
</script>
</body>
</html>
