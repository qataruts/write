<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خصوصيةُ القلم ودورةُ كتابةٍ كاملة — «اُكْتُبْ» الجلسة ١</title>
<!--
  **حارسُ الخصوصية المتصفّحيّ** (`METHOD.md §٣.٧`، بند الجلسة ١/٤):

  الحارسُ النصيّ (`tools/test_pen.mjs §١`) يقول: لا `fetch` في ملفٍّ يمرّ به مسارُ
  الطفل. وهذا يقول ما لا يقوله نصّ: **صفرُ طلباتٍ شبكية في دورة كتابةٍ كاملة** —
  من أول نزول إصبعٍ إلى آخر حكم — مقيسةً على المتصفّح نفسِه، بأدواتٍ مزروعة على
  الإطار (`fetch`/XHR/beacon/WebSocket/SSE) وبسجلّ موارد الصفحة.

  **وهو مجرَّبٌ سالباً في آخره**: يُطلَق طلبٌ متعمَّد بعد إغلاق نافذة القياس فيُمسِكه
  العدّاد — فلو كان الحارسُ أعمى لَما مرّ هذا. حارسٌ لا يُجرَّب ليس حارساً.

  ومعه ما لا يصحّ أن يمرّ بلا فحص في محرّكٍ يرثه «أَتْقِنْ»:
    · كتابةٌ صحيحة تُقبَل، ومعكوسةٌ تُرفَض — على الشاشة لا في node وحدها.
    · **الإخفاقُ إرشادٌ لا رفض**: حبرُ الطفل يظهر في المحاولة المخطئة، ثم تومض
      نقطةُ البداية — ولا شاشةَ «خطأ» ولا مؤقّت ولا رقمٌ يُحصي عليه.
    · **تجاهلُ لمس الكفّ** (ق٤): لمسةٌ أثناء القلم لا تكتب شيئاً.
    · المسارُ يتلوّن تحت القلم (مؤشّرُ التقدّم الحركيّ، `METHOD.md §٥`).
    · لا خطأ جافاسكربت واحد، ولا فائضَ أفقيّ، ولا مصدرَ خارجيّ.
-->
<style>
  body { font: 15px/1.7 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #log { padding: 1rem; white-space: pre-wrap; }
  iframe { width: 460px; height: 900px; border: 0; position: fixed; inset-inline-end: 0; top: 0; }
  .ok { color: #7ec97e; } .bad { color: #e08a80; }
</style>
</head>
<body>
<div id="log"></div>
<iframe id="app" src="/?dev=1#/pen"></iframe>
<script type="module">
const results = [];
const log = document.getElementById('log');
const frame = document.getElementById('app');

function ok(cond, msg) {
  results.push({ ok: !!cond, msg });
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'bad';
  line.textContent = (cond ? '✓ ' : '✗ ') + msg;
  log.append(line);
}

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const send = () => fetch('/result', { method: 'POST', body: JSON.stringify(results) });

// ————— حارسُ الشبكة على الإطار: كلُّ باب خروجٍ من الجهاز يُعدّ —————
const netCalls = [];
function watchNetwork(win) {
  const realFetch = win.fetch.bind(win);
  win.fetch = (input, init) => {
    netCalls.push(`fetch:${input && input.url ? input.url : input}`);
    return realFetch(input, init);
  };
  const realOpen = win.XMLHttpRequest.prototype.open;
  win.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    netCalls.push(`xhr:${url}`);
    return realOpen.call(this, method, url, ...rest);
  };
  Object.defineProperty(win.navigator, 'sendBeacon', {
    configurable: true, value: (url) => { netCalls.push(`beacon:${url}`); return false; },
  });
  win.WebSocket = class { constructor(url) { netCalls.push(`ws:${url}`); } };
  win.EventSource = class { constructor(url) { netCalls.push(`sse:${url}`); } };
}

/** موردٌ حمّلته الصفحةُ فعلاً — الشاهدُ الذي لا يمرّ من فوق الدوالّ المزروعة. */
const resources = (win) => win.performance.getEntriesByType('resource').map((e) => e.name);

(async () => {
  try {
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener('error', (e) => errors.push(String(e.message)));
    win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    watchNetwork(win);
    await wait(900);

    // **المسارُ حرفٌ حقيقيّ** (الجلسة ٢): صارت صفحةُ التجربة تعرض حروفَ المنهج،
    // فيُختار منها **منقوطٌ** لتكتمل الدورةُ جسماً ثم نقطة (وهي عينُ الشرط الرابع).
    // **والاختيارُ قبل التقاط اللوح**: النقرُ على حرفٍ يعيد بناءَ اللوح، فلوحٌ التُقط
    // قبله يبقى في يد الفاحص وقد نُزع من الشاشة — فتذهب ضرباتُه إلى لوحٍ لا يراه أحد.
    const { PATHS } = await import('/js/paths.js');
    const dotted = Object.keys(PATHS).find((ch) => PATHS[ch].isolated.dots.length);
    [...doc.querySelectorAll('.dev-row .btn')].find((b) => b.textContent.trim() === dotted)?.click();
    await wait(150);
    const ref = PATHS[dotted].isolated;
    const body = ref.strokes.map((s) => s.points);
    const dot = ref.dots[0].at;

    const surface = doc.querySelector('.pen-surface');
    ok(!!surface, 'صفحةُ تجربة المحرّك مفتوحةٌ وفيها لوحُ الكتابة');
    if (!surface) throw new Error('لا لوحَ على الشاشة');

    const box = surface.getBoundingClientRect();
    ok(Math.abs(box.width - box.height) <= 2 && box.width >= 240,
      `واللوحُ مربّعٌ بمقاسٍ يكفي يدَ طفل (${Math.round(box.width)}×${Math.round(box.height)})`);
    ok(win.getComputedStyle(surface).touchAction === 'none',
      'ولمسُه كتابةٌ لا تمريرٌ للصفحة (touch-action: none)');

    // **وما يُكتَب هو ما يُعرَض**: طولُ خطّ النموذج على الشاشة عينُ طول المسار الذي
    // تُكتب به الدورةُ — فلا يفترق المفحوصُ عن المعروض («النموذجُ هو المقياس»).
    const span = (pts) => pts.reduce((sum, p, i) => (i
      ? sum + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);
    const drawn = [...surface.querySelectorAll('.pen-stroke--trail')];
    ok(drawn.length === body.length
      && drawn.every((t, i) => Math.abs(Number(t.getAttribute('stroke-dasharray')) - span(body[i])) < 1)
      && surface.querySelectorAll('.pen-dot').length === ref.dots.length,
      `والحرفُ المعروض «${dotted}» بنقطته — والنموذجُ المرسوم عينُ مساره`);

    // ————— محاكاةُ يدٍ تكتب: من الشبكة المعيارية إلى إحداثيات الشاشة —————
    let pointerId = 1;
    const toClient = ([x, y]) => {
      const rect = surface.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);
      return {
        clientX: rect.left + (rect.width - size) / 2 + (x / 1000) * size,
        clientY: rect.top + (rect.height - size) / 2 + (y / 1000) * size,
      };
    };
    const fire = (type, point, type_ = 'touch', id = pointerId) => {
      surface.dispatchEvent(new win.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        pointerId: id, pointerType: type_, isPrimary: true, ...toClient(point),
      }));
    };
    async function writeStroke(points, kind = 'touch') {
      pointerId++;
      fire('pointerdown', points[0], kind);
      for (const p of points.slice(1)) { fire('pointermove', p, kind); }
      await wait(60);                                  // إطارٌ أو إطاران لِـrAF
      fire('pointerup', points[points.length - 1], kind);
      await wait(60);
    }


    // ————— نافذةُ القياس تُفتح هنا: دورةُ كتابةٍ كاملة —————
    const netMark = netCalls.length;
    const resMark = resources(win).length;

    // ١) محاولةٌ معكوسة: تُرفَض، ويظهر حبرُها، ويومض الإرشاد — ولا شاشةَ خطأ
    await writeStroke([...body[0]].reverse());
    const wrongInk = doc.querySelector('.pen-ink .pen-line');
    ok(wrongInk && (wrongInk.getAttribute('d').match(/L/g) || []).length >= 8,
      `المحاولةُ المخطئة **يظهر حبرُها** تحت الإصبع — لا تُمنَع اليدُ من الكتابة`
      + ` (${wrongInk ? (wrongInk.getAttribute('d').match(/L/g) || []).length : 0} نقطة)`);
    ok(wrongInk && wrongInk.classList.contains('pen-line--fade'),
      'ثم يخفت حبرُها ويذهب — لا يُمحى تحت اليد ولا يبقى فيلتبس بالصواب');
    ok(doc.querySelector('.pen-box--hint'),
      'ويومض الإرشادُ في لحظته: نقطةُ البداية وسهمُ الاتجاه');
    // **وما يقرؤه الطفلُ وحدَه هو المقيس**: لوحُ المطوّر (`?dev=1`) وأزرارُه يُنزَعان
    // من النصّ قبل الحكم، وإلا لَمرّ الفحصُ بسببهما لا بسبب الشاشة.
    const childText = (() => {
      const copy = doc.querySelector('main').cloneNode(true);
      for (const el of copy.querySelectorAll('.dev-readout, .dev-row, .dev')) el.remove();
      return copy.textContent;
    })();
    ok(!/خطأ|أخطأت|حاول مرّة أخرى|غلط|صواب/.test(childText),
      'ولا كلمةَ لومٍ ولا «خطأ» فيما يقرؤه الطفل — الإخفاقُ إرشادٌ لا رفض');
    const readout = doc.querySelector('.dev-readout');
    ok(readout && /start-end|reverse/.test(readout.textContent),
      `والخطأُ يُسمّى بعينه لا «أخطأ» (${readout ? readout.textContent.split('\n')[0].slice(0, 60) : '—'})`);

    // ٢) لمسُ الكفّ أثناء القلم لا يكتب (ق٤)
    await writeStroke(body[0].slice(0, 6), 'pen');       // القلمُ يُعلن نفسَه
    const inkBefore = doc.querySelectorAll('.pen-ink path').length;
    await writeStroke([[60, 60], [80, 80]], 'touch');    // كفٌّ يستقرّ على الزاوية
    ok(doc.querySelectorAll('.pen-ink path').length === inkBefore,
      'ولمسُ الكفّ أثناء القلم لا يكتب شيئاً (ق٤: تُهمَل اللمسةُ ما دام القلمُ يكتب)');

    // ٣) دورةٌ صحيحة كاملة على لوحٍ نظيف: جسمان ثم نقطة
    const buttons = [...doc.querySelectorAll('.dev-row .btn')];
    buttons.find((b) => b.textContent.includes('أعِد'))?.click();
    await wait(120);
    for (const stroke of body) await writeStroke(stroke, 'pen');
    await writeStroke([dot, dot], 'pen');
    await wait(150);

    const done = doc.querySelector('.dev-readout')?.textContent || '';
    ok(/مقبول/.test(done) && !/غير مقبول/.test(done),
      `والكتابةُ الصحيحة تُقبَل على الشاشة (${done.split('\n')[0].slice(0, 40)})`);
    const trail = doc.querySelector('.pen-stroke--trail');
    ok(trail && Number(trail.getAttribute('stroke-dashoffset')) < 1,
      'والمسارُ تلوّن تحت القلم حتى آخره (مؤشّرُ التقدّم الحركيّ — METHOD §٥)');

    // ————— ٤) الخصوصية: صفرُ طلباتٍ في الدورة كلها —————
    const cycleNet = netCalls.slice(netMark);
    ok(cycleNet.length === 0,
      '**صفرُ طلباتٍ شبكية** في دورة الكتابة كلها (fetch/XHR/beacon/WS/SSE)'
      + `${cycleNet.length ? ' — ' + cycleNet.slice(0, 5).join('، ') : ''}`);
    // **ويُستثنى ما تجلبه الشاشةُ من زينتها** (خطوطٌ وأيقونات تُحمَّل كسولاً): لا
    // تحمل مساراً ولا تصعد بشيء، والمقيسُ هنا ألّا يخرج من الجهاز مسارُ طفل.
    const cycleRes = resources(win).slice(resMark)
      .filter((url) => !url.startsWith('blob:') && !url.startsWith('data:'))
      .filter((url) => !/\/(emoji|icons|fonts)\//.test(url));
    ok(cycleRes.length === 0,
      'ولا موردَ واحداً في سجلّ شبكة الصفحة طوال الدورة'
      + `${cycleRes.length ? ' — ' + cycleRes.slice(0, 5).join('، ') : ''}`);

    // **مجرَّبٌ سالباً — بعد إغلاق النافذة**: طلبٌ متعمَّد يجب أن يُمسَك، وإلا
    // فالعدّادُ أعمى وشهادتُه أعلاه لا قيمة لها.
    const before = netCalls.length;
    try { await win.fetch('/manifest.webmanifest'); } catch { /* لا يهمّ ردُّه */ }
    ok(netCalls.length > before,
      `والعدّادُ مجرَّبٌ سالباً: طلبٌ متعمَّد بعد الدورة يُمسَك (${netCalls.length - before})`);

    // ————— ٥) ولا شيءَ خارج أصل التطبيق في الجلسة كلها —————
    const external = (url) => /^https?:\/\//.test(url) && !url.startsWith(win.location.origin);
    ok(!netCalls.some(external) && !resources(win).some(external),
      `ولا طلبَ ولا موردَ من مضيفٍ آخر (${resources(win).length} مورداً كلُّها ملفاتُه)`);

    ok(doc.documentElement.scrollWidth <= win.innerWidth + 1,
      `ولا فائضَ أفقيّ (${doc.documentElement.scrollWidth} ≤ ${win.innerWidth})`);

    // ————— ٦) وأخيراً: لا خطأ جافاسكربت واحد —————
    ok(errors.length === 0,
      errors.length ? `أخطاءُ جافاسكربت: ${errors.join(' · ')}` : 'لا أخطاء جافاسكربت');
  } catch (e) {
    ok(false, `استثناء: ${e && e.message}`);
  }
  await send();
})();
</script>
</body>
</html>
